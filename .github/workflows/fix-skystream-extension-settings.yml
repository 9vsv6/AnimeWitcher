name: Fix extension settings runtime v2

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-extension-settings-runtime
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply settings runtime fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, text):
              Path(path).write_text(text, encoding="utf-8")

          def replace_required(text, old, new, marker):
              if new in text:
                  print(f"already applied: {marker}")
                  return text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"expected one anchor for {marker}, found {count}"
                  )
              print(f"applied: {marker}")
              return text.replace(old, new, 1)

          def regex_required(text, pattern, replacement, marker):
              if replacement in text:
                  print(f"already applied: {marker}")
                  return text
              updated, count = re.subn(
                  pattern,
                  lambda _match: replacement,
                  text,
                  count=1,
                  flags=re.MULTILINE | re.DOTALL,
              )
              if count != 1:
                  raise SystemExit(
                      f"expected one regex anchor for {marker}, found {count}"
                  )
              print(f"applied: {marker}")
              return updated

          manager_path = "lib/core/extensions/extension_manager.dart"
          manager = read(manager_path)

          runtime_helper = "\n".join([
              "  void _clearPluginRuntime(String packageName) {",
              "    _pluginScriptFutures.remove(packageName);",
              "    _dynamicProvidersMap.remove(packageName);",
              "    _clearSettingsRuntime(packageName);",
              "  }",
              "",
          ])
          if "void _clearPluginRuntime(String packageName)" not in manager:
              marker = "  @override\n  List<SkyStreamProvider> build() {"
              if manager.count(marker) != 1:
                  raise SystemExit("could not locate ExtensionManager.build")
              manager = manager.replace(marker, runtime_helper + marker, 1)
              print("applied: clear all per-plugin caches")
          else:
              print("already applied: clear all per-plugin caches")

          version_old = "\n".join([
              "            if (existing != null &&",
              "                plugin.version.toString() != existing.version) {",
              "              _removeProvidersForPackage(plugin.packageName);",
              "              needsLoad = true;",
              "            }",
          ])
          version_new = "\n".join([
              "            if (existing != null &&",
              "                plugin.version.toString() != existing.version) {",
              "              _clearPluginRuntime(plugin.packageName);",
              "              _removeProvidersForPackage(plugin.packageName);",
              "              needsLoad = true;",
              "            }",
          ])
          manager = replace_required(
              manager,
              version_old,
              version_new,
              "invalidate caches after extension updates",
          )

          manager = replace_required(
              manager,
              "    _clearSettingsRuntime(plugin.packageName);\n"
              "    _removeProvidersForPackage(plugin.packageName);",
              "    _clearPluginRuntime(plugin.packageName);\n"
              "    _removeProvidersForPackage(plugin.packageName);",
              "reload the current plugin script",
          )

          provider_method = "\n".join([
              "  bool _isSubProviderEnabled(String packageName, String providerId) {",
              "    final storage = ref.read(extensionRepositoryProvider);",
              "    final saved = storage.getExtensionData(",
              "      '$packageName:_provider_enabled_$providerId',",
              "    );",
              "    return saved == null || saved == 'true';",
              "  }",
          ])
          manager = regex_required(
              manager,
              r"  bool _isSubProviderEnabled\(String packageName, String providerId\) \{.*?^  \}",
              provider_method,
              "enable sub-providers by default",
          )
          write(manager_path, manager)

          screen_path = "lib/features/extensions/screens/extensions_screen.dart"
          screen = read(screen_path)

          settings_future_block = "\n".join([
              "  Future<List<PluginSettingDefinition>>? _settingsFuture;",
              "  String? _settingsFutureIdentity;",
              "",
              "  String _settingsIdentity(ExtensionPlugin plugin) =>",
              "      '${plugin.packageName}:${plugin.version}:${plugin.sourceUrl}';",
              "",
              "  Future<List<PluginSettingDefinition>> _settingsFor(ExtensionPlugin plugin) {",
              "    final identity = _settingsIdentity(plugin);",
              "    if (_settingsFuture == null || _settingsFutureIdentity != identity) {",
              "      _settingsFutureIdentity = identity;",
              "      _settingsFuture = ref",
              "          .read(extensionManagerProvider.notifier)",
              "          .getSettingsForPlugin(plugin);",
              "    }",
              "    return _settingsFuture!;",
              "  }",
              "",
              "  @override",
              "  void didUpdateWidget(covariant _PluginTile oldWidget) {",
              "    super.didUpdateWidget(oldWidget);",
              "    if (_settingsIdentity(oldWidget.plugin) !=",
              "        _settingsIdentity(widget.plugin)) {",
              "      _settingsFuture = null;",
              "      _settingsFutureIdentity = null;",
              "    }",
              "  }",
              "",
          ])
          screen = regex_required(
              screen,
              r"  Future<List<PluginSettingDefinition>>\? _settingsFuture;.*?(?=^  @override\n  void dispose\(\))",
              settings_future_block,
              "refresh settings after an extension update",
          )

          declaration = "\n".join([
              "                      final hasScriptSettings =",
              "                          snapshot.data?.isNotEmpty ?? false;",
              "                      final declaresScriptSettings =",
              "                          installedPlugin.manifest['hasSettings'] == true;",
              "                      final hasDomains =",
          ])
          screen = regex_required(
              screen,
              r"                      final hasScriptSettings =\n"
              r"                          snapshot\.data\?\.isNotEmpty \?\? false;\n"
              r"                      final hasDomains =",
              declaration,
              "recognize hasSettings from the plugin manifest",
          )

          screen = replace_required(
              screen,
              "                          hasScriptSettings ||\n"
              "                          hasDomains ||",
              "                          hasScriptSettings ||\n"
              "                          declaresScriptSettings ||\n"
              "                          hasDomains ||",
              "show only real settings buttons",
          )
          write(screen_path, screen)

          settings_path = (
              "lib/features/extensions/screens/plugin_settings_screen.dart"
          )
          settings = read(settings_path)
          url_method = "\n".join([
              "  String _normalizedUrl(String raw) {",
              "    var value = raw.trim();",
              "    if (value.isEmpty) return '';",
              "    if (!RegExp(r'^https?://', caseSensitive: false).hasMatch(value)) {",
              "      value = 'https://$value';",
              "    }",
              "    value = value.replaceFirst(RegExp(r'/+$'), '');",
              "    final uri = Uri.tryParse(value);",
              "    if (uri == null ||",
              "        (uri.scheme != 'http' && uri.scheme != 'https') ||",
              "        uri.host.isEmpty) {",
              "      throw const FormatException('Enter a valid HTTP or HTTPS URL');",
              "    }",
              "    return uri.origin;",
              "  }",
          ])
          settings = regex_required(
              settings,
              r"  String _normalizedUrl\(String raw\) \{.*?^  \}",
              url_method,
              "validate custom website URLs",
          )
          write(settings_path, settings)

          pubspec_path = "pubspec.yaml"
          pubspec = read(pubspec_path)
          if "version: 2.6.6+1" not in pubspec:
              pubspec = replace_required(
                  pubspec,
                  "version: 2.6.5+1",
                  "version: 2.6.6+1",
                  "bump the corrected build to 2.6.6",
              )
              write(pubspec_path, pubspec)
          else:
              print("already applied: bump the corrected build to 2.6.6")
          PY

      - name: Format changed Dart files
        run: >-
          dart format
          lib/core/extensions/extension_manager.dart
          lib/features/extensions/screens/extensions_screen.dart
          lib/features/extensions/screens/plugin_settings_screen.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Riverpod and other generated files
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No changes were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            pubspec.yaml \
            lib/core/extensions/extension_manager.dart \
            lib/features/extensions/screens/extensions_screen.dart \
            lib/features/extensions/screens/plugin_settings_screen.dart
          git commit -m "Fix extension settings runtime and cache handling"
          git push origin HEAD:main
