name: Add provider episode badges V3

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: add-provider-episode-badges-v3-main
  cancel-in-progress: false

jobs:
  apply-provider-episode-badges:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localization files
        run: flutter gen-l10n

      - name: Generate baseline Riverpod files
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Apply provider-defined episode badges
