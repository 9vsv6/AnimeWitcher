name: Improve anime details metadata

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: improve-anime-details-metadata-${{ github.ref }}
  cancel-in-progress: false

jobs:
  patch:
    name: Update details metadata and episode badges
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply UI changes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          premium = Path(
              "lib/features/details/presentation/widgets/premium_details_widgets.dart"
          )
          info = Path(
              "lib/features/details/presentation/widgets/anime_information_section.dart"
          )
          layout = Path(
              "lib/features/details/presentation/widgets/details_layout_widgets.dart"
          )
          card = Path("lib/shared/widgets/multimedia_card.dart")

          for path in (premium, info, layout, card):
              if not path.is_file():
                  raise SystemExit(f"Required file was not found: {path}")

          # ---------------------------------------------------------------------------
          # 1. Top metadata: add age rating and episode count with plugin fallbacks.
          # ---------------------------------------------------------------------------
          text = premium.read_text(encoding="utf-8")
          metadata_marker = (
              "// Details metadata v2: age rating and episode count use plugin fallbacks."
          )

          if metadata_marker not in text:
              anchor = '''    final showTypeBadge =
                  !isLoading || (contentType != MultimediaContentType.movie);

              return Wrap(
          '''
              replacement = '''    final showTypeBadge =
                  !isLoading || (contentType != MultimediaContentType.movie);

              // Details metadata v2: age rating and episode count use plugin fallbacks.
              String? clean(dynamic raw) {
                if (raw == null) return null;
                final value = raw.toString().trim();
                if (value.isEmpty || value.toLowerCase() == 'null') return null;
                return value;
              }

              final syncData = item.syncData ?? const <String, String>{};
              final ageRating = clean(syncData['awAge']) ?? clean(item.contentRating);
              final providerEpisodeCount = clean(syncData['awEpisodes']);
              final loadedEpisodeCount = item.episodes?.length ?? 0;
              final isArabic =
                  Localizations.localeOf(context).languageCode.toLowerCase() == 'ar';
              final episodeCount = providerEpisodeCount ??
                  (loadedEpisodeCount > 0
                      ? isArabic
                          ? '$loadedEpisodeCount حلقة'
                          : '$loadedEpisodeCount episodes'
                      : null);

              return Wrap(
          '''
              if anchor not in text:
                  raise SystemExit("Could not locate MetadataBar setup block.")
              text = text.replace(anchor, replacement, 1)

              rating_pattern = re.compile(
                  r'''        if \(item\.contentRating != null\)
                    _buildBorderedInfo\(context, item\.contentRating!\)
                  else if \(isLoading\)
                    ShimmerPlaceholder\.rectangular\(
                      width: 60,
                      height: 20,
                      borderRadius: 4,
                    \),
          '''
              )
              rating_replacement = '''        if (ageRating != null)
                    _buildBorderedInfo(context, ageRating)
                  else if (isLoading)
                    ShimmerPlaceholder.rectangular(
                      width: 60,
                      height: 20,
                      borderRadius: 4,
                    ),
          '''
              text, count = rating_pattern.subn(rating_replacement, text, count=1)
              if count != 1:
                  raise SystemExit("Could not replace the existing age-rating badge.")

              duration_block = '''        if (item.duration != null)
                    _buildIconInfo(context, Icons.timer_outlined, "${item.duration}m")
                  else if (isLoading)
                    ShimmerPlaceholder.rectangular(
                      width: 60,
                      height: 20,
                      borderRadius: 4,
                    ),

          '''
              episode_block = '''        if (item.duration != null)
                    _buildIconInfo(context, Icons.timer_outlined, "${item.duration}m")
                  else if (isLoading)
                    ShimmerPlaceholder.rectangular(
                      width: 60,
                      height: 20,
                      borderRadius: 4,
                    ),

                  if (episodeCount != null)
                    _buildIconInfo(
                      context,
                      Icons.video_library_outlined,
                      episodeCount,
                    )
                  else if (isLoading)
                    ShimmerPlaceholder.rectangular(
                      width: 70,
                      height: 20,
                      borderRadius: 4,
                    ),

          '''
              if duration_block not in text:
                  raise SystemExit("Could not locate the duration metadata block.")
              text = text.replace(duration_block, episode_block, 1)

          premium.write_text(text, encoding="utf-8")

          # ---------------------------------------------------------------------------
          # 2. Compact Anime Information section in the requested order.
          # ---------------------------------------------------------------------------
          info.write_text(
              r'''import 'package:flutter/material.dart';

          import '../../../../core/domain/entity/multimedia_item.dart';

          class AnimeInformationSection extends StatelessWidget {
            final MultimediaItem item;

            const AnimeInformationSection({super.key, required this.item});

            String? _clean(dynamic raw) {
              if (raw == null) return null;
              final value = raw.toString().trim();
              if (value.isEmpty || value.toLowerCase() == 'null') return null;
              return value;
            }

            String? _read(Map<String, String> data, List<String> keys) {
              for (final key in keys) {
                final value = _clean(data[key]);
                if (value != null) return value;
              }
              return null;
            }

            String _status(bool isArabic) {
              switch (item.status) {
                case ShowStatus.completed:
                  return isArabic ? 'مكتمل' : 'Completed';
                case ShowStatus.upcoming:
                  return isArabic ? 'قادم' : 'Upcoming';
                case ShowStatus.ongoing:
                  return isArabic ? 'مستمر' : 'Ongoing';
              }
            }

            @override
            Widget build(BuildContext context) {
              final isArabic =
                  Localizations.localeOf(context).languageCode.toLowerCase() == 'ar';
              final data = item.syncData ?? const <String, String>{};

              _AnimeInfoEntry? entry(
                String ar,
                String en,
                dynamic value,
                IconData icon,
              ) {
                final cleaned = _clean(value);
                if (cleaned == null) return null;
                return _AnimeInfoEntry(
                  label: isArabic ? ar : en,
                  value: cleaned,
                  icon: icon,
                );
              }

              final rows = <List<_AnimeInfoEntry?>>[
                [
                  entry(
                    'الحالة',
                    'Status',
                    _read(data, const ['awState']) ?? _status(isArabic),
                    Icons.wifi_tethering_rounded,
                  ),
                  entry(
                    'موسم العرض',
                    'Airing season',
                    _read(data, const ['awSeason']),
                    Icons.calendar_month_rounded,
                  ),
                ],
                [
                  entry(
                    'بداية العرض',
                    'Start date',
                    _read(data, const ['awStartDate']),
                    Icons.play_circle_outline_rounded,
                  ),
                  entry(
                    'نهاية العرض',
                    'End date',
                    _read(data, const ['awEndDate']),
                    Icons.stop_circle_outlined,
                  ),
                ],
                [
                  entry(
                    'المصدر',
                    'Source',
                    _read(data, const ['awSource']) ?? item.source,
                    Icons.menu_book_rounded,
                  ),
                  entry(
                    'الاستديو',
                    'Studio',
                    _read(data, const ['awStudio']),
                    Icons.apartment_rounded,
                  ),
                ],
              ];

              final englishTitle = entry(
                'العنوان الإنجليزي',
                'English title',
                _read(data, const ['awEnglishTitle']),
                Icons.translate_rounded,
              );

              final hasRows = rows.any((row) => row.any((value) => value != null));
              if (!hasRows && englishTitle == null) return const SizedBox.shrink();

              return Column(
                crossAxisAlignment: CrossAxisAlignment.start,
                children: [
                  Text(
                    isArabic ? 'معلومات الأنمي' : 'Anime information',
                    style: Theme.of(
                      context,
                    ).textTheme.titleLarge?.copyWith(fontWeight: FontWeight.w700),
                  ),
                  const SizedBox(height: 10),
                  for (final row in rows) ...[
                    if (row.any((value) => value != null))
                      Row(
                        crossAxisAlignment: CrossAxisAlignment.stretch,
                        children: [
                          for (var index = 0; index < row.length; index++) ...[
                            if (row[index] != null)
                              Expanded(child: _AnimeInfoCard(entry: row[index]!)),
                            if (index == 0 && row[0] != null && row[1] != null)
                              const SizedBox(width: 8),
                          ],
                        ],
                      ),
                    if (row.any((value) => value != null)) const SizedBox(height: 8),
                  ],
                  if (englishTitle != null)
                    SizedBox(
                      width: double.infinity,
                      child: _AnimeInfoCard(entry: englishTitle),
                    ),
                ],
              );
            }
          }

          class _AnimeInfoEntry {
            final String label;
            final String value;
            final IconData icon;

            const _AnimeInfoEntry({
              required this.label,
              required this.value,
              required this.icon,
            });
          }

          class _AnimeInfoCard extends StatelessWidget {
            final _AnimeInfoEntry entry;

            const _AnimeInfoCard({required this.entry});

            @override
            Widget build(BuildContext context) {
              final colors = Theme.of(context).colorScheme;

              return DecoratedBox(
                decoration: BoxDecoration(
                  color: colors.surfaceContainerHighest.withValues(alpha: 0.55),
                  borderRadius: BorderRadius.circular(11),
                  border: Border.all(
                    color: colors.outlineVariant.withValues(alpha: 0.45),
                  ),
                ),
                child: Padding(
                  padding: const EdgeInsets.symmetric(horizontal: 9, vertical: 8),
                  child: Row(
                    crossAxisAlignment: CrossAxisAlignment.start,
                    children: [
                      Icon(entry.icon, size: 18, color: colors.primary),
                      const SizedBox(width: 7),
                      Expanded(
                        child: Column(
                          crossAxisAlignment: CrossAxisAlignment.start,
                          children: [
                            Text(
                              entry.label,
                              maxLines: 1,
                              overflow: TextOverflow.ellipsis,
                              style: Theme.of(context).textTheme.labelSmall?.copyWith(
                                color: colors.onSurfaceVariant,
                                fontWeight: FontWeight.w600,
                              ),
                            ),
                            const SizedBox(height: 2),
                            SelectableText(
                              entry.value,
                              style: Theme.of(context).textTheme.bodySmall?.copyWith(
                                fontWeight: FontWeight.w600,
                              ),
                            ),
                          ],
                        ),
                      ),
                    ],
                  ),
                ),
              );
            }
          }
          ''',
              encoding="utf-8",
          )

          # ---------------------------------------------------------------------------
          # 3. Remove Preferred Quality from the details page.
          # ---------------------------------------------------------------------------
          text = layout.read_text(encoding="utf-8")
          quality_marker = "// Preferred quality is configured globally in Settings."

          if quality_marker not in text:
              text = text.replace(
                  "import '../../../settings/presentation/player_settings_provider.dart';\n",
                  "",
                  1,
              )
              text = text.replace(
                  "import '../../../../core/utils/stream_quality_sorter.dart';\n",
                  "",
                  1,
              )

              wifi_block = '''    final isWifiFuture = useMemoized(() => isOnWifi());
              final isWifiSnapshot = useFuture(isWifiFuture);
              final onWifi = isWifiSnapshot.data ?? true;

          '''
              if wifi_block not in text:
                  raise SystemExit("Could not locate Wi-Fi quality state.")
              text = text.replace(wifi_block, "", 1)

              quality_pattern = re.compile(
                  r'''    // Dynamic quality preference selector button
          [\s\S]*?
              // Download feature: only for single episode VOD content'''
              )
              text, count = quality_pattern.subn(
                  '''    // Preferred quality is configured globally in Settings.

              // Download feature: only for single episode VOD content''',
                  text,
                  count=1,
              )
              if count != 1:
                  raise SystemExit("Could not locate Preferred Quality selector.")

              children_block = '''        progressWidget,
                  qualityBtn,
                  const SizedBox(height: LayoutConstants.spacingSm),
                  actionRow,
          '''
              replacement = '''        progressWidget,
                  actionRow,
          '''
              if children_block not in text:
                  raise SystemExit("Could not remove Preferred Quality from action layout.")
              text = text.replace(children_block, replacement, 1)

          layout.write_text(text, encoding="utf-8")

          # ---------------------------------------------------------------------------
          # 4. Theme-colored episode badge pinned to the right.
          # ---------------------------------------------------------------------------
          text = card.read_text(encoding="utf-8")
          badge_marker = (
              "// Episode badge UI v2: use the active theme and pin to the right."
          )

          if badge_marker not in text:
              old_build_call = '''          child: isInside
                        ? _buildInsideMode(imageWidget, titleTextStyle, badgeText)
                        : _buildBelowMode(imageWidget, titleTextStyle, badgeText),
          '''
              new_build_call = '''          child: isInside
                        ? _buildInsideMode(
                            context,
                            imageWidget,
                            titleTextStyle,
                            badgeText,
                          )
                        : _buildBelowMode(
                            context,
                            imageWidget,
                            titleTextStyle,
                            badgeText,
                          ),
          '''
              if old_build_call not in text:
                  raise SystemExit("Could not locate multimedia card mode calls.")
              text = text.replace(old_build_call, new_build_call, 1)

              badge_pattern = re.compile(
                  r'''  Widget _buildEpisodeBadge\(String text\) \{
          [\s\S]*?
            \}

            Widget _buildBelowMode\('''
              )
              badge_replacement = r'''  Widget _buildEpisodeBadge(BuildContext context, String text) {
              // Episode badge UI v2: use the active theme and pin to the right.
              final colors = Theme.of(context).colorScheme;

              return Container(
                constraints: const BoxConstraints(maxWidth: 108),
                padding: const EdgeInsets.symmetric(horizontal: 7, vertical: 4),
                decoration: BoxDecoration(
                  color: colors.primary.withValues(alpha: 0.92),
                  borderRadius: BorderRadius.circular(7),
                  border: Border.all(
                    color: colors.primaryContainer.withValues(alpha: 0.85),
                    width: 0.8,
                  ),
                  boxShadow: [
                    BoxShadow(
                      color: colors.shadow.withValues(alpha: 0.28),
                      blurRadius: 5,
                      offset: const Offset(0, 2),
                    ),
                  ],
                ),
                child: Text(
                  text,
                  maxLines: 1,
                  overflow: TextOverflow.ellipsis,
                  style: TextStyle(
                    color: colors.onPrimary,
                    fontSize: 12,
                    height: 1,
                    fontWeight: FontWeight.w700,
                  ),
                ),
              );
            }

            Widget _buildBelowMode('''
              text, count = badge_pattern.subn(badge_replacement, text, count=1)
              if count != 1:
                  raise SystemExit("Could not replace episode badge style.")

              text = text.replace(
                  '''  Widget _buildBelowMode(
              Widget imageWidget,
          ''',
                  '''  Widget _buildBelowMode(
              BuildContext context,
              Widget imageWidget,
          ''',
                  1,
              )
              text = text.replace(
                  '''  Widget _buildInsideMode(
              Widget imageWidget,
          ''',
                  '''  Widget _buildInsideMode(
              BuildContext context,
              Widget imageWidget,
          ''',
                  1,
              )

              below_position = '''                Positioned(
                            left: 8,
                            bottom: 8,
                            child: _buildEpisodeBadge(badgeText),
          '''
              below_replacement = '''                Positioned(
                            right: 8,
                            bottom: 8,
                            child: _buildEpisodeBadge(context, badgeText),
          '''
              if below_position not in text:
                  raise SystemExit("Could not locate lower episode badge position.")
              text = text.replace(below_position, below_replacement, 1)

              inside_position = '''          Positioned(
                      left: 8,
                      bottom: (titleTextStyle.fontSize ?? 14) + 30,
                      child: _buildEpisodeBadge(badgeText),
          '''
              inside_replacement = '''          Positioned(
                      right: 8,
                      bottom: (titleTextStyle.fontSize ?? 14) + 30,
                      child: _buildEpisodeBadge(context, badgeText),
          '''
              if inside_position not in text:
                  raise SystemExit("Could not locate inside episode badge position.")
              text = text.replace(inside_position, inside_replacement, 1)

          card.write_text(text, encoding="utf-8")

          print("Details metadata, quality selector, information layout, and badges updated.")
          PY

      - name: Format changed Dart files
        run: |
          dart format \
            lib/features/details/presentation/widgets/premium_details_widgets.dart \
            lib/features/details/presentation/widgets/anime_information_section.dart \
            lib/features/details/presentation/widgets/details_layout_widgets.dart \
            lib/shared/widgets/multimedia_card.dart

      - name: Check patch
        run: |
          git diff --check
          git diff -- \
            lib/features/details/presentation/widgets/premium_details_widgets.dart \
            lib/features/details/presentation/widgets/anime_information_section.dart \
            lib/features/details/presentation/widgets/details_layout_widgets.dart \
            lib/shared/widgets/multimedia_card.dart

      - name: Generate Riverpod and other source files
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      - name: Analyze affected files
        run: |
          flutter analyze \
            --no-fatal-warnings \
            --no-fatal-infos \
            lib/features/details/presentation/widgets/premium_details_widgets.dart \
            lib/features/details/presentation/widgets/anime_information_section.dart \
            lib/features/details/presentation/widgets/details_layout_widgets.dart \
            lib/shared/widgets/multimedia_card.dart

      - name: Restore generated files
        shell: bash
        run: |
          git restore --worktree --staged -- '*.g.dart' '*.freezed.dart' 2>/dev/null || true
          git clean -f -- '**/*.g.dart' '**/*.freezed.dart' 2>/dev/null || true

      - name: Commit and push changes
        shell: bash
        run: |
          FILES=(
            lib/features/details/presentation/widgets/premium_details_widgets.dart
            lib/features/details/presentation/widgets/anime_information_section.dart
            lib/features/details/presentation/widgets/details_layout_widgets.dart
            lib/shared/widgets/multimedia_card.dart
          )

          if git diff --quiet -- "${FILES[@]}"; then
            echo "No changes were required."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "${FILES[@]}"
          git commit -m "refactor: improve anime metadata and episode badges"
          git push
