name: Fix details stability and episode loading

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-details-stability-${{ github.ref }}
  cancel-in-progress: false

jobs:
  patch:
    name: Apply and verify details fixes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply stability fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          anime_info = Path(
              "lib/features/details/presentation/widgets/anime_information_section.dart"
          )
          layout = Path(
              "lib/features/details/presentation/widgets/details_layout_widgets.dart"
          )
          js_provider = Path(
              "lib/core/extensions/providers/js_based_provider.dart"
          )

          for path in (anime_info, layout, js_provider):
              if not path.is_file():
                  raise SystemExit(f"Required file was not found: {path}")

          # ---------------------------------------------------------------------------
          # 1. Avoid an unbounded-height Row in the compact anime information section.
          # ---------------------------------------------------------------------------
          text = anime_info.read_text(encoding="utf-8")
          old = '''          if (row.any((value) => value != null))
                      Row(
                        crossAxisAlignment: CrossAxisAlignment.stretch,
          '''
          new = '''          if (row.any((value) => value != null))
                      Row(
                        // The section is inside a vertically unbounded scroll view.
                        // Stretch would request an infinite height at runtime.
                        crossAxisAlignment: CrossAxisAlignment.start,
          '''

          if old in text:
              text = text.replace(old, new, 1)
          elif "crossAxisAlignment: CrossAxisAlignment.start" not in text:
              raise SystemExit("Could not locate the anime information row alignment.")

          anime_info.write_text(text, encoding="utf-8")

          # ---------------------------------------------------------------------------
          # 2. Keep the desktop/TV episode list virtualized.
          #
          # The desktop hero is a SingleChildScrollView, so a shrink-wrapped GridView or
          # ListView would still eagerly build every episode. A bounded inner ListView
          # keeps the same single episode list while recycling off-screen rows.
          # ---------------------------------------------------------------------------
          text = layout.read_text(encoding="utf-8")
          class_marker = "class DetailsDesktopEpisodeColumn extends ConsumerWidget {"
          start = text.find(class_marker)
          if start < 0:
              raise SystemExit("Could not locate DetailsDesktopEpisodeColumn.")

          new_class = r'''class DetailsDesktopEpisodeColumn extends ConsumerWidget {
            final MultimediaItem parentItem;
            final String itemUrl;
            final bool isMovie;

            const DetailsDesktopEpisodeColumn({
              super.key,
              required this.parentItem,
              required this.itemUrl,
              required this.isMovie,
            });

            Widget _buildEpisodeRow(
              List<Episode> episodes,
              int rowIndex,
              int crossAxisCount,
            ) {
              final startIndex = rowIndex * crossAxisCount;
              final endIndex = (startIndex + crossAxisCount).clamp(0, episodes.length);
              final rowEpisodes = episodes.sublist(startIndex, endIndex);

              return IntrinsicHeight(
                child: Row(
                  crossAxisAlignment: CrossAxisAlignment.stretch,
                  children: [
                    for (var index = 0; index < crossAxisCount; index++)
                      Expanded(
                        child: Padding(
                          padding: EdgeInsets.only(
                            left: index == 0 ? 0 : 8,
                            right: index == crossAxisCount - 1 ? 0 : 8,
                          ),
                          child: index < rowEpisodes.length
                              ? EpisodeCard(
                                      episode: rowEpisodes[index],
                                      parentItem: parentItem,
                                    )
                                    as Widget
                              : const SizedBox.shrink(),
                        ),
                      ),
                  ],
                ),
              );
            }

            @override
            Widget build(BuildContext context, WidgetRef ref) {
              if (isMovie) return const SizedBox.shrink();

              final detailsState = ref.watch(detailsControllerProvider(itemUrl));
              var episodes = detailsState.seasonMap[detailsState.selectedSeason] ?? [];

              if (episodes.isEmpty) return const SizedBox.shrink();

              if (detailsState.selectedDubStatus != DubStatus.none) {
                episodes = episodes
                    .where((episode) => episode.dubStatus == detailsState.selectedDubStatus)
                    .toList(growable: false);
              }

              final displayedEpisodes = detailsState.isAscending
                  ? List<Episode>.from(episodes, growable: false)
                  : episodes.reversed.toList(growable: false);

              return Column(
                crossAxisAlignment: CrossAxisAlignment.start,
                children: [
                  Padding(
                    padding: const EdgeInsets.only(bottom: LayoutConstants.spacingMd),
                    child: Wrap(
                      alignment: WrapAlignment.spaceBetween,
                      crossAxisAlignment: WrapCrossAlignment.center,
                      spacing: 8,
                      runSpacing: 12,
                      children: [
                        Text(
                          AppLocalizations.of(context)!.episodes,
                          style: Theme.of(context).textTheme.headlineSmall?.copyWith(
                            fontWeight: FontWeight.bold,
                          ),
                        ),
                        DetailsEpisodeFilterBar(itemUrl: itemUrl),
                      ],
                    ),
                  ),
                  LayoutBuilder(
                    builder: (context, constraints) {
                      final crossAxisCount = (constraints.maxWidth / 480).ceil().clamp(
                        1,
                        5,
                      );
                      final rowCount = (displayedEpisodes.length / crossAxisCount).ceil();

                      // Small lists remain compact. Large lists receive a bounded,
                      // independently scrollable viewport so ListView can recycle rows.
                      final maximumHeight =
                          (MediaQuery.sizeOf(context).height * 0.72)
                              .clamp(420.0, 820.0)
                              .toDouble();
                      final desiredHeight =
                          (rowCount * 220.0) +
                          (rowCount > 1 ? (rowCount - 1) * 16.0 : 0.0);
                      final listHeight = desiredHeight < maximumHeight
                          ? desiredHeight
                          : maximumHeight;

                      return SizedBox(
                        height: listHeight,
                        child: Scrollbar(
                          child: ListView.separated(
                            primary: false,
                            padding: EdgeInsets.zero,
                            cacheExtent: 700,
                            keyboardDismissBehavior:
                                ScrollViewKeyboardDismissBehavior.onDrag,
                            itemCount: rowCount,
                            separatorBuilder: (_, _) => const SizedBox(height: 16),
                            itemBuilder: (context, rowIndex) => _buildEpisodeRow(
                              displayedEpisodes,
                              rowIndex,
                              crossAxisCount,
                            ),
                          ),
                        ),
                      );
                    },
                  ),
                ],
              );
            }
          }
          '''

          # This class is intentionally the final declaration in the current file.
          text = text[:start] + new_class
          layout.write_text(text, encoding="utf-8")

          # ---------------------------------------------------------------------------
          # 3. Fall back only when a split API export is absent.
          #
          # Real network/parsing/JavaScript errors must reach DetailsController so the
          # existing error state and Retry button are used instead of silently calling
          # the legacy API again.
          # ---------------------------------------------------------------------------
          text = js_provider.read_text(encoding="utf-8")

          limit_match = re.search(
              r"const int _kMaxResultListLength\s*=\s*(\d+)\s*;",
              text,
          )
          if limit_match is None:
              raise SystemExit("Could not verify the plugin result limit.")
          if int(limit_match.group(1)) < 2000:
              raise SystemExit(
                  "_kMaxResultListLength is too small for long-running anime series."
              )

          section_start = text.find("  MultimediaItem _detailFromPluginResult")
          section_end = text.find(
              "  @override\n  Future<List<StreamResult>> loadStreams",
              section_start,
          )
          if section_start < 0 or section_end < 0:
              raise SystemExit("Could not locate the split details/episodes API section.")

          replacement = r'''  MultimediaItem _detailFromPluginResult(dynamic result, String url) {
              if (result is! Map) {
                throw StateError('Extension returned invalid detail data.');
              }

              final map = Map<String, dynamic>.from(result);
              if (map['url'] == null || map['url'].toString().isEmpty) {
                map['url'] = url;
              }
              return MultimediaItem.fromJson(map);
            }

            bool _isMissingExportError(Object error, String exportName) {
              final message = error.toString();
              final qualifiedName = _fn(exportName);
              return message.contains('Function $qualifiedName not found') ||
                  message.contains('Function $exportName not found');
            }

            @override
            Future<MultimediaItem> getDetails(String url) async {
              await _ensureReady();
              if (_error != null) throw JsPluginException("INIT_ERROR", _error!);

              try {
                dynamic result;

                try {
                  result = await _jsEngine.invokeAsync(_fn('loadDetails'), [url]);
                } catch (error) {
                  if (!_isMissingExportError(error, 'loadDetails')) {
                    rethrow;
                  }

                  // Legacy extensions export only `load`.
                  result = await _jsEngine.invokeAsync(_fn('load'), [url]);
                }

                return _detailFromPluginResult(result, url);
              } on JsPluginException catch (error) {
                if (kDebugMode) {
                  debugPrint("JsPluginException in getDetails: $error");
                }
                talker.error("JsPluginException in getDetails: $error");
                rethrow;
              } catch (error) {
                if (kDebugMode) debugPrint("Error in getDetails: $error");
                talker.error("Error in getDetails: $error");
                rethrow;
              }
            }

            @override
            Future<List<Episode>> getEpisodes(String url) async {
              await _ensureReady();
              if (_error != null) throw JsPluginException("INIT_ERROR", _error!);

              try {
                dynamic result;

                try {
                  result = await _jsEngine.invokeAsync(_fn('loadEpisodes'), [url]);
                } catch (error) {
                  if (!_isMissingExportError(error, 'loadEpisodes')) {
                    rethrow;
                  }

                  // Legacy extensions keep episodes inside `load`/getDetails.
                  return await super.getEpisodes(url);
                }

                dynamic rawEpisodes = result;
                if (result is Map && result['episodes'] is List) {
                  rawEpisodes = result['episodes'];
                }

                if (rawEpisodes is! List) {
                  throw StateError('Extension returned invalid episode data.');
                }

                final bounded = rawEpisodes.length > _kMaxResultListLength
                    ? rawEpisodes.sublist(0, _kMaxResultListLength)
                    : rawEpisodes;

                if (kDebugMode && rawEpisodes.length > _kMaxResultListLength) {
                  debugPrint(
                    '[$_packageName] loadEpisodes returned ${rawEpisodes.length} '
                    'entries; capping to $_kMaxResultListLength.',
                  );
                }

                return bounded
                    .whereType<Map>()
                    .map((raw) => Episode.fromJson(Map<String, dynamic>.from(raw)))
                    .toList(growable: false);
              } on JsPluginException catch (error) {
                if (kDebugMode) {
                  debugPrint("JsPluginException in getEpisodes: $error");
                }
                talker.error("JsPluginException in getEpisodes: $error");
                rethrow;
              } catch (error) {
                if (kDebugMode) debugPrint("Error in getEpisodes: $error");
                talker.error("Error in getEpisodes: $error");
                rethrow;
              }
            }

          '''

          text = text[:section_start] + replacement + text[section_end:]
          js_provider.write_text(text, encoding="utf-8")

          print("Fixed anime information constraints, desktop episode virtualization, and split API error handling.")
          PY

      - name: Format affected files
        run: |
          dart format \
            lib/features/details/presentation/widgets/anime_information_section.dart \
            lib/features/details/presentation/widgets/details_layout_widgets.dart \
            lib/core/extensions/providers/js_based_provider.dart

      - name: Validate patch markers
        shell: bash
        run: |
          grep -F "crossAxisAlignment: CrossAxisAlignment.start" \
            lib/features/details/presentation/widgets/anime_information_section.dart
          grep -F "ListView.separated" \
            lib/features/details/presentation/widgets/details_layout_widgets.dart
          grep -F "_isMissingExportError" \
            lib/core/extensions/providers/js_based_provider.dart
          if grep -Fq "return await super.getEpisodes(url);" \
            lib/core/extensions/providers/js_based_provider.dart; then
            echo "Legacy fallback is present for a missing loadEpisodes export."
          else
            echo "Legacy loadEpisodes fallback is missing."
            exit 1
          fi
          git diff --check

      - name: Generate Riverpod and other source files
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      - name: Analyze affected files
        run: |
          flutter analyze \
            --no-fatal-warnings \
            --no-fatal-infos \
            lib/features/details/presentation/widgets/anime_information_section.dart \
            lib/features/details/presentation/widgets/details_layout_widgets.dart \
            lib/core/extensions/providers/js_based_provider.dart

      - name: Restore generated files
        shell: bash
        run: |
          git restore --worktree --staged -- '*.g.dart' '*.freezed.dart' 2>/dev/null || true
          git clean -f -- '**/*.g.dart' '**/*.freezed.dart' 2>/dev/null || true

      - name: Show final diff
        run: |
          git diff -- \
            lib/features/details/presentation/widgets/anime_information_section.dart \
            lib/features/details/presentation/widgets/details_layout_widgets.dart \
            lib/core/extensions/providers/js_based_provider.dart

      - name: Commit and push changes
        shell: bash
        run: |
          FILES=(
            lib/features/details/presentation/widgets/anime_information_section.dart
            lib/features/details/presentation/widgets/details_layout_widgets.dart
            lib/core/extensions/providers/js_based_provider.dart
          )

          if git diff --quiet -- "${FILES[@]}"; then
            echo "No changes were required."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${FILES[@]}"
          git commit -m "fix: stabilize details and virtualize episode lists"
          git push
