        run: |
          dart format             lib/shared/widgets/multimedia_card.dart             lib/features/explore/presentation/widgets/media_horizontal_list.dart             lib/features/explore/presentation/view_all_screen.dart

      - name: Validate
        run: |
          git diff --check
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet; then
            echo "No changes were required."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email             "41898282+github-actions[bot]@users.noreply.github.com"

          git add             lib/shared/widgets/multimedia_card.dart             lib/features/explore/presentation/widgets/media_horizontal_list.dart             lib/features/explore/presentation/view_all_screen.dart

          git commit -m "feat: show extension-localized episode badges"
          git push origin HEAD:main
