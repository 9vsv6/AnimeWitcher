name: Clean anime information cards

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: clean-anime-information-cards-main
  cancel-in-progress: false

jobs:
  clean-anime-information:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localization and Riverpod files
        run: |
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

