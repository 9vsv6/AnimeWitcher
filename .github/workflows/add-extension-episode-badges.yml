name: Apply filter button and lazy provider pagination v3

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-provider-lazy-pagination-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Apply search and pagination changes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import base64
          import re

          BASE = Path('lib/core/extensions/base_provider.dart')
          JS = Path('lib/core/extensions/providers/js_based_provider.dart')
          HOME = Path('lib/features/home/presentation/home_screen.dart')
          SEARCH = Path('lib/features/home/presentation/delegates/home_search_delegate.dart')
          VIEW = Path('lib/features/explore/presentation/view_all_screen.dart')
          MEDIA = Path('lib/features/explore/presentation/widgets/media_horizontal_list.dart')
          ROUTER = Path('lib/core/router/app_router.dart')

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              return text.replace(old, new, 1)

          SEARCH.write_bytes(base64.b64decode(''))
          VIEW.write_bytes(base64.b64decode(''))

          # --------------------------------------------------------------
          # Base provider: common page result + backward-compatible paging.
          # --------------------------------------------------------------
          base = BASE.read_text(encoding='utf-8')

          if 'class ProviderMediaPage' not in base:
              anchor = '\nabstract class SkyStreamProvider {'
              page_model = r'''
          class ProviderMediaPage {
            final List<MultimediaItem> items;
            final int nextOffset;
            final bool hasMore;

            const ProviderMediaPage({
              required this.items,
              required this.nextOffset,
              required this.hasMore,
            });
          }

          '''
              base = replace_once(
                  base,
                  anchor,
                  '\n' + page_model + 'abstract class SkyStreamProvider {',
                  'provider page model',
              )

          if 'Future<ProviderMediaPage> searchPage(' not in base:
              search_marker = '  // Returns categorized content (Section Name -> Items)\n'
              search_paging = r'''
            /// Loads one search page. Older providers remain compatible through
            /// a bounded slice of their existing search result.
            Future<ProviderMediaPage> searchPage(
              String query,
              ProviderSearchFilters filters, {
              int offset = 0,
              int limit = 30,
              CancelToken? cancelToken,
            }) async {
              final safeOffset = offset < 0 ? 0 : offset;
              final safeLimit = limit.clamp(1, 100).toInt();
              final all = await searchWithFilters(
                query,
                filters,
                cancelToken: cancelToken,
              );
              if (safeOffset >= all.length) {
                return ProviderMediaPage(
                  items: const <MultimediaItem>[],
                  nextOffset: safeOffset,
                  hasMore: false,
                );
              }
              final end = (safeOffset + safeLimit).clamp(0, all.length).toInt();
              return ProviderMediaPage(
                items: all.sublist(safeOffset, end),
                nextOffset: end,
                hasMore: end < all.length,
              );
            }

          '''
              base = replace_once(
                  base,
                  search_marker,
                  search_paging + search_marker,
                  'base search paging',
              )

          if 'Future<ProviderMediaPage> getHomeSectionPage(' not in base:
              home_anchor = '''  Future<List<MultimediaItem>> getHomeSection(String sectionName) async {
              final home = await getHome();
              return home[sectionName] ?? const <MultimediaItem>[];
            }
          '''
              home_page = home_anchor + r'''

            /// Loads one provider Home section page.
            Future<ProviderMediaPage> getHomeSectionPage(
              String sectionName, {
              int offset = 0,
              int limit = 30,
            }) async {
              final safeOffset = offset < 0 ? 0 : offset;
              final safeLimit = limit.clamp(1, 100).toInt();
              final all = await getHomeSection(sectionName);
              if (safeOffset >= all.length) {
                return ProviderMediaPage(
                  items: const <MultimediaItem>[],
                  nextOffset: safeOffset,
                  hasMore: false,
                );
              }
              final end = (safeOffset + safeLimit).clamp(0, all.length).toInt();
              return ProviderMediaPage(
                items: all.sublist(safeOffset, end),
                nextOffset: end,
                hasMore: end < all.length,
              );
            }
          '''
              base = replace_once(
                  base,
                  home_anchor,
                  home_page,
                  'base home paging',
              )

          BASE.write_text(base, encoding='utf-8')

          # --------------------------------------------------------------
          # JS provider: optional page exports and server-side page parsing.
          # --------------------------------------------------------------
          js = JS.read_text(encoding='utf-8')

          js = re.sub(
              r'static const int _iifeWrapperVersion\s*=\s*\d+;',
              'static const int _iifeWrapperVersion = 5;',
              js,
              count=1,
          )

          if 'getHomeSectionPage:' not in js:
              token = "                      getHomeSection: (typeof getHomeSection !== 'undefined') ? getHomeSection : (typeof globalThis.getHomeSection !== 'undefined' ? globalThis.getHomeSection : undefined),"
              inserted = token + "\n" + \
                  "                      getHomeSectionPage: (typeof getHomeSectionPage !== 'undefined') ? getHomeSectionPage : (typeof globalThis.getHomeSectionPage !== 'undefined' ? globalThis.getHomeSectionPage : undefined),"
              js = replace_once(js, token, inserted, 'JS home page export')

          if 'searchWithFiltersPage:' not in js:
              token = "                      searchWithFilters: (typeof searchWithFilters !== 'undefined') ? searchWithFilters : (typeof globalThis.searchWithFilters !== 'undefined' ? globalThis.searchWithFilters : undefined),"
              inserted = token + "\n" + \
                  "                      searchWithFiltersPage: (typeof searchWithFiltersPage !== 'undefined') ? searchWithFiltersPage : (typeof globalThis.searchWithFiltersPage !== 'undefined' ? globalThis.searchWithFiltersPage : undefined),\n" + \
                  "                      searchPage: (typeof searchPage !== 'undefined') ? searchPage : (typeof globalThis.searchPage !== 'undefined' ? globalThis.searchPage : undefined),"
              js = replace_once(js, token, inserted, 'JS search page exports')

          if 'delete globalThis.getHomeSectionPage' not in js:
              token = '              if (globalThis.getHomeSection) delete globalThis.getHomeSection;'
              js = replace_once(
                  js,
                  token,
                  token + '\n              if (globalThis.getHomeSectionPage) delete globalThis.getHomeSectionPage;',
                  'JS home page cleanup',
              )

          if 'delete globalThis.searchWithFiltersPage' not in js:
              token = '              if (globalThis.searchWithFilters) delete globalThis.searchWithFilters;'
              js = replace_once(
                  js,
                  token,
                  token + '\n              if (globalThis.searchWithFiltersPage) delete globalThis.searchWithFiltersPage;\n              if (globalThis.searchPage) delete globalThis.searchPage;',
                  'JS search page cleanup',
              )

          if 'Future<ProviderMediaPage> _parseProviderPage(' not in js:
              anchor = '''  @override
            Future<List<MultimediaItem>> getHomeSection(String sectionName) async {
          '''
              helper = r'''  Future<ProviderMediaPage> _parseProviderPage(
              dynamic result,
              int requestedOffset,
              int requestedLimit,
            ) async {
              if (result is! Map<Object?, Object?>) {
                throw StateError('Extension returned invalid page data.');
              }

              final map = Map<String, dynamic>.from(result);
              final rawItems = map['items'] ?? map['data'];
              if (rawItems is! List) {
                throw StateError('Extension page did not contain an item list.');
              }

              final bounded = rawItems.length > _kMaxResultListLength
                  ? rawItems.sublist(0, _kMaxResultListLength)
                  : rawItems;
              final items = await compute(_parseSearchResults, bounded);
              final parsedNext = int.tryParse(
                (map['nextOffset'] ?? map['next_offset'] ?? '').toString(),
              );
              final nextOffset =
                  parsedNext != null && parsedNext > requestedOffset
                  ? parsedNext
                  : requestedOffset + requestedLimit;
              final hasMoreValue = map['hasMore'] ?? map['has_more'];
              final hasMore = hasMoreValue is bool
                  ? hasMoreValue
                  : hasMoreValue.toString().toLowerCase() == 'true';

              return ProviderMediaPage(
                items: items,
                nextOffset: nextOffset,
                hasMore: hasMore,
              );
            }

          '''
              js = replace_once(
                  js,
                  anchor,
                  helper + anchor,
                  'JS provider page parser',
              )

          if 'Future<ProviderMediaPage> getHomeSectionPage(' not in js:
              anchor = '''  @override
            Future<ProviderSearchFilterOptions> getSearchFilterOptions() async {
          '''
              method = r'''  @override
            Future<ProviderMediaPage> getHomeSectionPage(
              String sectionName, {
              int offset = 0,
              int limit = 30,
            }) async {
              await _ensureReady();
              if (_error != null) throw JsPluginException('INIT_ERROR', _error!);

              try {
                return await _serializedInvoke(() async {
                  final result = await _jsEngine.invokeAsync(
                    _fn('getHomeSectionPage'),
                    <dynamic>[sectionName, offset, limit],
                  );
                  return _parseProviderPage(result, offset, limit);
                });
              } catch (error) {
                if (!_isMissingExportError(error, 'getHomeSectionPage') &&
                    kDebugMode) {
                  debugPrint(
                    'JsBasedProvider: getHomeSectionPage failed for '
                    '$_packageName/$sectionName: $error',
                  );
                }
                return super.getHomeSectionPage(
                  sectionName,
                  offset: offset,
                  limit: limit,
                );
              }
            }

          '''
              js = replace_once(
                  js,
                  anchor,
                  method + anchor,
                  'JS home page method',
              )

          if 'Future<ProviderMediaPage> searchPage(' not in js:
              anchor = '''  @override
            Future<List<MultimediaItem>> search(
          '''
              method = r'''  @override
            Future<ProviderMediaPage> searchPage(
              String query,
              ProviderSearchFilters filters, {
              int offset = 0,
              int limit = 30,
              CancelToken? cancelToken,
            }) async {
              await _ensureReady();
              if (_error != null) throw JsPluginException('INIT_ERROR', _error!);

              try {
                return await _serializedInvoke(() async {
                  dynamic result;
                  try {
                    result = await _jsEngine.invokeAsync(
                      _fn('searchWithFiltersPage'),
                      <dynamic>[query, filters.toJson(), offset, limit],
                      cancelToken,
                    );
                  } catch (error) {
                    if (!_isMissingExportError(
                      error,
                      'searchWithFiltersPage',
                    )) {
                      rethrow;
                    }
                    if (filters.isNotEmpty) rethrow;
                    result = await _jsEngine.invokeAsync(
                      _fn('searchPage'),
                      <dynamic>[query, offset, limit],
                      cancelToken,
                    );
                  }
                  return _parseProviderPage(result, offset, limit);
                });
              } catch (error) {
                if (kDebugMode &&
                    !_isMissingExportError(error, 'searchWithFiltersPage') &&
                    !_isMissingExportError(error, 'searchPage')) {
                  debugPrint(
                    'JsBasedProvider: paged search failed for '
                    '$_packageName: $error',
                  );
                }
                return super.searchPage(
                  query,
                  filters,
                  offset: offset,
                  limit: limit,
                  cancelToken: cancelToken,
                );
              }
            }

          '''
              js = replace_once(
                  js,
                  anchor,
                  method + anchor,
                  'JS search page method',
              )

          JS.write_text(js, encoding='utf-8')

          # --------------------------------------------------------------
          # Home: applying a filter opens results immediately without keyboard.
          # --------------------------------------------------------------
          home = HOME.read_text(encoding='utf-8')

          method_pattern = re.compile(
              r'  Future<void> _showProviderSearchFilters\(WidgetRef ref\) async \{.*?\n  \}\n\n  @override',
              re.S,
          )
          replacement = r'''  Future<void> _showProviderSearchFilters(WidgetRef ref) async {
            final provider = ref.read(activeProviderProvider);
            if (provider == null || _isLoadingProviderSearchFilters) return;

            if (_providerSearchFilterOwner != provider.packageName) {
              _providerSearchFilterOwner = provider.packageName;
              _providerSearchFilters = const ProviderSearchFilters();
            }

            ProviderSearchFilters? selectedForSearch;
            setState(() => _isLoadingProviderSearchFilters = true);
            try {
              final options =
                  _searchFilterOptionsCache[provider.packageName] ??
                  await provider.getSearchFilterOptions();
              _searchFilterOptionsCache[provider.packageName] = options;

              if (!mounted) return;
              if (options.isEmpty) {
                ScaffoldMessenger.of(context)
                  ..hideCurrentSnackBar()
                  ..showSnackBar(
                    SnackBar(
                      content: Text(
                        Localizations.localeOf(context).languageCode == 'ar'
                            ? 'هذه الإضافة لا توفر فلاتر بحث'
                            : 'This provider does not expose search filters',
                      ),
                      behavior: SnackBarBehavior.floating,
                    ),
                  );
                return;
              }

              final selected = await showDialog<ProviderSearchFilters>(
                context: context,
                builder: (dialogContext) => ProviderSearchFilterDialog(
                  options: options,
                  initialValue: _providerSearchFilters,
                ),
              );

              if (!mounted || selected == null) return;
              selectedForSearch = selected;
              setState(() {
                _providerSearchFilterOwner = provider.packageName;
                _providerSearchFilters = selected;
              });
            } finally {
              if (mounted) {
                setState(() => _isLoadingProviderSearchFilters = false);
              }
            }

            final selected = selectedForSearch;
            if (!mounted) return;

            await showSearch<void>(
              context: context,
              delegate: HomeSearchDelegate(
                filters: selected,
                openWithoutKeyboard: true,
                onFiltersChanged: (updated) {
                  if (!mounted) return;
                  setState(() {
                    _providerSearchFilterOwner = provider.packageName;
                    _providerSearchFilters = updated;
                  });
                },
              ),
              useRootNavigator: false,
              maintainState: true,
            );
          }

          @override'''
          home, count = method_pattern.subn(replacement, home, count=1)
          if count != 1:
              raise SystemExit(
                  f'home filter apply/open search: expected one method, found {count}'
              )

          home_loader_pattern = re.compile(
              r'(?P<indent>[ \t]*)loadViewAll:\s*\(\)\s*=>\s*activeProvider\.getHomeSection\(entry\.key\),',
              re.M,
          )
          home_loader_replacement = (
              r'\g<indent>loadViewAllPage: (offset, limit) =>\n'
              r'\g<indent>    activeProvider.getHomeSectionPage(\n'
              r'\g<indent>      entry.key,\n'
              r'\g<indent>      offset: offset,\n'
              r'\g<indent>      limit: limit,\n'
              r'\g<indent>    ),'
          )
          home, count = home_loader_pattern.subn(
              home_loader_replacement,
              home,
              count=1,
          )
          if count != 1:
              raise SystemExit(
                  f'home lazy View All callback: expected one match, found {count}'
              )
          HOME.write_text(home, encoding='utf-8')

          # --------------------------------------------------------------
          # Horizontal list + typed route pass a page loader, never full list.
          # --------------------------------------------------------------
          media = MEDIA.read_text(encoding='utf-8')
          media = replace_once(
              media,
              "import '../../../../core/domain/entity/multimedia_item.dart';\n",
              "import '../../../../core/domain/entity/multimedia_item.dart';\nimport '../../../../core/extensions/base_provider.dart';\n",
              'media page import',
          )
          media = replace_once(
              media,
              '  final Future<List<MultimediaItem>> Function()? loadViewAll;\n',
              '  final Future<ProviderMediaPage> Function(int offset, int limit)? loadViewAllPage;\n',
              'media page field',
          )
          media = replace_once(
              media,
              '    this.loadViewAll,\n',
              '    this.loadViewAllPage,\n',
              'media page constructor',
          )
          media = replace_once(
              media,
              '                        loadItems: widget.loadViewAll,\n',
              '                        loadPage: widget.loadViewAllPage,\n',
              'media route page callback',
          )
          MEDIA.write_text(media, encoding='utf-8')

          router = ROUTER.read_text(encoding='utf-8')
          router = replace_once(
              router,
              "import '../domain/entity/multimedia_item.dart';\n",
              "import '../domain/entity/multimedia_item.dart';\nimport '../extensions/base_provider.dart';\n",
              'router page import',
          )
          router = replace_once(
              router,
              '    this.loadItems,\n',
              '    this.loadPage,\n',
              'router page constructor',
          )
          router = replace_once(
              router,
              '  final Future<List<MultimediaItem>> Function()? loadItems;\n',
              '  final Future<ProviderMediaPage> Function(int offset, int limit)? loadPage;\n',
              'router page field',
          )
          router = replace_once(
              router,
              '      loadItems: $extra.loadItems,\n',
              '      loadPage: $extra.loadPage,\n',
              'router passes page callback',
          )
          ROUTER.write_text(router, encoding='utf-8')

          print('Applied filter button and true lazy provider pagination.')
          PY

      - name: Generate Riverpod and router code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Format changed Dart files
        run: |
          dart format             lib/core/extensions/base_provider.dart             lib/core/extensions/providers/js_based_provider.dart             lib/features/home/presentation/home_screen.dart             lib/features/home/presentation/delegates/home_search_delegate.dart             lib/features/explore/presentation/view_all_screen.dart             lib/features/explore/presentation/widgets/media_horizontal_list.dart             lib/core/router/app_router.dart

      - name: Analyze changed files
        run: |
          flutter analyze             lib/core/extensions/base_provider.dart             lib/core/extensions/providers/js_based_provider.dart             lib/features/home/presentation/home_screen.dart             lib/features/home/presentation/delegates/home_search_delegate.dart             lib/features/explore/presentation/view_all_screen.dart             lib/features/explore/presentation/widgets/media_horizontal_list.dart             lib/core/router/app_router.dart

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             lib/core/extensions/base_provider.dart             lib/core/extensions/providers/js_based_provider.dart             lib/features/home/presentation/home_screen.dart             lib/features/home/presentation/delegates/home_search_delegate.dart             lib/features/explore/presentation/view_all_screen.dart             lib/features/explore/presentation/widgets/media_horizontal_list.dart             lib/core/router/app_router.dart             lib/core/router/app_router.g.dart

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "feat: add filtered search and lazy provider pagination"
          git push origin HEAD:main
