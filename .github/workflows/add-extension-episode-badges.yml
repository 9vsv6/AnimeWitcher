name: Add provider episode badges V2

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: add-provider-episode-badges-v2-main
  cancel-in-progress: false

jobs:
  apply-provider-episode-badges:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localization files
        run: flutter gen-l10n

      - name: Generate baseline Riverpod files
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Apply provider-defined episode badges
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/apply_provider_episode_badges.py.b64 <<'B64'
          
          B64

          base64 --decode /tmp/apply_provider_episode_badges.py.b64 \
            > /tmp/apply_provider_episode_badges.py

          python3 /tmp/apply_provider_episode_badges.py

      - name: Format modified Dart files
        run: |
          dart format \
            lib/core/domain/entity/multimedia_item.dart \
            lib/shared/widgets/multimedia_card.dart \
            lib/features/explore/presentation/widgets/media_horizontal_list.dart \
            lib/features/explore/presentation/view_all_screen.dart

      - name: Refresh generated files after patch
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Verify provider badge implementation
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq "final String? episodeBadge;" \
            lib/core/domain/entity/multimedia_item.dart

          grep -Fq "episodeBadge: item.episodeBadge," \
            lib/features/explore/presentation/widgets/media_horizontal_list.dart

          grep -Fq "episodeBadge: item.episodeBadge," \
            lib/features/explore/presentation/view_all_screen.dart

          grep -Fq "_buildEpisodeBadge" \
            lib/shared/widgets/multimedia_card.dart

      - name: Check diff
        run: git diff --check

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail

          git add \
            lib/core/domain/entity/multimedia_item.dart \
            lib/shared/widgets/multimedia_card.dart \
            lib/features/explore/presentation/widgets/media_horizontal_list.dart \
            lib/features/explore/presentation/view_all_screen.dart

          if git diff --cached --quiet; then
            echo "No source changes were required."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "feat: show provider-defined episode badges"
          git push origin main
