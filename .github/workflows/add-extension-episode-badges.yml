name: Add localized episode badges v2

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: localized-episode-badges-v2-main
  cancel-in-progress: false

jobs:
  apply-episode-badges:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

