name: Simplify episode list UI

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: simplify-episode-list-ui-${{ github.ref }}
  cancel-in-progress: false

jobs:
  patch:
    name: Show all episodes and improve details tabs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply episode UI changes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          details_screen = Path(
              "lib/features/details/presentation/details_screen.dart"
          )
          layout_widgets = Path(
              "lib/features/details/presentation/widgets/details_layout_widgets.dart"
          )

          for path in (details_screen, layout_widgets):
              if not path.is_file():
                  raise SystemExit(f"Required file was not found: {path}")

          # ---------------------------------------------------------------
          # details_screen.dart
          # ---------------------------------------------------------------
          text = details_screen.read_text(encoding="utf-8")

          tabs_marker = (
              "// Episode UI v2: equal-width tabs without selected checkmarks."
          )
          if tabs_marker not in text:
              tabs_pattern = re.compile(
                  r"  Widget _buildDetailsPageTabs\("
                  r"[\s\S]*?"
                  r"\n  Widget _episodeLoadStatus\("
              )

              tabs_replacement = r'''  Widget _buildDetailsPageTabs(
              BuildContext context,
              AsyncValue<List<Episode>> episodesState,
            ) {
              final isArabic =
                  Localizations.localeOf(context).languageCode.toLowerCase() == 'ar';
              final episodeCount = episodesState.asData?.value.length ?? 0;
              final episodeLabel = episodeCount > 0
                  ? '${isArabic ? 'الحلقات' : 'Episodes'} ($episodeCount)'
                  : isArabic
                  ? 'الحلقات'
                  : 'Episodes';

              // Episode UI v2: equal-width tabs without selected checkmarks.
              Widget tab({
                required bool selected,
                required Widget leading,
                required String label,
                required VoidCallback onTap,
              }) {
                return ChoiceChip(
                  selected: selected,
                  showCheckmark: false,
                  labelPadding: const EdgeInsets.symmetric(horizontal: 8, vertical: 8),
                  label: SizedBox(
          width: double.infinity,
          child: Row(
            mainAxisAlignment: MainAxisAlignment.center,
            mainAxisSize: MainAxisSize.max,
            children: [
              leading,
              const SizedBox(width: 10),
              Flexible(
                child: Text(
                  label,
                  maxLines: 1,
                  overflow: TextOverflow.ellipsis,
                  textAlign: TextAlign.center,
                ),
              ),
            ],
          ),
                  ),
                  onSelected: (_) => onTap(),
                );
              }

              return Row(
                children: [
                  Expanded(
          child: tab(
            selected: _selectedDetailsTab == 0,
            leading: const Icon(Icons.info_outline_rounded, size: 21),
            label: isArabic ? 'التفاصيل' : 'Details',
            onTap: () {
              if (_selectedDetailsTab == 0) return;
              setState(() => _selectedDetailsTab = 0);
            },
          ),
                  ),
                  const SizedBox(width: 10),
                  Expanded(
          child: tab(
            selected: _selectedDetailsTab == 1,
            leading: episodesState.isLoading
                ? const SizedBox.square(
                    dimension: 19,
                    child: CircularProgressIndicator(strokeWidth: 2),
                  )
                : const Icon(Icons.video_library_outlined, size: 21),
            label: episodeLabel,
            onTap: () {
              if (_selectedDetailsTab == 1) return;
              setState(() => _selectedDetailsTab = 1);
            },
          ),
                  ),
                ],
              );
            }

            Widget _episodeLoadStatus('''

              text, count = tabs_pattern.subn(tabs_replacement, text, count=1)
              if count != 1:
                  raise SystemExit(
                      "Could not locate _buildDetailsPageTabs in "
                      f"{details_screen}"
                  )

          loading_marker = (
              "// Episode UI v2: keep the loading state centered horizontally."
          )
          if loading_marker not in text:
              loading_pattern = re.compile(
                  r"    if \(episodesState\.isLoading\) \{"
                  r"[\s\S]*?"
                  r"\n    \}"
                  r"\n\n    if \(episodesState\.hasError\)"
              )

              loading_replacement = r'''    if (episodesState.isLoading) {
                // Episode UI v2: keep the loading state centered horizontally.
                return Padding(
                  padding: const EdgeInsets.symmetric(vertical: 36),
                  child: Center(
          child: Column(
            mainAxisSize: MainAxisSize.min,
            crossAxisAlignment: CrossAxisAlignment.center,
            children: [
              const AppLoadingIndicator(),
              const SizedBox(height: 12),
              Text(
                isArabic
                    ? 'يتم تحميل الحلقات في الخلفية…'
                    : 'Episodes are loading in the background…',
                textAlign: TextAlign.center,
              ),
            ],
          ),
                  ),
                );
              }

              if (episodesState.hasError)'''

              text, count = loading_pattern.subn(
                  loading_replacement,
                  text,
                  count=1,
              )
              if count != 1:
                  raise SystemExit(
                      "Could not locate the episode loading block in "
                      f"{details_screen}"
                  )

          details_screen.write_text(text, encoding="utf-8")

          # ---------------------------------------------------------------
          # details_layout_widgets.dart
          # ---------------------------------------------------------------
          text = layout_widgets.read_text(encoding="utf-8")

          list_marker = (
              "// Episode list UI v2: show every filtered episode without "
              "range batching."
          )
          if list_marker not in text:
              batching_pattern = re.compile(
                  r"    // Apply Batching \(FIRST\)\n"
                  r"    const int batchSize = 20;\n"
                  r"    final int start = "
                  r"detailsState\.selectedRangeIndex \* batchSize;\n"
                  r"    final int end = "
                  r"\(start \+ batchSize\)\.clamp\(0, episodes\.length\);\n"
                  r"    List<Episode> displayedEpisodes = "
                  r"episodes\.sublist\(start, end\);\n\n"
                  r"    // Apply Sorting "
                  r"\(SECOND - only on the batch\)"
              )

              batching_replacement = r'''    // Episode list UI v2: show every filtered episode without range batching.
              List<Episode> displayedEpisodes = List<Episode>.from(episodes);

              // Apply sorting to the complete filtered list.'''

              text, count = batching_pattern.subn(
                  batching_replacement,
                  text,
              )
              if count != 3:
                  raise SystemExit(
                      "Expected to remove batching from 3 episode views, "
                      f"but changed {count} in {layout_widgets}"
                  )

              filter_call_pattern = re.compile(
                  r"(?P<base>[ \t]*)DetailsEpisodeFilterBar\(\n"
                  r"(?P<arg>[ \t]*)itemUrl: itemUrl,\n"
                  r"\s*totalEpisodes: episodes\.length,\n"
                  r"\s*batchSize: batchSize,\n"
                  r"\s*\)"
              )

              def simplify_filter_call(match):
                  base = match.group("base")
                  arg = match.group("arg")
                  return (
                      f"{base}DetailsEpisodeFilterBar(\n"
                      f"{arg}itemUrl: itemUrl,\n"
                      f"{base})"
                  )

              text, count = filter_call_pattern.subn(
                  simplify_filter_call,
                  text,
              )
              if count != 3:
                  raise SystemExit(
                      "Expected to simplify 3 DetailsEpisodeFilterBar calls, "
                      f"but changed {count} in {layout_widgets}"
                  )

              filter_class_pattern = re.compile(
                  r"class DetailsEpisodeFilterBar extends ConsumerWidget \{"
                  r"[\s\S]*?"
                  r"\n\}\n\nclass _LanguageButton"
              )

              filter_class_replacement = r'''class DetailsEpisodeFilterBar extends ConsumerWidget {
            final String itemUrl;

            const DetailsEpisodeFilterBar({
              super.key,
              required this.itemUrl,
            });

            @override
            Widget build(BuildContext context, WidgetRef ref) {
              final detailsState = ref.watch(detailsControllerProvider(itemUrl));
              final bool isAscending = detailsState.isAscending;
              final DubStatus selectedDub = detailsState.selectedDubStatus;

              final allEpisodes =
                  detailsState.seasonMap[detailsState.selectedSeason] ?? [];

              final hasDub = allEpisodes.any((e) => e.dubStatus == DubStatus.dubbed);
              final hasSub = allEpisodes.any((e) => e.dubStatus == DubStatus.subbed);
              final isMixed = hasDub && hasSub;

              return SizedBox(
                height: 40,
                child: Row(
                  mainAxisSize: MainAxisSize.min,
                  crossAxisAlignment: CrossAxisAlignment.stretch,
                  children: [
          if (isMixed) ...[
            _buildLanguageToggle(context, ref, selectedDub),
            const SizedBox(width: 8),
          ],
          Material(
            color: Colors.transparent,
            child: Ink(
              decoration: BoxDecoration(
                color: Theme.of(context).colorScheme.surfaceContainer,
                borderRadius: BorderRadius.circular(10),
              ),
              child: InkWell(
                borderRadius: BorderRadius.circular(10),
                onTap: () => ref
                    .read(detailsControllerProvider(itemUrl).notifier)
                    .toggleSort(),
                child: Padding(
                  padding: const EdgeInsets.symmetric(horizontal: 10),
                  child: Icon(
                    Icons.swap_vert_rounded,
                    size: 22,
                    color: isAscending
                        ? Theme.of(context).colorScheme.primary
                        : Theme.of(context).colorScheme.onSurfaceVariant,
                  ),
                ),
              ),
            ),
          ),
                  ],
                ),
              );
            }

            Widget _buildLanguageToggle(
              BuildContext context,
              WidgetRef ref,
              DubStatus selected,
            ) {
              return Container(
                decoration: BoxDecoration(
                  color: Theme.of(context).colorScheme.surfaceContainer,
                  borderRadius: BorderRadius.circular(10),
                ),
                padding: const EdgeInsets.all(4),
                child: Row(
                  mainAxisSize: MainAxisSize.min,
                  children: [
          _LanguageButton(
            label: AppLocalizations.of(context)!.sub,
            isSelected: selected == DubStatus.subbed,
            onTap: () => ref
                .read(detailsControllerProvider(itemUrl).notifier)
                .setDubStatus(DubStatus.subbed),
          ),
          const SizedBox(width: 4),
          _LanguageButton(
            label: AppLocalizations.of(context)!.dub,
            isSelected: selected == DubStatus.dubbed,
            onTap: () => ref
                .read(detailsControllerProvider(itemUrl).notifier)
                .setDubStatus(DubStatus.dubbed),
          ),
                  ],
                ),
              );
            }
          }

          class _LanguageButton'''

              text, count = filter_class_pattern.subn(
                  filter_class_replacement,
                  text,
                  count=1,
              )
              if count != 1:
                  raise SystemExit(
                      "Could not replace DetailsEpisodeFilterBar in "
                      f"{layout_widgets}"
                  )

          forbidden = [
              "const int batchSize = 20;",
              "episodes.sublist(start, end)",
              "DropdownButton<int>(",
          ]
          remaining = [value for value in forbidden if value in text]
          if remaining:
              raise SystemExit(
                  "Episode range UI still contains: " + ", ".join(remaining)
              )

          layout_widgets.write_text(text, encoding="utf-8")

          print("Episode UI patch applied successfully.")
          PY

      - name: Format changed Dart files
        run: |
          dart format \
            lib/features/details/presentation/details_screen.dart \
            lib/features/details/presentation/widgets/details_layout_widgets.dart

      - name: Check patch
        run: |
          git diff --check
          git diff -- \
            lib/features/details/presentation/details_screen.dart \
            lib/features/details/presentation/widgets/details_layout_widgets.dart

      - name: Generate Riverpod and other source files
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      - name: Analyze affected files
        run: |
          flutter analyze \
            --no-fatal-warnings \
            --no-fatal-infos \
            lib/features/details/presentation/details_screen.dart \
            lib/features/details/presentation/widgets/details_layout_widgets.dart

      - name: Restore generated files
        shell: bash
        run: |
          git status --short
          git restore --worktree --staged -- '*.g.dart' '*.freezed.dart' 2>/dev/null || true
          git clean -f -- '**/*.g.dart' '**/*.freezed.dart' 2>/dev/null || true

      - name: Commit and push changes
        shell: bash
        run: |
          if git diff --quiet -- \
            lib/features/details/presentation/details_screen.dart \
            lib/features/details/presentation/widgets/details_layout_widgets.dart; then
            echo "No changes were required."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            lib/features/details/presentation/details_screen.dart \
            lib/features/details/presentation/widgets/details_layout_widgets.dart

          git commit -m "refactor: show all episodes and improve details tabs"
          git push
