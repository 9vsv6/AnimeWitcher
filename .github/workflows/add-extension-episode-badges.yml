            | base64 --decode \
            > lib/features/details/presentation/widgets/anime_information_section.dart

      - name: Format
        run: dart format lib/features/details/presentation/widgets/anime_information_section.dart

      - name: Verify removed and retained cards
        shell: bash
        run: |
          set -euo pipefail
          file="lib/features/details/presentation/widgets/anime_information_section.dart"
          for removed in awType awYear awMalScore awMalRank awMalScoringUsers awScore awRatingsCount awViews awFavorites malId anilistId; do
            if grep -Fq "$removed" "$file"; then
              echo "Removed card is still present: $removed"
              exit 1
            fi
          done
          for kept in awEnglishTitle awStudio awSource awState awSeason awStartDate awEpisodes awDuration awAge; do
            grep -Fq "$kept" "$file"
          done

      - name: Check diff
        run: git diff --check

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git add lib/features/details/presentation/widgets/anime_information_section.dart
          if git diff --cached --quiet; then
            echo "No source changes were required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor: simplify anime information page"
          git push origin main
