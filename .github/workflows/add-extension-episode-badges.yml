      - name: Format modified Dart files
        run: |
          dart format             lib/core/domain/entity/multimedia_item.dart             lib/core/models/tmdb_details.dart             lib/shared/widgets/multimedia_card.dart             lib/features/explore/presentation/widgets/media_horizontal_list.dart             lib/features/explore/presentation/view_all_screen.dart

      - name: Refresh generated files after patch
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Verify provider badge implementation
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq "final String? episodeBadge;"             lib/core/domain/entity/multimedia_item.dart

          grep -Fq "super.episodeBadge,"             lib/core/models/tmdb_details.dart

          grep -Fq "episodeBadge: episodeBadge ?? this.episodeBadge,"             lib/core/models/tmdb_details.dart

          grep -Fq "episodeBadge: item.episodeBadge,"             lib/features/explore/presentation/widgets/media_horizontal_list.dart

          grep -Fq "episodeBadge: item.episodeBadge,"             lib/features/explore/presentation/view_all_screen.dart

          grep -Fq "_buildEpisodeBadge"             lib/shared/widgets/multimedia_card.dart

      - name: Check diff
        run: git diff --check

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail

          git add             lib/core/domain/entity/multimedia_item.dart             lib/core/models/tmdb_details.dart             lib/shared/widgets/multimedia_card.dart             lib/features/explore/presentation/widgets/media_horizontal_list.dart             lib/features/explore/presentation/view_all_screen.dart

          if git diff --cached --quiet; then
            echo "No source changes were required."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email             "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "feat: show provider-defined episode badges"
          git push origin main
