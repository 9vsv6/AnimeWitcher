name: Apply details tabs, synopsis, and genres UI

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-details-ui:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          cache: true

      - name: Apply details UI changes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          DETAILS_PATH = Path('lib/features/details/presentation/details_screen.dart')
          HERO_PATH = Path(
              'lib/features/details/presentation/widgets/details_desktop_hero.dart'
          )


          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)


          def insert_before_once(text: str, marker: str, insertion: str, label: str) -> str:
              count = text.count(marker)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one marker, found {count}')
              return text.replace(marker, insertion + marker, 1)


          details = DETAILS_PATH.read_text(encoding='utf-8')

          helper_marker = '  /// Content rendered below the desktop hero.\n'
          helper_code = r'''  List<String> _normalizedGenres(MultimediaItem item) {
              final seen = <String>{};
              final genres = <String>[];

              for (final rawTag in item.tags ?? const <String>[]) {
                for (final candidate in rawTag.split(RegExp(r'[,،|/]'))) {
                  final genre = candidate.trim();
                  if (genre.isEmpty) continue;

                  final key = genre.toLowerCase();
                  if (seen.add(key)) {
                    genres.add(genre);
                  }
                }
              }

              return genres;
            }

            Widget _buildSynopsisAndGenres(
              BuildContext context,
              MultimediaItem item,
              AsyncValue<MultimediaItem?> detailsState,
              AppLocalizations l10n,
            ) {
              final theme = Theme.of(context);
              final colors = theme.colorScheme;
              final isArabic =
                  Localizations.localeOf(context).languageCode.toLowerCase() == 'ar';
              final genres = _normalizedGenres(item);

              return Column(
                crossAxisAlignment: CrossAxisAlignment.start,
                children: [
                  Text(
                    l10n.synopsis,
                    style: theme.textTheme.titleLarge?.copyWith(
                      fontWeight: FontWeight.w700,
                    ),
                  ),
                  const SizedBox(height: 8),
                  ExpandableText(
                    text: item.description ?? l10n.noDescription,
                    maxLines: 4,
                    style: theme.textTheme.bodyLarge?.copyWith(
                      color: theme.textTheme.bodyMedium?.color,
                      height: 1.5,
                    ),
                  ),
                  if (detailsState.hasError) ...[
                    const SizedBox(height: 18),
                    Text(
                      l10n.errorPrefix(detailsState.error.toString()),
                      style: TextStyle(color: colors.error),
                    ),
                  ],
                  if (genres.isNotEmpty) ...[
                    const SizedBox(height: 28),
                    Text(
                      isArabic ? 'التصنيفات' : 'Genres',
                      style: theme.textTheme.titleLarge?.copyWith(
                        fontWeight: FontWeight.w700,
                      ),
                    ),
                    const SizedBox(height: 12),
                    Wrap(
                      spacing: 10,
                      runSpacing: 10,
                      children: [
                        for (final genre in genres)
                          DecoratedBox(
                            decoration: BoxDecoration(
                              color: colors.primary,
                              borderRadius: BorderRadius.circular(999),
                              boxShadow: [
                                BoxShadow(
                                  color: colors.primary.withValues(alpha: 0.18),
                                  blurRadius: 10,
                                  offset: const Offset(0, 3),
                                ),
                              ],
                            ),
                            child: Padding(
                              padding: const EdgeInsets.symmetric(
                                horizontal: 18,
                                vertical: 10,
                              ),
                              child: Text(
                                genre,
                                style: theme.textTheme.labelLarge?.copyWith(
                                  color: colors.onPrimary,
                                  fontWeight: FontWeight.w700,
                                ),
                              ),
                            ),
                          ),
                      ],
                    ),
                  ],
                ],
              );
            }

          '''

          details = insert_before_once(
              details,
              helper_marker,
              helper_code,
              'insert synopsis and genres helpers',
          )

          # Desktop/TV: tabs already sit above the details content. Insert the synopsis
          # and genre chips inside that details branch, before the information cards.
          desktop_branch = '        if (_selectedDetailsTab == 0 || isMovie) ...[\n'
          desktop_start = details.index(desktop_branch)
          desktop_info = '          AnimeInformationSection(item: item),\n'
          desktop_info_index = details.index(desktop_info, desktop_start)
          desktop_replacement = (
              '          _buildSynopsisAndGenres(context, item, detailsState, l10n),\n'
              '          const SizedBox(height: 28),\n'
              + desktop_info
          )
          details = (
              details[:desktop_info_index]
              + desktop_replacement
              + details[desktop_info_index + len(desktop_info):]
          )

          # Mobile: remove the synopsis from the always-visible hero portion and leave
          # the tabs directly above the tab-specific content.
          mobile_synopsis_start_marker = (
              '              const SizedBox(height: 24),\n'
              '              Text(\n'
              '                l10n.synopsis,\n'
          )
          mobile_synopsis_start = details.index(mobile_synopsis_start_marker)
          mobile_tabs_block = (
              '              if (!isMovie) ...[\n'
              '                const SizedBox(height: 28),\n'
              '                _buildDetailsPageTabs(context, episodesState),\n'
              '              ],\n'
          )
          mobile_tabs_start = details.index(mobile_tabs_block, mobile_synopsis_start)
          mobile_tabs_end = mobile_tabs_start + len(mobile_tabs_block)
          mobile_tabs_replacement = (
              '              const SizedBox(height: 24),\n'
              '              if (!isMovie) _buildDetailsPageTabs(context, episodesState),\n'
          )
          details = (
              details[:mobile_synopsis_start]
              + mobile_tabs_replacement
              + details[mobile_tabs_end:]
          )

          # Mobile details tab: synopsis -> genres -> anime information. Because this
          # lives under showDetailsPage, all three disappear when Episodes is selected.
          mobile_details_start = details.index('    if (showDetailsPage) {\n')
          mobile_info = '                AnimeInformationSection(item: item),\n'
          mobile_info_index = details.index(mobile_info, mobile_details_start)
          mobile_replacement = (
              '                _buildSynopsisAndGenres(context, item, detailsState, l10n),\n'
              '                const SizedBox(height: 28),\n'
              + mobile_info
          )
          details = (
              details[:mobile_info_index]
              + mobile_replacement
              + details[mobile_info_index + len(mobile_info):]
          )

          DETAILS_PATH.write_text(details, encoding='utf-8')

          # Desktop hero previously rendered the synopsis outside the Details tab.
          # Remove it there so it is shown only by the shared details content above.
          hero = HERO_PATH.read_text(encoding='utf-8')
          hero = replace_once(
              hero,
              "import '../../../../shared/widgets/expandable_text.dart';\n",
              '',
              'remove desktop expandable text import',
          )
          hero = replace_once(
              hero,
              "import 'package:skystream/l10n/generated/app_localizations.dart';\n",
              '',
              'remove desktop localization import',
          )
          hero = replace_once(
              hero,
              "    final textSecondary = textColor.withValues(alpha: 0.7);\n"
              "    final l10n = AppLocalizations.of(context)!;\n",
              '',
              'remove desktop synopsis local variables',
          )

          hero_synopsis_block = '''                      const SizedBox(height: 20),

                                // Synopsis
                                ExpandableText(
                                  text: displayItem.description ?? l10n.noDescription,
                                  maxLines: 4,
                                  style: TextStyle(
                                    color: textSecondary,
                                    fontSize: 16,
                                    height: 1.5,
                                  ),
                                ),

                                // Next airing (for currently-airing shows)
                                if (displayItem.nextAiring != null) ...[
                                  const SizedBox(height: 20),
                                  NextAiringWidget(nextAiring: displayItem.nextAiring!),
                                ],
          '''
          hero_next_airing = '''                      // Next airing (for currently-airing shows)
                                if (displayItem.nextAiring != null) ...[
                                  const SizedBox(height: 20),
                                  NextAiringWidget(nextAiring: displayItem.nextAiring!),
                                ],
          '''
          hero = replace_once(
              hero,
              hero_synopsis_block,
              hero_next_airing,
              'move desktop synopsis into details tab',
          )

          HERO_PATH.write_text(hero, encoding='utf-8')
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Riverpod code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Format changed files
        run: |
          dart format \
            lib/features/details/presentation/details_screen.dart \
            lib/features/details/presentation/widgets/details_desktop_hero.dart

      - name: Analyze changed files
        run: |
          flutter analyze \
            lib/features/details/presentation/details_screen.dart \
            lib/features/details/presentation/widgets/details_desktop_hero.dart

      - name: Commit and push changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/features/details/presentation/details_screen.dart \
            lib/features/details/presentation/widgets/details_desktop_hero.dart

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "feat(details): move synopsis into details tab and add genre chips"
          git push origin "HEAD:${GITHUB_REF_NAME}"
