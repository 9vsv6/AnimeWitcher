name: Verify Complete Download Recovery Plan

on:
  push:
    branches: [fix/download-recovery-plan-integration]
    paths:
      - .github/scripts/complete-download-recovery-plan.py
      - .github/workflows/verify-download-recovery-plan-completion.yml

permissions:
  contents: write

jobs:
  completion:
    name: complete-recovery-plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Apply remaining recovery hardening
        run: python3 .github/scripts/complete-download-recovery-plan.py

      - name: Install dependencies and generate sources
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Format changed recovery sources
        run: |
          dart format \
            lib/core/services/download_job_state.dart \
            lib/core/services/download_job_store.dart \
            lib/core/services/download_host_profile.dart \
            lib/core/services/download_range_transfer.dart \
            lib/core/services/download_parallel.dart \
            lib/core/services/persistent_parallel_download.dart \
            lib/core/services/download_service.dart \
            test/core/services/download_unknown_size_recovery_test.dart \
            test/core/services/download_startup_reconciliation_matrix_test.dart \
            test/core/services/download_host_profile_race_test.dart \
            test/core/services/download_source_refresh_integrity_test.dart \
            test/core/services/download_recovery_fault_injection_test.dart
          git diff --check

      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: New recovery plan tests
        run: |
          flutter test \
            test/core/services/download_unknown_size_recovery_test.dart \
            test/core/services/download_startup_reconciliation_matrix_test.dart \
            test/core/services/download_host_profile_race_test.dart \
            test/core/services/download_source_refresh_integrity_test.dart \
            test/core/services/download_recovery_fault_injection_test.dart

      - name: Existing recovery regression suite
        run: |
          flutter test \
            test/core/services/download_job_state_test.dart \
            test/core/services/download_job_store_test.dart \
            test/core/services/download_job_store_attempt_test.dart \
            test/core/services/download_relaunch_chaos_test.dart \
            test/core/services/download_range_transfer_test.dart \
            test/core/services/download_range_fast_fail_policy_test.dart \
            test/core/services/download_connection_governor_test.dart \
            test/core/services/download_host_profile_test.dart \
            test/core/services/persistent_parallel_download_test.dart \
            test/core/services/persistent_parallel_download_progress_test.dart \
            test/core/services/persistent_parallel_download_recovery_snapshot_test.dart \
            test/core/services/persistent_parallel_download_auto_recovery_test.dart \
            test/core/services/persistent_parallel_download_fallback_test.dart \
            test/core/services/persistent_parallel_download_phantom_progress_test.dart

      - name: Full Flutter suite
        run: flutter test --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key

      - name: Commit verified completion
        run: |
          if git diff --quiet -- lib test; then
            echo "No source changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test
          git commit -m "Complete download recovery hardening plan"
          git push
