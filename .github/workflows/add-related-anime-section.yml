      - name: Generate localization files
        run: flutter gen-l10n

      - name: Generate Riverpod and other build files
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Format changed Dart files
        run: |
          dart format             lib/core/domain/entity/multimedia_item.dart             lib/features/details/presentation/details_screen.dart             lib/features/details/presentation/widgets/premium_details_widgets.dart             test/core/domain/entity/multimedia_item_related_test.dart

      - name: Verify formatting
        run: |
          dart format --output=none --set-exit-if-changed             lib/core/domain/entity/multimedia_item.dart             lib/features/details/presentation/details_screen.dart             lib/features/details/presentation/widgets/premium_details_widgets.dart             test/core/domain/entity/multimedia_item_related_test.dart

      - name: Analyze implementation
        run: |
          flutter analyze             --no-fatal-warnings             --no-fatal-infos             lib/core/domain/entity/multimedia_item.dart             lib/features/details/presentation/details_screen.dart             lib/features/details/presentation/widgets/premium_details_widgets.dart             test/core/domain/entity/multimedia_item_related_test.dart

      - name: Run Related anime tests
        run: |
          flutter test             test/core/domain/entity/multimedia_item_related_test.dart

      - name: Verify final changes
        shell: bash
        run: |
          set -euo pipefail

          git diff --check

          grep -Fq "final List<MultimediaItem>? related;"             lib/core/domain/entity/multimedia_item.dart
          grep -Fq "final String? relationLabel;"             lib/core/domain/entity/multimedia_item.dart
          grep -Fq "final String? relationType;"             lib/core/domain/entity/multimedia_item.dart
          grep -Fq "title: l10n.relatedAnime"             lib/features/details/presentation/details_screen.dart
          grep -Fq "showRelationBadge: true"             lib/features/details/presentation/details_screen.dart
          grep -Fq "if (relationBadge != null)"             lib/features/details/presentation/widgets/premium_details_widgets.dart
          grep -Fq '"relatedAnime": "Related Anime"'             lib/l10n/app_en.arb
          grep -Fq '"relatedAnime": "أنمي ذات صلة"'             lib/l10n/app_ar.arb

          test "$(grep -Fc "title: l10n.relatedAnime"             lib/features/details/presentation/details_screen.dart)" -eq 2

      - name: Remove one-time workflows
        run: |
          git rm --ignore-unmatch             .github/workflows/add-related-anime-section.yml             .github/workflows/add-related-anime-section-v2.yml \
            .github/workflows/add-related-anime-section-v3.yml \
            .github/workflows/add-related-anime-section-v4.yml

      - name: Commit and push verified changes
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email             "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git diff --cached --check
          git commit -m "Add provider-defined related anime section"
          git push origin HEAD:main
