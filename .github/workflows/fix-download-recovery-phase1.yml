name: Fix Download Recovery Phase 1

on:
  push:
    branches:
      - fix/download-recovery-phase1-ios-pause

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/download-recovery-phase1-ios-pause
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply repair
        run: |
          python3 .github/scripts/fix-download-recovery-phase1.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('test/core/services/download_runtime_stability_review_test.dart')
          text = path.read_text()
          broken = "expect(section, isNot(contains('if (progress > 0 || bytes > 0) return false;'));"
          fixed = "expect(section, isNot(contains('if (progress > 0 || bytes > 0) return false;')));"
          if broken not in text:
              raise SystemExit('expected runtime-test fixture typo not found')
          path.write_text(text.replace(broken, fixed, 1))
          PY

      - name: Install dependencies and generate sources
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Format changed Dart files
        run: |
          dart format \
            lib/core/services/persistent_parallel_download.dart \
            lib/core/services/download_service.dart \
            test/core/services/persistent_parallel_download_progress_test.dart \
            test/core/services/download_runtime_stability_review_test.dart
          git diff --check

      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Lost checkpoint regression
        run: flutter test test/core/services/persistent_parallel_download_progress_test.dart --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key

      - name: Runtime stability regression
        run: flutter test test/core/services/download_runtime_stability_review_test.dart --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key

      - name: Range recovery regression
        run: flutter test test/core/services/download_range_transfer_test.dart --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key

      - name: Relaunch generation regression
        run: flutter test test/core/services/download_relaunch_chaos_test.dart --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key

      - name: Full test suite
        run: flutter test --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key

      - name: Commit verified repair and remove one-shot CI
        run: |
          rm .github/scripts/fix-download-recovery-phase1.py
          rm .github/workflows/fix-download-recovery-phase1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/core/services/persistent_parallel_download.dart \
            lib/core/services/download_service.dart \
            test/core/services/persistent_parallel_download_progress_test.dart \
            test/core/services/download_runtime_stability_review_test.dart
          git add -u .github/scripts/fix-download-recovery-phase1.py .github/workflows/fix-download-recovery-phase1.yml
          git diff --cached --check
          git commit -m "Fix lost multipart checkpoints and harden recovery state"
          git push origin HEAD:fix/download-recovery-phase1-ios-pause
