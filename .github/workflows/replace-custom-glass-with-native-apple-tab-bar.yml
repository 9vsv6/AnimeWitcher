name: Fix native Apple tab bar spacing and Explore FAB

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-native-apple-tab-bar-spacing-and-explore-fab
  cancel-in-progress: false

jobs:
  apply-layout-fix:
    name: Lower native tab bar and keep Explore FAB above it
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Confirm clean main checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "main"
          test -z "$(git status --short)"

      - name: Apply the iOS bottom-area layout fix
        id: apply
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          nav_path = Path("lib/shared/widgets/custom_bottom_nav.dart")
          explore_path = Path(
              "lib/features/explore/presentation/explore_screen.dart"
          )

          nav = nav_path.read_text(encoding="utf-8")
          explore = explore_path.read_text(encoding="utf-8")

          def replace_once(source: str, old: str, new: str, label: str) -> str:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(
                      f"Expected one {label}; found {count}. No files were written."
                  )
              return source.replace(old, new, 1)

          old_nav_class = """class CustomBottomNavBar extends StatelessWidget {
            final int currentIndex;"""
          new_nav_class = """class CustomBottomNavBar extends StatelessWidget {
            static const double iosContentHeight = 64;

            final int currentIndex;"""

          old_nav_layout = "\n".join(
              [
                  "    return SafeArea(",
                  "      top: false,",
                  "      child: SizedBox(",
                  "        height: 64,",
                  "        child: UiKitView(",
                  "          key: ValueKey(appearanceKey),",
                  "          viewType: _nativeAppleTabBarViewType,",
                  "          creationParams: <String, Object>{",
                  "            'selectedIndex': widget.currentIndex,",
                  "            'labels': widget.labels,",
                  "            'accentColor': accentColor.toARGB32(),",
                  "            'brightness': theme.brightness.name,",
                  "            'textDirection': textDirection.name,",
                  "          },",
                  "          creationParamsCodec: const StandardMessageCodec(),",
                  "          onPlatformViewCreated: _onPlatformViewCreated,",
                  "        ),",
                  "      ),",
                  "    );",
              ]
          )
          new_nav_layout = "\n".join(
              [
                  "    final bottomInset = MediaQuery.viewPaddingOf(context).bottom;",
                  "    return SizedBox(",
                  "      height: CustomBottomNavBar.iosContentHeight + bottomInset,",
                  "      child: UiKitView(",
                  "        key: ValueKey(appearanceKey),",
                  "        viewType: _nativeAppleTabBarViewType,",
                  "        creationParams: <String, Object>{",
                  "          'selectedIndex': widget.currentIndex,",
                  "          'labels': widget.labels,",
                  "          'accentColor': accentColor.toARGB32(),",
                  "          'brightness': theme.brightness.name,",
                  "          'textDirection': textDirection.name,",
                  "        },",
                  "        creationParamsCodec: const StandardMessageCodec(),",
                  "        onPlatformViewCreated: _onPlatformViewCreated,",
                  "      ),",
                  "    );",
              ]
          )

          nav_old_markers = [
              old_nav_class in nav,
              old_nav_layout in nav,
              "static const double iosContentHeight" not in nav,
              "MediaQuery.viewPaddingOf(context).bottom" not in nav,
          ]
          nav_new_markers = [
              new_nav_class in nav,
              new_nav_layout in nav,
              "return SafeArea(" not in nav,
          ]

          if all(nav_old_markers) and not any(nav_new_markers):
              nav_state = "old"
          elif all(nav_new_markers) and not any(nav_old_markers):
              nav_state = "new"
          else:
              raise SystemExit(
                  "Refusing to modify a partial or unsupported native tab-bar "
                  "layout. No files were written."
              )

          foundation_import = "import 'package:flutter/foundation.dart';"
          custom_nav_import = (
              "import '../../../shared/widgets/custom_bottom_nav.dart';"
          )
          old_fab_start = (
              "          floatingActionButton: ValueListenableBuilder<bool>("
          )
          new_fab_start = "          floatingActionButton: Padding("
          fab_offset_marker = (
              "CustomBottomNavBar.iosContentHeight +\n"
              "                        LayoutConstants.spacingSm"
          )

          explore_old_markers = [
              foundation_import not in explore,
              custom_nav_import not in explore,
              old_fab_start in explore,
              new_fab_start not in explore,
              fab_offset_marker not in explore,
          ]
          explore_new_markers = [
              foundation_import in explore,
              custom_nav_import in explore,
              old_fab_start not in explore,
              new_fab_start in explore,
              fab_offset_marker in explore,
          ]

          if all(explore_old_markers) and not any(explore_new_markers):
              explore_state = "old"
          elif all(explore_new_markers) and not any(explore_old_markers):
              explore_state = "new"
          else:
              raise SystemExit(
                  "Refusing to modify a partial or unsupported Explore FAB "
                  "layout. No files were written."
              )

          if nav_state == "old":
              nav = replace_once(
                  nav,
                  old_nav_class,
                  new_nav_class,
                  "public iOS tab-bar height constant",
              )
              nav = replace_once(
                  nav,
                  old_nav_layout,
                  new_nav_layout,
                  "native tab-bar SafeArea wrapper",
              )

          if explore_state == "old":
              explore = replace_once(
                  explore,
                  "import 'package:flutter/services.dart';",
                  foundation_import + "\nimport 'package:flutter/services.dart';",
                  "Flutter services import",
              )
              explore = replace_once(
                  explore,
                  "import '../../../shared/widgets/cards_wrapper.dart';",
                  "import '../../../shared/widgets/cards_wrapper.dart';\n"
                  + custom_nav_import,
                  "shared cards import",
              )

              start = explore.find(old_fab_start)
              end_marker = "\n          ),\n        );\n      },\n    );"
              end_start = explore.find(end_marker, start)
              if start < 0 or end_start < 0:
                  raise SystemExit(
                      "Could not isolate the mobile Explore FAB. "
                      "No files were written."
                  )

              old_block_end = end_start + len("\n          ),")
              old_block = explore[start:old_block_end]
              property_prefix = "          floatingActionButton: "
              if not old_block.startswith(property_prefix):
                  raise SystemExit(
                      "The mobile Explore FAB property changed unexpectedly."
                  )

              expression_lines = old_block[len(property_prefix):].splitlines()
              if not expression_lines or expression_lines[0] != (
                  "ValueListenableBuilder<bool>("
              ):
                  raise SystemExit(
                      "The mobile Explore FAB expression changed unexpectedly."
                  )

              child_lines = ["            child: " + expression_lines[0]]
              child_lines.extend("  " + line for line in expression_lines[1:])
              new_block = "\n".join(
                  [
                      new_fab_start,
                      "            padding: EdgeInsets.only(",
                      "              bottom: !kIsWeb &&",
                      "                      defaultTargetPlatform == TargetPlatform.iOS",
                      "                  ? CustomBottomNavBar.iosContentHeight +",
                      "                        LayoutConstants.spacingSm",
                      "                  : 0,",
                      "            ),",
                      *child_lines,
                      "          ),",
                  ]
              )
              explore = explore[:start] + new_block + explore[old_block_end:]

          def require_once(source: str, needle: str, label: str) -> None:
              count = source.count(needle)
              if count != 1:
                  raise SystemExit(f"Expected one {label}; found {count}.")

          require_once(
              nav,
              "static const double iosContentHeight = 64;",
              "shared iOS tab-bar content height",
          )
          require_once(
              nav,
              "final bottomInset = MediaQuery.viewPaddingOf(context).bottom;",
              "persistent iOS bottom inset",
          )
          require_once(
              nav,
              "height: CustomBottomNavBar.iosContentHeight + bottomInset,",
              "native tab-bar full bottom height",
          )
          if "return SafeArea(" in nav:
              raise SystemExit(
                  "The Flutter SafeArea still lifts the native tab bar."
              )

          require_once(explore, foundation_import, "Flutter foundation import")
          require_once(explore, custom_nav_import, "custom navigation import")
          require_once(explore, new_fab_start, "padded mobile Explore FAB")
          require_once(explore, fab_offset_marker, "Explore FAB iOS offset")
          require_once(
              explore,
              "defaultTargetPlatform == TargetPlatform.iOS",
              "Explore FAB iOS-only condition",
          )
          require_once(
              explore,
              "floatingActionButton: Padding(",
              "mobile floating action button",
          )
          require_once(
              explore,
              "valueListenable: _isFabExtended,",
              "FAB extension state",
          )

          if nav_state == "old":
              nav_path.write_text(nav, encoding="utf-8")
          if explore_state == "old":
              explore_path.write_text(explore, encoding="utf-8")

          if nav_state == "old" or explore_state == "old":
              print(
                  "Extended the native UITabBar through the bottom safe area "
                  "and lifted the Explore mode FAB above it."
              )
          else:
              print("The native bottom-area layout fix is already applied.")
          PY

          if git diff --quiet -- \
            lib/shared/widgets/custom_bottom_nav.dart \
            lib/features/explore/presentation/explore_screen.dart; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify native implementation and layout invariants
        shell: bash
        run: |
          set -euo pipefail

          swift_file="ios/Runner/AppDelegate.swift"
          nav_file="lib/shared/widgets/custom_bottom_nav.dart"
          explore_file="lib/features/explore/presentation/explore_screen.dart"
          scaffold_file="lib/shared/widgets/app_scaffold.dart"
          router_file="lib/core/router/app_router.dart"

          # Keep Apple's real UITabBar and its built-in Liquid Glass behavior.
          test "$(grep -Fc 'private let tabBar = UITabBar()' "$swift_file")" -eq 1
          test "$(grep -Fc 'UIView, UITabBarDelegate' "$swift_file")" -eq 1
          test "$(grep -Fc 'didSelect item: UITabBarItem' "$swift_file")" -eq 1
          test "$(grep -Fc 'invokeMethod("onTap", arguments: index)' "$swift_file")" -eq 1
          test "$(grep -Fc 'case "setSelectedIndex"' "$swift_file")" -eq 1
          test "$(grep -Fc 'tabBar.tintColor = accentColor' "$swift_file")" -eq 1
          test "$(grep -Fc 'tabBar.unselectedItemTintColor = .secondaryLabel' "$swift_file")" -eq 1

          if grep -Eq \
            'UIGlassEffect|UIVisualEffectView|selectionIndicatorView|UIPanGestureRecognizer|gestureRecognizerShouldBegin|UIButton\.Configuration|UITabBarAppearance' \
            "$swift_file"; then
            echo "::error::A custom glass, indicator, gesture, or appearance override returned."
            exit 1
          fi

          # The platform view reaches the screen bottom. UIKit then receives the
          # real safe-area inset and places its native bar near the home indicator.
          test "$(grep -Fc 'static const double iosContentHeight = 64;' "$nav_file")" -eq 1
          test "$(grep -Fc 'MediaQuery.viewPaddingOf(context).bottom' "$nav_file")" -eq 1
          test "$(grep -Fc 'height: CustomBottomNavBar.iosContentHeight + bottomInset' "$nav_file")" -eq 1
          test "$(grep -Fc 'child: UiKitView(' "$nav_file")" -eq 1
          test "$(grep -Fc 'child: NavigationBar(' "$nav_file")" -eq 1
          test "$(grep -Fc 'TargetPlatform.iOS' "$nav_file")" -eq 1
          ! grep -Fq 'return SafeArea(' "$nav_file"

          # Both mobile mode labels share one FAB, and only iOS receives the
          # extra clearance required by the native tab bar.
          test "$(grep -Fc "import 'package:flutter/foundation.dart';" "$explore_file")" -eq 1
          test "$(grep -Fc "import '../../../shared/widgets/custom_bottom_nav.dart';" "$explore_file")" -eq 1
          test "$(grep -Fc 'floatingActionButton: Padding(' "$explore_file")" -eq 1
          test "$(grep -Fc 'CustomBottomNavBar.iosContentHeight +' "$explore_file")" -eq 1
          grep -Fq 'LayoutConstants.spacingSm' "$explore_file"
          test "$(grep -Fc 'defaultTargetPlatform == TargetPlatform.iOS' "$explore_file")" -eq 1
          test "$(grep -Fc "isAnime ? 'Go Back' : 'Explore Anime'" "$explore_file")" -eq 1
          test "$(grep -Fc '.setAnimeMode(!isAnime);' "$explore_file")" -eq 1

          # Preserve GoRouter state, all five destinations, and content behind
          # the translucent iOS bar.
          grep -Fq 'widget.navigationShell.goBranch(' "$scaffold_file"
          test "$(grep -Fc 'bottomNavigationBar: CustomBottomNavBar(' "$scaffold_file")" -eq 1
          test "$(grep -Fc 'extendBody:' "$scaffold_file")" -eq 1
          test "$(grep -Fc 'TypedStatefulShellBranch<' "$router_file")" -eq 5

          git diff --check

          mapfile -t changed_files < <(git diff --name-only)
          if [[ "${{ steps.apply.outputs.changed }}" == "true" ]]; then
            test "${#changed_files[@]}" -eq 2
            test "${changed_files[0]}" = \
              "lib/features/explore/presentation/explore_screen.dart"
            test "${changed_files[1]}" = \
              "lib/shared/widgets/custom_bottom_nav.dart"
          else
            test "${#changed_files[@]}" -eq 0
          fi

      - name: Commit changes
        if: steps.apply.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/features/explore/presentation/explore_screen.dart \
            lib/shared/widgets/custom_bottom_nav.dart
          git commit -m "Fix native iOS tab bar bottom spacing"

      - name: Rebase and push main safely
        if: steps.apply.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          verify_rebased_source() {
            local swift_file="ios/Runner/AppDelegate.swift"
            local nav_file="lib/shared/widgets/custom_bottom_nav.dart"
            local explore_file="lib/features/explore/presentation/explore_screen.dart"
            local scaffold_file="lib/shared/widgets/app_scaffold.dart"
            local router_file="lib/core/router/app_router.dart"

            test "$(grep -Fc 'private let tabBar = UITabBar()' "$swift_file")" -eq 1
            test "$(grep -Fc 'UIView, UITabBarDelegate' "$swift_file")" -eq 1
            test "$(grep -Fc 'didSelect item: UITabBarItem' "$swift_file")" -eq 1
            test "$(grep -Fc 'invokeMethod("onTap", arguments: index)' "$swift_file")" -eq 1

            if grep -Eq \
              'UIGlassEffect|UIVisualEffectView|selectionIndicatorView|UIPanGestureRecognizer|gestureRecognizerShouldBegin|UIButton\.Configuration|UITabBarAppearance' \
              "$swift_file"; then
              return 1
            fi

            test "$(grep -Fc 'static const double iosContentHeight = 64;' "$nav_file")" -eq 1
            test "$(grep -Fc 'MediaQuery.viewPaddingOf(context).bottom' "$nav_file")" -eq 1
            test "$(grep -Fc 'height: CustomBottomNavBar.iosContentHeight + bottomInset' "$nav_file")" -eq 1
            ! grep -Fq 'return SafeArea(' "$nav_file"

            test "$(grep -Fc 'floatingActionButton: Padding(' "$explore_file")" -eq 1
            test "$(grep -Fc 'CustomBottomNavBar.iosContentHeight +' "$explore_file")" -eq 1
            test "$(grep -Fc 'defaultTargetPlatform == TargetPlatform.iOS' "$explore_file")" -eq 1
            test "$(grep -Fc "isAnime ? 'Go Back' : 'Explore Anime'" "$explore_file")" -eq 1
            test "$(grep -Fc '.setAnimeMode(!isAnime);' "$explore_file")" -eq 1

            grep -Fq 'widget.navigationShell.goBranch(' "$scaffold_file"
            test "$(grep -Fc 'TypedStatefulShellBranch<' "$router_file")" -eq 5
          }

          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::main changed in a conflicting area; no push was made."
              exit 1
            fi

            if ! verify_rebased_source; then
              echo "::error::Source invariants changed during rebase; no push was made."
              exit 1
            fi

            if git push origin HEAD:main; then
              exit 0
            fi

            if [[ "$attempt" -eq 3 ]]; then
              echo "::error::Could not push after three safe retries."
              exit 1
            fi
          done
