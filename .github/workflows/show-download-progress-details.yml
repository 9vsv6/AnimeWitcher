name: Show download percentage and size

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: show-download-percentage-and-size
  cancel-in-progress: false

jobs:
  update-download-progress-ui:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Add percentage and downloaded size labels
        shell: bash
        run: |
          echo '' | base64 --decode > /tmp/patch_download_ui.py
          python3 /tmp/patch_download_ui.py

      - name: Format changed Dart file
        run: dart format lib/features/library/presentation/widgets/downloads_tab.dart

      - name: Analyze changed Dart file
        run: >-
          flutter analyze
          --no-fatal-warnings
          --no-fatal-infos
          lib/features/library/presentation/widgets/downloads_tab.dart

      - name: Verify generated UI
        shell: bash
        run: |
          echo '' | base64 --decode > /tmp/verify_download_ui.py
          python3 /tmp/verify_download_ui.py

      - name: Remove this one-time workflow
        run: git rm --ignore-unmatch .github/workflows/show-download-progress-details.yml

      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/features/library/presentation/widgets/downloads_tab.dart
          git add -u .github/workflows/show-download-progress-details.yml
          git commit -m 'Show download percentage and transferred size'
          git push origin HEAD:main
