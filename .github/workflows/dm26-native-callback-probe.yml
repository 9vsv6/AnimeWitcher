name: DM-26 native callback probe

on:
  push:
    branches:
      - plan/download-manager-reliability
    paths:
      - .github/workflows/dm26-native-callback-probe.yml

jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - name: Resolve locked dependencies
        run: flutter pub get
      - name: Print supported native callback signatures
        shell: bash
        run: |
          set -euo pipefail
          plugin="$HOME/.pub-cache/hosted/pub.dev/background_downloader-9.6.1"
          test -d "$plugin"
          grep -R -n -C 6 \
            -e 'onNativeTaskStatusChange' \
            -e 'onNativeTaskProgressChange' \
            "$plugin/ios" || true
          echo '--- invocation sites ---'
          grep -R -n -C 10 \
            -e 'onNativeTaskStatusChange?' \
            -e 'onNativeTaskProgressChange?' \
            "$plugin/ios" || true
