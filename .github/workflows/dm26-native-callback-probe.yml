name: DM-26 native callback probe

on:
  push:
    branches:
      - plan/download-manager-reliability
    paths:
      - .github/workflows/dm26-native-callback-probe.yml

jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - name: Resolve locked dependencies
        run: flutter pub get
      - name: Print supported native callback signatures
        shell: bash
        run: |
          set -euo pipefail
          plugin="$HOME/.pub-cache/hosted/pub.dev/background_downloader-9.6.1"
          test -d "$plugin"
          grep -R -n -C 8 \
            -e 'onNativeTaskStatusChange' \
            -e 'onNativeTaskProgressChange' \
            "$plugin/ios" || true
          echo '--- Task identity fields ---'
          grep -R -n -C 5 \
            -e 'struct Task' \
            -e 'class Task' \
            -e 'let taskId' \
            -e 'var taskId' \
            "$plugin/ios/background_downloader/Sources/background_downloader" | head -n 220 || true
          echo '--- URLSession access seams ---'
          grep -R -n -C 5 \
            -e 'static.*urlSession' \
            -e 'var urlSession' \
            -e 'func getTask' \
            -e 'getAllTasks' \
            "$plugin/ios/background_downloader/Sources/background_downloader" | head -n 260 || true
