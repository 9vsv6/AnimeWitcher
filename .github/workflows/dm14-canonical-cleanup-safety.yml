name: DM-14 cleanup and DM-24 adoption verifier

on:
  push:
    branches:
      - plan/download-manager-reliability
    paths:
      - .github/workflows/dm14-canonical-cleanup-safety.yml
      - lib/core/utils/download_cleanup.dart
      - lib/core/utils/download_resume.dart
      - lib/core/services/persistent_parallel_download.dart
      - lib/core/services/download_logical_identity.dart
      - lib/core/services/download_service.dart
      - test/core/utils/download_cleanup_canonical_safety_test.dart
      - test/core/utils/download_resume_test.dart
      - test/core/services/persistent_parallel_download_manifest_discovery_test.dart
      - test/core/services/download_logical_identity_test.dart
      - test/core/services/download_logical_identity_start_test.dart
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dm14-dm24-verifier-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          ref: plan/download-manager-reliability
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Guard configured cleanup ownership
        run: |
          grep -q '_directoryContainsOnlyEmptyDirectories' lib/core/utils/download_cleanup.dart
          ! grep -q '_directoryContainsOnlyKnownDownloadArtifacts' lib/core/utils/download_cleanup.dart
          grep -q 'resolvesInsideConfiguredAppDownloads' lib/core/utils/download_cleanup.dart
          grep -q 'pathIsInsideConfiguredAppDownloads' lib/core/utils/download_cleanup.dart
          grep -q '_platformConfiguredAppDownloadRoots' lib/core/utils/download_cleanup.dart

      - name: Verify canonical cleanup safety
        run: flutter test test/core/utils/download_cleanup_canonical_safety_test.dart --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key

      - name: Verify resume artifact discovery
        run: flutter test test/core/utils/download_resume_test.dart --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key

      - name: Verify manifest recovery discovery
        run: flutter test test/core/services/persistent_parallel_download_manifest_discovery_test.dart --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key

      - name: Verify delete tombstone ownership
        run: flutter test test/core/services/download_delete_tombstone_guard_test.dart --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key

      - name: Verify logical identity aliases
        run: flutter test test/core/services/download_logical_identity_test.dart --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key

      - name: Verify alias-aware start adoption
        run: flutter test test/core/services/download_logical_identity_start_test.dart --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key

      - name: Verify analyzer
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Verify clean diff
        run: git diff --check
