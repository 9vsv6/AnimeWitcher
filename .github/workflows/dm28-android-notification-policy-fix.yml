name: DM-28 Android notification policy GREEN

on:
  push:
    branches:
      - plan/download-manager-reliability
    paths:
      - .github/workflows/dm28-android-notification-policy-fix.yml
      - lib/core/services/download_transport.dart
      - lib/core/services/download_service.dart
      - test/core/services/download_transport_test.dart
      - android/app/src/main/AndroidManifest.xml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dm28-android-notification-policy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: plan/download-manager-reliability
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Install locked dependencies and generate sources
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Verify generated sources are synchronized
        run: git diff --exit-code

      - name: Verify Android notification execution policy
        run: >-
          flutter test
          test/core/services/download_transport_test.dart
          --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key

      - name: Verify runtime policy wiring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('lib/core/services/download_service.dart').read_text()
          required = (
              'shouldUseUserInitiatedDownloadHint(',
              'FileDownloader().permissions.status(',
              'shouldClearDownloadNotificationConfigs(',
              'useUserInitiated:',
          )
          missing = [token for token in required if token not in source]
          if missing:
              raise SystemExit(f'missing DM-28 runtime policy wiring: {missing}')
          if source.count('transferHints: animeDownloadTransferHints(') < 2:
              raise SystemExit('start/resume do not both construct policy-aware transfer hints')
          if source.count('useUserInitiated:') < 2:
              raise SystemExit('start/resume do not both pass the resolved UIDT decision')
          PY

      - name: Analyze affected Dart code
        run: >-
          flutter analyze --no-fatal-warnings --no-fatal-infos
          lib/core/services/download_transport.dart
          lib/core/services/download_service.dart
          test/core/services/download_transport_test.dart

      - name: Diff sanity
        run: git diff --check
