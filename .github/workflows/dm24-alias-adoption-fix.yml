name: DM24 Alias Adoption Fix

on:
  push:
    branches:
      - plan/download-manager-reliability
    paths:
      - .github/scripts/dm24_alias_adoption_fix.py
      - .github/workflows/dm24-alias-adoption-fix.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dm24-alias-adoption-fix
  cancel-in-progress: true

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          ref: plan/download-manager-reliability
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Prepare
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs
          git reset --hard HEAD

      - name: Apply alias-aware adoption fix
        run: |
          python3 .github/scripts/dm24_alias_adoption_fix.py
          dart format lib/core/services/download_service.dart

      - name: Verify DM-24 RED regressions are GREEN
        run: >-
          flutter test
          test/core/services/download_logical_identity_test.dart
          test/core/services/download_logical_identity_start_test.dart
          test/core/services/download_job_logical_identity_test.dart
          test/core/services/download_logical_identity_persistence_test.dart
          test/core/services/download_overlay_logical_identity_test.dart
          test/features/library/presentation/downloads_logical_identity_test.dart
          --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key

      - name: Verify authority regressions
        run: >-
          flutter test
          test/core/services/download_job_state_authority_test.dart
          test/core/services/download_job_state_queue_authority_test.dart
          test/features/library/presentation/downloads_job_state_authority_test.dart
          --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key

      - name: Analyze touched download surfaces
        run: >-
          flutter analyze --no-fatal-warnings --no-fatal-infos
          lib/core/services/download_service.dart
          lib/core/services/download_logical_identity.dart
          test/core/services/download_logical_identity_start_test.dart

      - name: Verify scoped diff
        run: |
          git diff --check
          changed="$(git diff --name-only)"
          test "$changed" = "lib/core/services/download_service.dart"

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/core/services/download_service.dart
          git commit -m "fix(downloads): adopt logical identity aliases"
          git pull --rebase origin plan/download-manager-reliability
          git push origin HEAD:plan/download-manager-reliability
