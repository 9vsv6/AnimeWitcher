name: iOS Liquid Glass compile check

'on':
  push:
    branches:
      - fix/liquid-glass-header-motion-alignment

permissions:
  contents: read

jobs:
  ios:
    name: iOS compile
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install dependencies and generate sources
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs
      - name: Prepare media_kit iOS headers
        run: bash scripts/prepare_media_kit_ios_headers.sh
      - name: Create compile-only dart defines
        shell: bash
        run: |
          cat > dart-defines.json <<'EOF'
          {
            "MAL_CLIENT_ID": "test",
            "MAL_CLIENT_SECRET": "test",
            "ANILIST_CLIENT_ID": "test",
            "ANIMEWITCHER_FIREBASE_PROJECT_ID": "test-project",
            "ANIMEWITCHER_FIREBASE_API_KEY": "test-api-key",
            "ANIMEWITCHER_GOOGLE_SERVER_CLIENT_ID": "test.apps.googleusercontent.com",
            "ANIMEWITCHER_GOOGLE_IOS_CLIENT_ID": "296971789988-0ksnaln8k2epsuejesllrr497jnd5if5.apps.googleusercontent.com"
          }
          EOF
      - name: Compile iOS without codesigning
        run: flutter build ios --debug --no-codesign --dart-define-from-file=dart-defines.json
