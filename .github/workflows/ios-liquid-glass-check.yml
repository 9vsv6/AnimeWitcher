name: Follow-up fixes verifier

'on':
  push:
    branches:
      - fix/liquid-glass-header-motion-alignment

permissions:
  contents: write

jobs:
  fix-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - name: Install dependencies and generate sources
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs
      - name: Add RED regression contracts
        run: python3 -c "$(echo '' | base64 -d)"
      - name: Verify RED contracts
        shell: bash
        run: |
          set +e
          flutter test test/features/library/presentation/downloads_screen_layout_contract_test.dart test/features/settings/presentation/profile_birth_year_edit_contract_test.dart > /tmp/red.log 2>&1
          status=$?
          set -e
          cat /tmp/red.log
          if [ "$status" -eq 0 ]; then
            echo 'Expected RED regression contracts to fail before implementation.' >&2
            exit 1
          fi
          grep -q 'handset downloads lets the tabs own the top safe area' /tmp/red.log
          grep -q 'existing birth year stays editable and profile service accepts changes' /tmp/red.log
      - name: Apply fixes
        run: python3 -c "$(echo '' | base64 -d)"
      - name: Focused GREEN verification
        run: |
          dart format lib/features/library/presentation/downloads_screen.dart lib/features/library/presentation/widgets/downloads_tab.dart lib/features/settings/presentation/account_management_screens.dart lib/core/account/animewitcher_account_service.dart test/features/comments/presentation/animewitcher_reviews_screen_test.dart test/features/player/anime4k_platform_ci_contract_test.dart test/features/library/presentation/downloads_screen_layout_contract_test.dart test/features/settings/presentation/profile_birth_year_edit_contract_test.dart
          flutter test test/features/library/presentation/downloads_screen_layout_contract_test.dart test/features/settings/presentation/profile_birth_year_edit_contract_test.dart test/features/comments/presentation/animewitcher_reviews_screen_test.dart test/features/player/anime4k_platform_ci_contract_test.dart --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key
      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Full test suite
        run: flutter test --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key
      - name: Commit verified fixes to the PR branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/features/library/presentation/downloads_screen.dart lib/features/library/presentation/widgets/downloads_tab.dart lib/features/settings/presentation/account_management_screens.dart lib/core/account/animewitcher_account_service.dart test/features/comments/presentation/animewitcher_reviews_screen_test.dart test/features/player/anime4k_platform_ci_contract_test.dart test/features/library/presentation/downloads_screen_layout_contract_test.dart test/features/settings/presentation/profile_birth_year_edit_contract_test.dart
          git commit -m 'fix: polish downloads header and editable birth year'
          git push origin HEAD:fix/liquid-glass-header-motion-alignment
