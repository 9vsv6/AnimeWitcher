name: Follow-up fixes verifier

'on':
  push:
    branches:
      - fix/liquid-glass-header-motion-alignment

permissions:
  contents: write

jobs:
  clean-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - name: Install dependencies and generate sources
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs
      - name: Reapply fixes without unrelated formatting churn
        shell: bash
        run: |
          impl=$(git log -1 --format=%H --grep='^fix: polish downloads header and editable birth year$')
          test -n "$impl"
          base=$(git rev-parse "${impl}^")
          git checkout "$base" -- \
            lib/core/account/animewitcher_account_service.dart \
            lib/features/library/presentation/downloads_screen.dart \
            lib/features/library/presentation/widgets/downloads_tab.dart \
            lib/features/settings/presentation/account_management_screens.dart \
            test/features/comments/presentation/animewitcher_reviews_screen_test.dart \
            test/features/player/anime4k_platform_ci_contract_test.dart

          python3 <<'PY'
          from pathlib import Path

          path = Path('lib/features/library/presentation/downloads_screen.dart')
          text = path.read_text()
          text = text.replace(
              "import 'package:animewitcher/shared/widgets/apple_liquid_glass.dart';\n",
              '',
          )
          marker = '    // AppBar chrome is LTR like المواسم / الإحصائيات. Tab swipe is RTL;\n'
          start = text.index(marker)
          text = text[:start] + '''    // On handsets the tab strip is the page header. Avoid repeating\n    // "Downloads" in a separate AppBar and keep the two tabs immediately\n    // below the system safe area.\n    return Scaffold(\n      body: SafeArea(\n        bottom: false,\n        child: const DownloadsTab(),\n      ),\n    );\n  }\n}\n'''
          path.write_text(text)

          path = Path('lib/features/library/presentation/widgets/downloads_tab.dart')
          text = path.read_text()
          old = '''        if (downloads.isEmpty) {\n          return _DownloadsEmptyState(message: l10n.noDownloadsYet);\n        }\n\n'''
          assert old in text
          path.write_text(text.replace(old, '', 1))

          path = Path('lib/features/settings/presentation/account_management_screens.dart')
          text = path.read_text()
          old = '''  bool get _birthYearLocked =>\n      (widget.profile.birthYear?.trim().isNotEmpty ?? false);\n\n'''
          assert old in text
          text = text.replace(old, '', 1)
          old = '''                keyboardType: TextInputType.number,\n                readOnly: _birthYearLocked,\n                helperText: _birthYearLocked\n                    ? appText(\n                        context,\n                        english: 'AnimeWitcher allows this to be set once.',\n                        arabic: 'يسمح AnimeWitcher بحفظها مرة واحدة فقط.',\n                      )\n                    : appText(\n                        context,\n                        english: 'Optional · 1970–2020',\n                        arabic: 'اختياري · 1970–2020',\n                      ),\n'''
          new = '''                keyboardType: TextInputType.number,\n                helperText: appText(\n                  context,\n                  english: 'Optional · 1970–2020',\n                  arabic: 'اختياري · 1970–2020',\n                ),\n'''
          assert old in text
          path.write_text(text.replace(old, new, 1))

          path = Path('lib/core/account/animewitcher_account_service.dart')
          text = path.read_text()
          old = '''    final existingBirthYear = profile.birthYear?.trim() ?? '';\n    if (existingBirthYear.isNotEmpty &&\n        normalizedBirthYear != existingBirthYear) {\n      throw const AnimeWitcherAccountException(\n        'birth-year-locked',\n        'The birth year can only be set once.',\n      );\n    }\n'''
          assert old in text
          path.write_text(text.replace(old, '', 1))

          path = Path('test/features/comments/presentation/animewitcher_reviews_screen_test.dart')
          text = path.read_text()
          replacements = [
              ('      expect(arabic.single.width, 150);',
               '      expect(arabic.single.width, AnimeWitcherCommentSortControl.size);'),
              ("      expect(arabic.single.title, 'الأحدث');",
               '      expect(arabic.single.title, isNull);'),
              ('      expect(english.single.width, 140);',
               '      expect(english.single.width, AnimeWitcherCommentSortControl.size);'),
              ("      expect(english.single.title, 'Oldest');",
               '      expect(english.single.title, isNull);'),
          ]
          for old, new in replacements:
              assert old in text, old
              text = text.replace(old, new, 1)
          path.write_text(text)

          path = Path('test/features/player/anime4k_platform_ci_contract_test.dart')
          text = path.read_text()
          old = '''    test('runs the complete platform gate without the obsolete branch trigger', () {\n      expect(workflowFile.existsSync(), isTrue);\n      final workflow = workflowFile.readAsStringSync();\n\n      expect(workflow, isNot(contains('feat/anime4k-mobile-gpu')));\n      expect(workflow, contains('flutter analyze'));\n      expect(workflow, contains('flutter test'));\n      expect(workflow, contains('Verify full Anime4K v4.0.1 Metal corpus'));\n      expect(workflow, contains('Test native Anime4K Metal runtime contract'));\n      expect(workflow, contains('flutter build apk'));\n      expect(workflow, contains('flutter build ios --release --no-codesign'));\n      expect(workflow, contains('flutter build macos --release'));\n    });\n'''
          new = '''    test('dedicated Anime4K workflow stays removed after workflow cleanup', () {\n      expect(workflowFile.existsSync(), isFalse);\n    });\n'''
          assert old in text
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Focused verification
        run: |
          flutter test \
            test/features/library/presentation/downloads_screen_layout_contract_test.dart \
            test/features/settings/presentation/profile_birth_year_edit_contract_test.dart \
            test/features/comments/presentation/animewitcher_reviews_screen_test.dart \
            test/features/player/anime4k_platform_ci_contract_test.dart \
            --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key
      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Full test suite
        run: flutter test --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key
      - name: Commit clean verified fixes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            lib/core/account/animewitcher_account_service.dart \
            lib/features/library/presentation/downloads_screen.dart \
            lib/features/library/presentation/widgets/downloads_tab.dart \
            lib/features/settings/presentation/account_management_screens.dart \
            test/features/comments/presentation/animewitcher_reviews_screen_test.dart \
            test/features/player/anime4k_platform_ci_contract_test.dart
          git commit -m 'chore: minimize follow-up fix diff'
          git push origin HEAD:fix/liquid-glass-header-motion-alignment
