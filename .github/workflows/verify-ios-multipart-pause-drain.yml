name: Verify iOS Multipart Pause Preservation

on:
  push:
    branches: [fix/download-recovery-plan-integration]
    paths:
      - .github/scripts/fix-ios-multipart-pause-drain.py
      - .github/workflows/verify-ios-multipart-pause-drain.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Apply iOS multipart pause fix
        run: python3 .github/scripts/fix-ios-multipart-pause-drain.py

      - name: Install dependencies and generate sources
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Format and diff check
        run: |
          dart format \
            lib/core/services/persistent_parallel_download.dart \
            lib/core/services/download_service.dart \
            test/core/services/persistent_parallel_download_test.dart \
            test/core/services/download_runtime_stability_review_test.dart
          git diff --check

      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Multipart pause regressions
        run: |
          flutter test \
            test/core/services/persistent_parallel_download_test.dart \
            test/core/services/download_runtime_stability_review_test.dart

      - name: Download recovery regressions
        run: |
          flutter test \
            test/core/services/download_job_state_test.dart \
            test/core/services/download_job_store_test.dart \
            test/core/services/download_relaunch_chaos_test.dart \
            test/core/services/download_startup_reconciliation_matrix_test.dart \
            test/core/services/download_recovery_fault_injection_test.dart \
            test/core/services/download_source_refresh_integrity_test.dart

      - name: Full Flutter suite
        run: flutter test --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key

      - name: Commit verified fix
        run: |
          if git diff --quiet -- lib test; then
            echo "No source changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test
          git commit -m "Preserve iOS multipart bytes across pause"
          git push
