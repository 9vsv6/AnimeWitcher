name: Verify iOS Background Multipart Recovery

on:
  push:
    branches: [fix/download-recovery-plan-integration]
    paths:
      - .github/scripts/fix-ios-multipart-pause-drain.py
      - .github/scripts/fix-ios-multipart-pause-drain-tests.py
      - .github/scripts/fix-ios-background-transfer-recovery.py
      - .github/workflows/verify-ios-multipart-pause-drain.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Apply iOS pause and background recovery fixes
        run: |
          python3 .github/scripts/fix-ios-multipart-pause-drain.py
          python3 .github/scripts/fix-ios-multipart-pause-drain-tests.py
          python3 .github/scripts/fix-ios-background-transfer-recovery.py
          # These helpers are called by the sibling URLSession hook type in the
          # same Swift file, so they must not be declaration-private.
          perl -pi -e 's/private static func noteBackgroundRetryProgress/static func noteBackgroundRetryProgress/' ios/Runner/DownloadNativeWaitingQueue.swift
          perl -pi -e 's/private static func clearBackgroundRetry/static func clearBackgroundRetry/' ios/Runner/DownloadNativeWaitingQueue.swift

      - name: Install dependencies and generate sources
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Format and diff check
        run: |
          dart format \
            lib/core/services/persistent_parallel_download.dart \
            lib/core/services/download_service.dart \
            test/core/services/persistent_parallel_download_test.dart \
            test/core/services/download_runtime_stability_review_test.dart
          git diff --check

      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Multipart pause and background regressions
        run: |
          flutter test \
            test/core/services/persistent_parallel_download_test.dart \
            test/core/services/download_runtime_stability_review_test.dart

      - name: Download recovery regressions
        run: |
          flutter test \
            test/core/services/download_job_state_test.dart \
            test/core/services/download_job_store_test.dart \
            test/core/services/download_relaunch_chaos_test.dart \
            test/core/services/download_startup_reconciliation_matrix_test.dart \
            test/core/services/download_recovery_fault_injection_test.dart \
            test/core/services/download_source_refresh_integrity_test.dart

      - name: Full Flutter suite
        run: flutter test --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key

      - name: Compile iOS simulator app
        run: flutter build ios --simulator --debug --no-codesign

      - name: Commit verified fix
        run: |
          if git diff --quiet -- lib test ios; then
            echo "No source changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test ios
          git commit -m "Harden iOS background download recovery"
          git push
