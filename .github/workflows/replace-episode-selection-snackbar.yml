name: Replace episode selection snackbar

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Replace selection UI
        shell: bash
        run: |
          echo '' | base64 --decode > /tmp/replace_episode_selection.py
          python3 /tmp/replace_episode_selection.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Riverpod files
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Format changed files
        run: |
          dart format \
            lib/features/details/presentation/details_controller.dart \
            lib/features/details/presentation/details_screen.dart \
            lib/features/details/presentation/widgets/episode_card.dart

      - name: Analyze changed files
        run: |
          flutter analyze \
            lib/features/details/presentation/details_controller.dart \
            lib/features/details/presentation/details_screen.dart \
            lib/features/details/presentation/widgets/episode_card.dart

      - name: Verify diff
        run: git diff --check

      - name: Commit fix and remove workflow
        shell: bash
        run: |
          rm -f .github/workflows/replace-episode-selection-snackbar.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            lib/features/details/presentation/details_controller.dart \
            lib/features/details/presentation/details_screen.dart \
            lib/features/details/presentation/widgets/episode_card.dart \
            .github/workflows/replace-episode-selection-snackbar.yml

          git commit -m "Improve episode selection action bar"
          git push origin HEAD:main
