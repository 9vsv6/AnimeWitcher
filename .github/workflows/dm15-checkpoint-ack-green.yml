name: DM-15 checkpoint ack GREEN

on:
  push:
    branches:
      - plan/download-manager-reliability
    paths:
      - .github/workflows/dm15-checkpoint-ack-green.yml

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: plan/download-manager-reliability
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - name: Install dependencies and generate sources
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs
      - name: Assert DM-15 production fix is present
        shell: python
        run: |
          from pathlib import Path
          text = Path('lib/core/services/download_service.dart').read_text()
          required = [
              'final acceptedVersion = await _continuedProcessing.persistNativeQueue(',
              "nativeQueue.checkpointUnacknowledged",
              "throw StateError('Native waiting queue checkpoint was not acknowledged')",
          ]
          missing = [needle for needle in required if needle not in text]
          if missing:
              raise SystemExit(f'DM-15 production fix missing: {missing}')
      - name: Run DM-15 focused acceptance
        run: >-
          flutter test
          test/core/services/ios_native_queue_snapshot_version_guard_test.dart
          test/core/services/ios_native_queue_checkpoint_ack_guard_test.dart
          test/core/services/ios_native_queue_snapshot_ack_recovery_test.dart
          test/core/services/ios_continued_processing_completion_guard_test.dart
          test/core/services/ios_continued_processing_expiration_test.dart
          test/core/services/ios_multipart_native_bridge_source_test.dart
          --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key
      - name: Analyze touched services
        run: >-
          flutter analyze --no-fatal-warnings --no-fatal-infos
          lib/core/services/download_service.dart
          lib/core/services/download_continued_processing_service.dart
          test/core/services/ios_native_queue_snapshot_version_guard_test.dart
          test/core/services/ios_native_queue_checkpoint_ack_guard_test.dart
          test/core/services/ios_native_queue_snapshot_ack_recovery_test.dart
      - name: Diff sanity
        run: git diff --check
      - name: Mark DM-15 complete after fresh GREEN
        shell: bash
        run: |
          git reset --hard HEAD
          python - <<'PY'
          from pathlib import Path
          path = Path('DOWNLOAD_MANAGER_PLAN.md')
          text = path.read_text()
          unchecked = '- [ ] **DM-15 — Make Dart<->iOS queue snapshots versioned, acknowledged, and recoverable**'
          checked = '- [x] **DM-15 — Make Dart<->iOS queue snapshots versioned, acknowledged, and recoverable**'
          if checked in text:
              print('DM-15 already marked complete.')
          elif unchecked in text:
              path.write_text(text.replace(unchecked, checked, 1))
          else:
              raise SystemExit('DM-15 checklist anchor not found')
          PY
          if git diff --quiet -- DOWNLOAD_MANAGER_PLAN.md; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DOWNLOAD_MANAGER_PLAN.md
          git commit -m 'docs(downloads): mark DM-15 complete after GREEN'
          git pull --rebase origin plan/download-manager-reliability
          git push origin HEAD:plan/download-manager-reliability
