name: Apply swipe navigation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-swipe-navigation.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add horizontal swipe navigation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          seasons_path = Path('lib/features/more/presentation/seasons_screen.dart')
          seasons = seasons_path.read_text(encoding='utf-8')
          seasons = replace_once(
              seasons,
              """class _SeasonsScreenState extends ConsumerState<SeasonsScreen> {
            late Future<_SeasonsBootstrap> _bootstrapFuture;
            int _selectedTab = 1;

            @override
            void initState() {
              super.initState();
              _bootstrapFuture = _loadBootstrap();
            }
          """,
              """class _SeasonsScreenState extends ConsumerState<SeasonsScreen> {
            late Future<_SeasonsBootstrap> _bootstrapFuture;
            late final PageController _pageController;
            int _selectedTab = 1;

            @override
            void initState() {
              super.initState();
              _pageController = PageController(initialPage: _selectedTab);
              _bootstrapFuture = _loadBootstrap();
            }

            @override
            void dispose() {
              _pageController.dispose();
              super.dispose();
            }

            void _selectTab(int value) {
              if (value < 0 || value > 3 || value == _selectedTab) return;
              setState(() => _selectedTab = value);
              _pageController.animateToPage(
                value,
                duration: const Duration(milliseconds: 260),
                curve: Curves.easeOutCubic,
              );
            }
          """,
              'seasons controller',
          )
          seasons = replace_once(
              seasons,
              "onSelected: (value) => setState(() => _selectedTab = value),",
              "onSelected: _selectTab,",
              'seasons tab callback',
          )
          seasons = replace_once(
              seasons,
              "Expanded(child: _tabBody(data, isArabic)),",
              """Expanded(
                child: PageView.builder(
                  controller: _pageController,
                  itemCount: 4,
                  onPageChanged: (value) {
                    if (value != _selectedTab) {
                      setState(() => _selectedTab = value);
                    }
                  },
                  itemBuilder: (context, index) =>
                      _tabBody(data, isArabic, index),
                ),
              ),""",
              'seasons page view',
          )
          seasons = replace_once(
              seasons,
              """  Widget _tabBody(_SeasonsBootstrap data, bool isArabic) {
            switch (_selectedTab) {""",
              """  Widget _tabBody(_SeasonsBootstrap data, bool isArabic, int index) {
            switch (index) {""",
              'seasons page body',
          )
          seasons_path.write_text(seasons, encoding='utf-8')

          schedule_path = Path('lib/features/more/presentation/broadcast_schedule_screen.dart')
          schedule = schedule_path.read_text(encoding='utf-8')
          schedule = replace_once(
              schedule,
              """  late Future<Map<String, List<MultimediaItem>>> _scheduleFuture;
            late int _selectedDay;

            @override
            void initState() {
              super.initState();
              _selectedDay = _todayIndex();
              _scheduleFuture = _loadSchedule();
            }
          """,
              """  late Future<Map<String, List<MultimediaItem>>> _scheduleFuture;
            late final PageController _pageController;
            late int _selectedDay;

            @override
            void initState() {
              super.initState();
              _selectedDay = _todayIndex();
              _pageController = PageController(initialPage: _selectedDay);
              _scheduleFuture = _loadSchedule();
            }

            @override
            void dispose() {
              _pageController.dispose();
              super.dispose();
            }

            void _selectDay(int value) {
              if (value < 0 ||
                  value >= animeWitcherBroadcastDays.length ||
                  value == _selectedDay) {
                return;
              }
              setState(() => _selectedDay = value);
              _pageController.animateToPage(
                value,
                duration: const Duration(milliseconds: 260),
                curve: Curves.easeOutCubic,
              );
            }
          """,
              'schedule controller',
          )
          schedule = replace_once(
              schedule,
              "onSelected: (value) => setState(() => _selectedDay = value),",
              "onSelected: _selectDay,",
              'schedule tab callback',
          )
          schedule = replace_once(
              schedule,
              """          final day = animeWitcherBroadcastDays[_selectedDay];
                    final items = schedule[day] ?? const <MultimediaItem>[];
          """,
              "",
              'schedule selected-day locals',
          )
          schedule = replace_once(
              schedule,
              """              Expanded(
                        child: items.isEmpty
                            ? Center(
                                child: Text(
                                  isArabic
                                      ? 'لا يوجد بث مجدول لهذا اليوم'
                                      : 'No broadcasts scheduled for this day',
                                ),
                              )
                            : _ScheduleGrid(items: items, day: day),
                      ),""",
              """              Expanded(
                        child: PageView.builder(
                          controller: _pageController,
                          itemCount: animeWitcherBroadcastDays.length,
                          onPageChanged: (value) {
                            if (value != _selectedDay) {
                              setState(() => _selectedDay = value);
                            }
                          },
                          itemBuilder: (context, index) {
                            final day = animeWitcherBroadcastDays[index];
                            final items =
                                schedule[day] ?? const <MultimediaItem>[];
                            if (items.isEmpty) {
                              return Center(
                                child: Text(
                                  isArabic
                                      ? 'لا يوجد بث مجدول لهذا اليوم'
                                      : 'No broadcasts scheduled for this day',
                                ),
                              );
                            }
                            return _ScheduleGrid(items: items, day: day);
                          },
                        ),
                      ),""",
              'schedule page view',
          )
          schedule_path.write_text(schedule, encoding='utf-8')
          PY

      - name: Commit applied changes
        shell: bash
        run: |
          rm -f .github/workflows/apply-swipe-navigation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/more/presentation/seasons_screen.dart \
                  lib/features/more/presentation/broadcast_schedule_screen.dart \
                  .github/workflows/apply-swipe-navigation.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add swipe navigation to seasons and broadcast tabs"
          git push
