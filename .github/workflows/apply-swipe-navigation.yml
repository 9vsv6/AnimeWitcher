name: Apply swipe navigation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-swipe-navigation.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add horizontal swipe navigation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          seasons_path = Path('lib/features/more/presentation/seasons_screen.dart')
          seasons = seasons_path.read_text(encoding='utf-8')
          seasons = replace_once(
              seasons,
              '  late Future<_SeasonsBootstrap> _bootstrapFuture;\n',
              '  late Future<_SeasonsBootstrap> _bootstrapFuture;\n'
              '  late final PageController _pageController;\n',
              'seasons controller field',
          )
          seasons = replace_once(
              seasons,
              '    _bootstrapFuture = _loadBootstrap();',
              '    _pageController = PageController(initialPage: _selectedTab);\n'
              '    _bootstrapFuture = _loadBootstrap();',
              'seasons controller init',
          )
          seasons_helpers = '\n'.join([
              '  @override',
              '  void dispose() {',
              '    _pageController.dispose();',
              '    super.dispose();',
              '  }',
              '',
              '  void _selectTab(int value) {',
              '    if (value < 0 || value > 3 || value == _selectedTab) return;',
              '    setState(() => _selectedTab = value);',
              '    _pageController.animateToPage(',
              '      value,',
              '      duration: const Duration(milliseconds: 260),',
              '      curve: Curves.easeOutCubic,',
              '    );',
              '  }',
              '',
          ])
          seasons = replace_once(
              seasons,
              '  AnimeWitcherNativeProvider? _provider() {',
              seasons_helpers + '  AnimeWitcherNativeProvider? _provider() {',
              'seasons helpers',
          )
          seasons = replace_once(
              seasons,
              '                onSelected: (value) => setState(() => _selectedTab = value),',
              '                onSelected: _selectTab,',
              'seasons tab callback',
          )
          seasons_page = '\n'.join([
              '              Expanded(',
              '                child: PageView.builder(',
              '                  controller: _pageController,',
              '                  itemCount: 4,',
              '                  onPageChanged: (value) {',
              '                    if (value != _selectedTab) {',
              '                      setState(() => _selectedTab = value);',
              '                    }',
              '                  },',
              '                  itemBuilder: (context, index) =>',
              '                      _tabBody(data, isArabic, index),',
              '                ),',
              '              ),',
          ])
          seasons = replace_once(
              seasons,
              '              Expanded(child: _tabBody(data, isArabic)),',
              seasons_page,
              'seasons page view',
          )
          seasons = replace_once(
              seasons,
              '  Widget _tabBody(_SeasonsBootstrap data, bool isArabic) {',
              '  Widget _tabBody(_SeasonsBootstrap data, bool isArabic, int index) {',
              'seasons body signature',
          )
          seasons = replace_once(
              seasons,
              '    switch (_selectedTab) {',
              '    switch (index) {',
              'seasons body index',
          )
          seasons_path.write_text(seasons, encoding='utf-8')

          schedule_path = Path('lib/features/more/presentation/broadcast_schedule_screen.dart')
          schedule = schedule_path.read_text(encoding='utf-8')
          schedule = replace_once(
              schedule,
              '  late Future<Map<String, List<MultimediaItem>>> _scheduleFuture;\n',
              '  late Future<Map<String, List<MultimediaItem>>> _scheduleFuture;\n'
              '  late final PageController _pageController;\n',
              'schedule controller field',
          )
          schedule = replace_once(
              schedule,
              '    _selectedDay = _todayIndex();\n    _scheduleFuture = _loadSchedule();',
              '    _selectedDay = _todayIndex();\n'
              '    _pageController = PageController(initialPage: _selectedDay);\n'
              '    _scheduleFuture = _loadSchedule();',
              'schedule controller init',
          )
          schedule_helpers = '\n'.join([
              '  @override',
              '  void dispose() {',
              '    _pageController.dispose();',
              '    super.dispose();',
              '  }',
              '',
              '  void _selectDay(int value) {',
              '    if (value < 0 ||',
              '        value >= animeWitcherBroadcastDays.length ||',
              '        value == _selectedDay) {',
              '      return;',
              '    }',
              '    setState(() => _selectedDay = value);',
              '    _pageController.animateToPage(',
              '      value,',
              '      duration: const Duration(milliseconds: 260),',
              '      curve: Curves.easeOutCubic,',
              '    );',
              '  }',
              '',
          ])
          schedule = replace_once(
              schedule,
              '  int _todayIndex() {',
              schedule_helpers + '  int _todayIndex() {',
              'schedule helpers',
          )
          schedule = replace_once(
              schedule,
              '                onSelected: (value) => setState(() => _selectedDay = value),',
              '                onSelected: _selectDay,',
              'schedule tab callback',
          )
          schedule = replace_once(
              schedule,
              '          final day = animeWitcherBroadcastDays[_selectedDay];\n',
              '',
              'schedule selected day',
          )
          schedule = replace_once(
              schedule,
              '          final items = schedule[day] ?? const <MultimediaItem>[];\n',
              '',
              'schedule selected items',
          )
          start_marker = '              Expanded(\n                child: items.isEmpty\n'
          start = schedule.find(start_marker)
          if start < 0:
              raise SystemExit('schedule page view start not found')
          grid_line = '                    : _ScheduleGrid(items: items, day: day),\n'
          grid_end = schedule.find(grid_line, start)
          if grid_end < 0:
              raise SystemExit('schedule page view grid line not found')
          close_start = schedule.find('              ),', grid_end + len(grid_line))
          if close_start < 0:
              raise SystemExit('schedule page view close not found')
          close_end = close_start + len('              ),')
          schedule_page = '\n'.join([
              '              Expanded(',
              '                child: PageView.builder(',
              '                  controller: _pageController,',
              '                  itemCount: animeWitcherBroadcastDays.length,',
              '                  onPageChanged: (value) {',
              '                    if (value != _selectedDay) {',
              '                      setState(() => _selectedDay = value);',
              '                    }',
              '                  },',
              '                  itemBuilder: (context, index) {',
              '                    final day = animeWitcherBroadcastDays[index];',
              '                    final items =',
              '                        schedule[day] ?? const <MultimediaItem>[];',
              '                    if (items.isEmpty) {',
              '                      return Center(',
              '                        child: Text(',
              '                          isArabic',
              "                              ? 'لا يوجد بث مجدول لهذا اليوم'",
              "                              : 'No broadcasts scheduled for this day',",
              '                        ),',
              '                      );',
              '                    }',
              '                    return _ScheduleGrid(items: items, day: day);',
              '                  },',
              '                ),',
              '              ),',
          ])
          schedule = schedule[:start] + schedule_page + schedule[close_end:]
          schedule_path.write_text(schedule, encoding='utf-8')
          PY

      - name: Commit applied changes
        shell: bash
        run: |
          rm -f .github/workflows/apply-swipe-navigation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/more/presentation/seasons_screen.dart \
                  lib/features/more/presentation/broadcast_schedule_screen.dart \
                  .github/workflows/apply-swipe-navigation.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add swipe navigation to seasons and broadcast tabs"
          git push
