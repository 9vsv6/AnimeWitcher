name: DM-22 ownership handoff GREEN

on:
  push:
    branches:
      - plan/download-manager-reliability
    paths:
      - .github/workflows/dm22-ownership-handoff-green.yml

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          ref: plan/download-manager-reliability
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Install dependencies and generate sources
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Prove DM-22 RED and apply ownership-handoff patch
        shell: python
        run: |
          from pathlib import Path

          parallel_path = Path('lib/core/services/persistent_parallel_download.dart')
          service_path = Path('lib/core/services/download_service.dart')
          swift_path = Path('ios/Runner/DownloadNativeWaitingQueue.swift')
          test_path = Path('test/core/services/ios_multipart_ownership_handoff_source_test.dart')

          parallel = parallel_path.read_text()
          service = service_path.read_text()
          swift = swift_path.read_text()

          # RED: this workflow is intentionally a one-shot migration. If the
          # durable claim contract is already present, never rewrite it.
          already_green = (
              'NativeParallelBackgroundCandidate' in parallel
              and 'multipartClaims: [MultipartClaim]' in swift
              and 'commitMultipartClaimBeforeResume' in swift
          )
          if already_green:
              print('DM-22 production contract already present; verifier-only pass.')
          else:
              red_gaps = [
                  ('Dart candidate carries claim', 'NativeParallelBackgroundCandidate' not in parallel),
                  ('Swift persists multipart claim', 'multipartClaims: [MultipartClaim]' not in swift),
                  ('pre-resume claim validation', 'commitMultipartClaimBeforeResume' not in swift),
              ]
              missing = [name for name, is_missing in red_gaps if is_missing]
              if not missing:
                  raise SystemExit('Expected DM-22 RED contract was not reproducible')
              print('DM-22 RED reproduced:', ', '.join(missing))

              old_plan = '''class NativeParallelBackgroundPlan {
  const NativeParallelBackgroundPlan({
    required this.parentTaskId,
    required this.maxConcurrent,
    required this.tasks,
  });

  final String parentTaskId;
  final int maxConcurrent;
  final List<DownloadTask> tasks;
}'''
