name: Diagnose source guard failures

on:
  push:
    branches:
      - plan/download-manager-reliability
    paths:
      - .github/workflows/dm22-ownership-handoff-green.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Capture exact source guard boundaries
        shell: python
        run: |
          from pathlib import Path

          out = []
          source = Path('lib/core/services/download_service.dart').read_text()
          start = source.find('Future<void> _recoverPersistedDownloads() async')
          end = source.find('int _occupiedSlotCount(', start)
          recovery = source[start:end]
          job = recovery.find('final oldJob = await _jobStore.get(task.taskId);')
          canceled = recovery.find('record.status == TaskStatus.canceled')
          out += [
              f'recovery start={start} end={end} job={job} canceled={canceled}',
              'RECOVERY_TAIL:', recovery[max(0, min(job, canceled) - 500):max(job, canceled) + 1200],
          ]

          swift = Path('ios/Runner/DownloadNativeWaitingQueue.swift').read_text()
          hook_start = swift.find('private static func hookComplete(')
          hook_end = swift.find('private static func hookFinishDownload(', hook_start)
          hook = swift[hook_start:hook_end]
          retry = hook.find('retryBackgroundTransferIfNeeded(')
          callback = hook.find('if let original = DownloadUrlSessionHook.originalComplete')
          out += [
              f'hook start={hook_start} end={hook_end} retry={retry} callback={callback}',
              'HOOK:', hook,
              f'has_crlf={chr(13)+chr(10) in Path("ios/Runner/DownloadNativeWaitingQueue.swift").read_bytes().decode("utf-8")}',
          ]
          Path('/tmp/source-diagnostics.txt').write_text('\n'.join(out))
          print(Path('/tmp/source-diagnostics.txt').read_text())
      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: source-guard-diagnostics
          path: /tmp/source-diagnostics.txt
          retention-days: 1
