name: Apply and verify full-suite fixes

on:
  push:
    branches:
      - plan/download-manager-reliability
    paths:
      - .github/workflows/dm22-ownership-handoff-green.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Install dependencies and generate sources
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Apply minimal fixes
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}')
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'lib/core/services/persistent_parallel_download.dart',
              """  Future<void> _status(_ParallelSession session, TaskStatus status) async {
    diagnosticLog?.record('parallel.status', {
      'taskId': session.task.taskId,
      'status': status.name,
      'progress': session.progress,
    });
    if (status == TaskStatus.running) {
      session.parentRunningReported = true;
    } else if (status == TaskStatus.enqueued || status == TaskStatus.paused) {
      session.parentRunningReported = false;
    }
    await _writeParentRecord(
      session,
      TaskRecord(session.task, status, session.progress, session.size),
    );
    onUpdate(TaskStatusUpdate(session.task, status));
  }
""",
              """  Future<void> _status(_ParallelSession session, TaskStatus status) async {
    diagnosticLog?.record('parallel.status', {
      'taskId': session.task.taskId,
      'status': status.name,
      'progress': session.progress,
    });
    if (status == TaskStatus.running) {
      session.parentRunningReported = true;
    } else if (status == TaskStatus.enqueued || status == TaskStatus.paused) {
      session.parentRunningReported = false;
    }
    final record = TaskRecord(
      session.task,
      status,
      session.progress,
      session.size,
    );
    if (status == TaskStatus.running) {
      // Running is liveness/presentation telemetry. Queue persistence on the
      // ordered parent-record chain without blocking later child progress.
      onUpdate(TaskStatusUpdate(session.task, status));
      unawaited(
        _writeParentRecord(session, record).catchError(
          (Object _, StackTrace __) {},
        ),
      );
      return;
    }
    await _writeParentRecord(session, record);
    onUpdate(TaskStatusUpdate(session.task, status));
  }
""",
          )

          replace_once(
              'test/core/services/download_runtime_stability_review_test.dart',
              "source.indexOf('int _occupiedSlotCount(', start)",
              "source.indexOf('Future<int> _occupiedSlotCount(', start)",
          )
          replace_once(
              'test/core/services/download_runtime_stability_review_test.dart',
              "'if let original = DownloadUrlSessionHook.originalComplete'",
              "'guard let original = DownloadUrlSessionHook.originalComplete'",
          )
          replace_once(
              'test/core/services/download_thermal_efficiency_test.dart',
              """  test('native multipart state persistence is coalesced per parent sample', () {
    final swift = File('ios/Runner/DownloadNativeWaitingQueue.swift')
        .readAsStringSync();
""",
              """  test('native multipart state persistence is coalesced per parent sample', () {
    final swift = File('ios/Runner/DownloadNativeWaitingQueue.swift')
        .readAsStringSync()
        .replaceAll('\\r\\n', '\\n');
""",
          )

      - name: Format changed Dart files
        run: dart format lib/core/services/persistent_parallel_download.dart test/core/services/download_runtime_stability_review_test.dart test/core/services/download_thermal_efficiency_test.dart

      - name: Verify focused regressions
        run: |
          flutter test test/core/services/persistent_parallel_download_progress_test.dart --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key
          flutter test test/core/services/download_runtime_stability_review_test.dart --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key
          flutter test test/core/services/download_thermal_efficiency_test.dart --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key

      - name: Analyze touched Dart files
        run: flutter analyze --no-fatal-warnings --no-fatal-infos lib/core/services/persistent_parallel_download.dart test/core/services/persistent_parallel_download_progress_test.dart test/core/services/download_runtime_stability_review_test.dart test/core/services/download_thermal_efficiency_test.dart

      - name: Commit verified fixes
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/core/services/persistent_parallel_download.dart test/core/services/download_runtime_stability_review_test.dart test/core/services/download_thermal_efficiency_test.dart
          git diff --cached --exit-code && { echo "No changes to commit"; exit 1; } || true
          git commit -m "fix(downloads): unblock progress and refresh source guards"
          git push origin HEAD:plan/download-manager-reliability
