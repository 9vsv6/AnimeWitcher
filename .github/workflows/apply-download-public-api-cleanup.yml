name: Apply download public API cleanup

on:
  push:
    branches: [refactor/download-reliability-completion]

permissions:
  contents: write

concurrency:
  group: apply-download-public-api-cleanup
  cancel-in-progress: true

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/download-reliability-completion
          fetch-depth: 0

      - name: Apply guarded cleanup
        run: python3 tool/apply_download_public_api_cleanup.py

      - name: Commit cleanup
        run: |
          if git diff --quiet -- lib/core/services/download_service.dart test/core/services/download_internal_api_usage_test.dart; then
            echo "Expected public API cleanup produced no diff" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+Fares669@users.noreply.github.com"
          git add lib/core/services/download_service.dart test/core/services/download_internal_api_usage_test.dart
          git commit -m "Confine downloader internals and use public resumability APIs"
          git push origin HEAD:refactor/download-reliability-completion
