name: Replace custom Live Activity with iOS 26 download task

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: replace-live-activity-with-ios26-download-task
  cancel-in-progress: false

jobs:
  apply:
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Revert the v13 custom ActivityKit implementation
        shell: bash
        run: |
          set -euo pipefail

          custom_commit='3679113dc900cc7ef2ab335dc0852f7a727eb428'
          if [[ -d ios/SkyStreamDownloadActivity || \
                -f lib/core/services/download_live_activity_service.dart ]]; then
            git revert --no-commit "$custom_commit"
          else
            echo 'The v13 custom Live Activity files are already absent.'
          fi

          # Reverting the one-time commit restores its old workflow; never keep it.
          rm -f .github/workflows/add-download-live-activity.yml

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Require the iOS 26 SDK
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iPhoneOS SDK: $sdk_version"
          python3 - "$sdk_version" <<'PY'
          import sys
          major = int(sys.argv[1].split('.')[0])
          if major < 26:
              raise SystemExit(
                  'Xcode with the iOS 26 SDK is required for '
                  'BGContinuedProcessingTask.'
              )
          PY

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Add the system-managed iOS 26 implementation
        shell: bash
        run: |
          echo '' | base64 --decode > /tmp/apply_ios26_download_task.py
          python3 /tmp/apply_ios26_download_task.py

      - name: Install Xcode project editor
        run: gem install xcodeproj --no-document

      - name: Update the Runner Xcode target
        shell: bash
        run: |
          echo '' | base64 --decode > /tmp/update_runner_project.rb
          ruby -c /tmp/update_runner_project.rb
          ruby /tmp/update_runner_project.rb

      - name: Install dependencies and generate code
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Format and analyze changed Dart files
        shell: bash
        run: |
          dart format \
            lib/core/services/download_continued_processing_service.dart \
            lib/core/services/download_service.dart

          flutter analyze \
            --no-fatal-warnings \
            --no-fatal-infos \
            lib/core/services/download_continued_processing_service.dart \
            lib/core/services/download_service.dart

      - name: Verify source integration
        shell: bash
        run: |
          echo '' | base64 --decode > /tmp/verify_ios26_download_task.py
          python3 /tmp/verify_ios26_download_task.py
          git diff --check

      - name: Build iOS without code signing
        shell: bash
        run: |
          set -euo pipefail
          flutter build ios \
            --release \
            --no-codesign \
            2>&1 | tee /tmp/ios26-download-build.log

      - name: Verify the built app
        shell: bash
        run: |
          set -euo pipefail

          app='build/ios/iphoneos/Runner.app'
          test -d "$app"
          test ! -e "$app/PlugIns/SkyStreamDownloadActivity.appex"

          python3 - "$app/Info.plist" <<'PY'
          import plistlib
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          with path.open('rb') as handle:
              plist = plistlib.load(handle)

          bundle_id = plist['CFBundleIdentifier']
          expected = f'{bundle_id}.download.*'
          identifiers = plist.get('BGTaskSchedulerPermittedIdentifiers', [])
          if expected not in identifiers:
              raise SystemExit(
                  f'Built Info.plist is missing {expected!r}: {identifiers!r}'
              )

          print(f'Verified built wildcard identifier: {expected}')
          PY

      - name: Print focused build errors
        if: failure()
        shell: bash
        run: |
          if [[ -f /tmp/ios26-download-build.log ]]; then
            grep -nE '(^|[[:space:]])(error:|fatal error:)|BUILD FAILED|The following build commands failed' \
              /tmp/ios26-download-build.log || true
          fi

      - name: Remove this one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          workflow_path="${GITHUB_WORKFLOW_REF#${GITHUB_REPOSITORY}/}"
          workflow_path="${workflow_path%@*}"
          if [[ "$workflow_path" == .github/workflows/* ]]; then
            git rm --ignore-unmatch "$workflow_path"
          fi

      - name: Commit the replacement
        shell: bash
        run: |
          set -euo pipefail

          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Use iOS 26 continued processing for downloads'
          git push origin HEAD:main
