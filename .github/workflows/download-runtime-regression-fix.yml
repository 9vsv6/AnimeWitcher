name: Download Runtime Regression Fix

on:
  push:
    branches: [plan/download-manager-reliability]
    paths:
      - '.github/workflows/download-runtime-regression-fix.yml'
      - '.github/scripts/apply_download_runtime_regressions.py'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: plan/download-manager-reliability
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Apply production fixes
        run: python3 .github/scripts/apply_download_runtime_regressions.py

      - name: Format changed Dart
        run: |
          dart format \
            lib/core/services/download_continued_processing_service.dart \
            lib/core/services/download_service.dart \
            lib/core/services/download_transport.dart \
            lib/core/services/persistent_parallel_download.dart \
            test/core/services/download_continued_processing_start_ack_test.dart \
            test/core/services/download_ios_restart_telemetry_regression_test.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Focused regression tests
        run: |
          flutter test test/core/services/download_continued_processing_start_ack_test.dart
          flutter test test/core/services/download_ios_restart_telemetry_regression_test.dart
          flutter test test/core/services/download_transport_test.dart
          flutter test test/core/services/persistent_parallel_download_test.dart
          flutter test test/core/services/persistent_parallel_download_pending_start_lease_test.dart
          flutter test test/core/services/download_recovery_reconciliation_guard_test.dart
          flutter test test/core/services/download_runtime_ownership_test.dart

      - name: Analyze changed runtime surface
        run: |
          flutter analyze --no-fatal-warnings --no-fatal-infos \
            lib/core/services/download_continued_processing_service.dart \
            lib/core/services/download_service.dart \
            lib/core/services/download_transport.dart \
            lib/core/services/persistent_parallel_download.dart \
            test/core/services/download_continued_processing_start_ack_test.dart \
            test/core/services/download_ios_restart_telemetry_regression_test.dart \
            test/core/services/download_transport_test.dart

      - name: Commit verified fixes and remove temporary fixer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/download-runtime-regression-fix.yml
          git rm .github/scripts/apply_download_runtime_regressions.py
          git add lib test
          git commit -m 'fix(downloads): recover iOS runtime transfers and live telemetry'
          git push origin HEAD:plan/download-manager-reliability
