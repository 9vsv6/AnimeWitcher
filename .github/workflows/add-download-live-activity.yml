name: Add download Live Activity v13

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: macos-15
    timeout-minutes: 75

    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Select Xcode 16.4
        shell: bash
        run: |
          sudo xcode-select --switch /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version

      - name: Add Live Activity sources
        shell: bash
        run: |
          echo '' | base64 --decode > /tmp/add_download_live_activity.py
          python3 /tmp/add_download_live_activity.py
          ruby -c /tmp/configure_live_activity_project.rb

      - name: Verify ActivityKit API availability
        shell: bash
        run: |
          echo '' | base64 --decode > /tmp/verify_activitykit_apis.py
          python3 /tmp/verify_activitykit_apis.py

      - name: Install Xcode project editor
        shell: bash
        run: |
          if ! gem list -i xcodeproj >/dev/null 2>&1; then
            sudo gem install xcodeproj --no-document
          fi

      - name: Configure Xcode target
        run: ruby /tmp/configure_live_activity_project.rb

      - name: Set per-target iOS deployment versions
        shell: bash
        run: |
          ruby <<'RUBY'
          require 'xcodeproj'

          project_path = 'ios/Runner.xcodeproj'
          project = Xcodeproj::Project.open(project_path)

          runner = project.targets.find { |target| target.name == 'Runner' }
          activity = project.targets.find do |target|
            target.name == 'SkyStreamDownloadActivity'
          end

          raise 'Runner target was not found.' unless runner
          raise 'SkyStreamDownloadActivity target was not found.' unless activity

          runner.build_configurations.each do |config|
            config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.6'
          end

          activity.build_configurations.each do |config|
            config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '16.1'
          end

          project.save

          puts 'Runner deployment target: iOS 15.6'
          puts 'SkyStreamDownloadActivity deployment target: iOS 16.1'
          RUBY

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Switch project to CocoaPods
        shell: bash
        run: |
          echo '' | base64 --decode > /tmp/disable_swiftpm.py
          python3 /tmp/disable_swiftpm.py
          flutter config --no-enable-swift-package-manager
          flutter clean

      - name: Pin connectivity_plus for Xcode 16.4
        shell: bash
        run: |
          echo '' | base64 --decode > /tmp/pin_connectivity_plus.py
          python3 /tmp/pin_connectivity_plus.py

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Verify connectivity_plus compatibility
        shell: bash
        run: |
          echo '' | base64 --decode > /tmp/verify_connectivity_plus.py
          python3 /tmp/verify_connectivity_plus.py

      - name: Patch device_info_plus for Xcode 16.4
        shell: bash
        run: |
          echo '' | base64 --decode > /tmp/patch_device_info_plus.py
          python3 /tmp/patch_device_info_plus.py

      - name: Generate Riverpod files
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Regenerate iOS configuration
        run: flutter build ios --config-only

      - name: Remove Flutter SwiftPM integration
        shell: bash
        run: |
          echo '' | base64 --decode > /tmp/remove_swiftpm_xcode.rb
          ruby /tmp/remove_swiftpm_xcode.rb
          echo '' | base64 --decode > /tmp/scrub_flutter_swiftpm.py
          python3 /tmp/scrub_flutter_swiftpm.py
          rm -rf ios/Flutter/ephemeral/Packages/FlutterGeneratedPluginSwiftPackage
          rm -rf ios/Runner.xcworkspace/xcshareddata/swiftpm
          rm -rf ios/Runner.xcodeproj/project.xcworkspace/xcshareddata/swiftpm

      - name: Verify CocoaPods-only integration
        shell: bash
        run: |
          echo '' | base64 --decode > /tmp/verify_cocoapods.py
          python3 /tmp/verify_cocoapods.py

      - name: Format Dart files
        run: |
          dart format \
            lib/core/services/download_live_activity_service.dart \
            lib/core/services/download_service.dart

      - name: Analyze Dart changes
        run: |
          flutter analyze \
            lib/core/services/download_live_activity_service.dart \
            lib/core/services/download_service.dart

      - name: Validate property lists
        run: |
          plutil -lint ios/Runner/Info.plist
          plutil -lint ios/SkyStreamDownloadActivity/Info.plist

      - name: Install iOS pods
        working-directory: ios
        run: |
          rm -rf Pods
          pod install

      - name: Normalize and verify extension build phase order
        shell: bash
        run: |
          ruby /tmp/configure_live_activity_project.rb

          ruby <<'RUBY'
          require 'xcodeproj'

          project = Xcodeproj::Project.open('ios/Runner.xcodeproj')
          runner = project.targets.find { |target| target.name == 'Runner' }
          extension_target = project.targets.find do |target|
            target.name == 'SkyStreamDownloadActivity'
          end

          raise 'Runner target was not found.' unless runner
          raise 'SkyStreamDownloadActivity target was not found.' unless extension_target

          embed_phase = runner.copy_files_build_phases.find do |phase|
            phase.files.any? do |build_file|
              build_file.file_ref == extension_target.product_reference
            end
          end

          run_phase = runner.build_phases.find do |phase|
            next false unless phase.is_a?(
              Xcodeproj::Project::Object::PBXShellScriptBuildPhase
            )

            script = phase.shell_script.to_s
            phase.name == 'Run Script' ||
              script.include?('xcode_backend.sh" build') ||
              script.include?('xcode_backend.sh build')
          end

          raise 'Extension embed phase was not found.' unless embed_phase
          raise 'Flutter Run Script phase was not found.' unless run_phase

          embed_index = runner.build_phases.index(embed_phase)
          run_index = runner.build_phases.index(run_phase)

          unless embed_index && run_index && embed_index < run_index
            raise(
              "Embed Foundation Extensions must be before Flutter Run Script. " \
              "Found embed=#{embed_index.inspect}, run=#{run_index.inspect}."
            )
          end

          unless embed_phase.dst_subfolder_spec.to_s == '13'
            raise(
              "Extension embed destination must be PlugIns (13), found " \
              "#{embed_phase.dst_subfolder_spec.inspect}."
            )
          end

          puts 'Final Runner build phase order:'
          runner.build_phases.each_with_index do |phase, index|
            puts "  #{index}: #{phase.display_name}"
          end
          puts 'Verified extension embed phase is before Flutter Run Script.'
          RUBY

      - name: Clear stale Xcode build state
        shell: bash
        run: |
          rm -rf "$HOME/Library/Developer/Xcode/DerivedData/Runner-"*

      - name: Verify Xcode project
        run: |
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -list

      - name: Verify per-target deployment versions
        shell: bash
        run: |
          ruby <<'RUBY'
          require 'xcodeproj'

          project = Xcodeproj::Project.open('ios/Runner.xcodeproj')
          expected = {
            'Runner' => '15.6',
            'SkyStreamDownloadActivity' => '16.1',
          }

          expected.each do |target_name, required_version|
            target = project.targets.find { |item| item.name == target_name }
            raise "#{target_name} target was not found." unless target

            target.build_configurations.each do |config|
              actual = config.build_settings['IPHONEOS_DEPLOYMENT_TARGET']
              puts "#{target_name} #{config.name}: #{actual}"
              unless actual == required_version
                raise(
                  "#{target_name} #{config.name} must target iOS "                   "#{required_version}, found #{actual.inspect}."
                )
              end
            end
          end
          RUBY

      - name: Build iOS simulator
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            build 2>&1 | tee /tmp/skystream-xcodebuild.log

      - name: Print focused Xcode errors
        if: failure()
        shell: bash
        run: |
          if [[ -f /tmp/skystream-xcodebuild.log ]]; then
            grep -nE '(^|[[:space:]])(error:|fatal error:)|Cycle inside|Cycle details:|CYCLE POINT|BUILD FAILED|The following build commands failed' \
              /tmp/skystream-xcodebuild.log || true
          fi

      - name: Verify diff and ActivityKit compatibility
        shell: bash
        run: |
          git diff --check
          grep -q 'return existing.id' ios/Runner/DownloadLiveActivityManager.swift
          if grep -q 'existing.content' ios/Runner/DownloadLiveActivityManager.swift; then
            echo 'Found an unguarded iOS 16.2-only Activity.content access.'
            exit 1
          fi

      - name: Commit feature and remove workflow
        shell: bash
        run: |
          workflow_path="${GITHUB_WORKFLOW_REF#${GITHUB_REPOSITORY}/}"
          workflow_path="${workflow_path%@*}"
          echo "Removing one-time workflow: $workflow_path"
          git rm --ignore-unmatch -- "$workflow_path"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            pubspec.yaml \
            pubspec.lock \
            ios/Podfile \
            lib/core/services/download_live_activity_service.dart \
            lib/core/services/download_service.dart \
            ios/Runner/AppDelegate.swift \
            ios/Runner/DownloadLiveActivityManager.swift \
            ios/Runner/Info.plist \
            ios/LiveActivityShared/DownloadActivityAttributes.swift \
            ios/SkyStreamDownloadActivity/SkyStreamDownloadActivityBundle.swift \
            ios/SkyStreamDownloadActivity/DownloadLiveActivityWidget.swift \
            ios/SkyStreamDownloadActivity/Info.plist \
            ios/LiveActivity.xcconfig \
            ios/Runner.xcodeproj/project.pbxproj \
            ios/Runner.xcodeproj/xcshareddata/xcschemes/Runner.xcscheme

          if git diff --cached --quiet; then
            echo "No staged changes to commit."
            exit 0
          fi

          git commit -m "Add iOS download Live Activity"
          git push origin HEAD:main
