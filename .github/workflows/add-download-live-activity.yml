name: Add download Live Activity v5

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: macos-15
    timeout-minutes: 75

    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Add Live Activity sources
        shell: bash
        run: |
          echo '' | base64 --decode > /tmp/add_download_live_activity.py
          python3 /tmp/add_download_live_activity.py
          ruby -c /tmp/configure_live_activity_project.rb

      - name: Install Xcode project editor
        shell: bash
        run: |
          if ! gem list -i xcodeproj >/dev/null 2>&1; then
            sudo gem install xcodeproj --no-document
          fi

      - name: Configure Xcode target
        run: ruby /tmp/configure_live_activity_project.rb

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Generate Riverpod files
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Regenerate iOS configuration
        run: flutter build ios --config-only

      - name: Harden Flutter SwiftPM pre-action
        shell: bash
        run: |
          echo '' | base64 --decode > /tmp/harden_swiftpm_preaction.py
          python3 /tmp/harden_swiftpm_preaction.py

      - name: Verify generated Swift package target
        shell: bash
        run: |
          PACKAGE_FILE="ios/Flutter/ephemeral/Packages/FlutterGeneratedPluginSwiftPackage/Package.swift"

          if [ ! -f "$PACKAGE_FILE" ]; then
            echo "Generated Flutter Swift package was not found."
            exit 1
          fi

          echo "Generated package platforms:"
          grep -n "platforms\|\.iOS" "$PACKAGE_FILE" || true

          if grep -Eq '\.iOS\((\.v13|"13\.0")\)' "$PACKAGE_FILE"; then
            echo "FlutterGeneratedPluginSwiftPackage is still targeting iOS 13."
            exit 1
          fi

      - name: Format Dart files
        run: |
          dart format \
            lib/core/services/download_live_activity_service.dart \
            lib/core/services/download_service.dart

      - name: Analyze Dart changes
        run: |
          flutter analyze \
            lib/core/services/download_live_activity_service.dart \
            lib/core/services/download_service.dart

      - name: Validate property lists
        run: |
          plutil -lint ios/Runner/Info.plist
          plutil -lint ios/SkyStreamDownloadActivity/Info.plist

      - name: Install iOS pods
        working-directory: ios
        run: pod install

      - name: Verify Xcode project
        run: |
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -list

      - name: Build iOS simulator
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            IPHONEOS_DEPLOYMENT_TARGET=15.6 \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            build

      - name: Verify diff
        run: git diff --check

      - name: Commit feature and remove workflow
        shell: bash
        run: |
          rm -f .github/workflows/add-download-live-activity.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            lib/core/services/download_live_activity_service.dart \
            lib/core/services/download_service.dart \
            ios/Runner/AppDelegate.swift \
            ios/Runner/DownloadLiveActivityManager.swift \
            ios/Runner/Info.plist \
            ios/LiveActivityShared/DownloadActivityAttributes.swift \
            ios/SkyStreamDownloadActivity/SkyStreamDownloadActivityBundle.swift \
            ios/SkyStreamDownloadActivity/DownloadLiveActivityWidget.swift \
            ios/SkyStreamDownloadActivity/Info.plist \
            ios/LiveActivity.xcconfig \
            ios/Runner.xcodeproj/project.pbxproj \
            ios/Runner.xcodeproj/xcshareddata/xcschemes/Runner.xcscheme \
            .github/workflows/add-download-live-activity.yml

          git commit -m "Add iOS download Live Activity"
          git push origin HEAD:main
