# Save this file in the repository as:
# .github/workflows/apply-skystream-liquid-glass-and-extension-settings.yml
# It intentionally performs no Flutter setup, analyze, test, or build step.

name: Apply Liquid Glass and extension settings UI

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-skystream-ui-main
  cancel-in-progress: false

jobs:
  apply:
    name: Apply and push UI changes
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Apply the four UI files
        id: patch
        shell: bash
        run: |
          set -euo pipefail

          apply_one() {
            local label="$1"
            local patch_file="$2"

            if git apply --reverse --check "$patch_file" >/dev/null 2>&1; then
              echo "$label is already applied."
              return 0
            fi

            if git apply --check "$patch_file" >/dev/null 2>&1; then
              git apply "$patch_file"
              echo "Applied $label."
              return 0
            fi

            if git apply --3way "$patch_file"; then
              echo "Applied $label with a three-way merge."
              return 0
            fi

            echo "::error::Could not merge $label with the current main branch."
            git status --short
            exit 1
          }

          cat > "$RUNNER_TEMP/app_delegate.patch" <<'PATCH_APP_DELEGATE'
          diff --git a/ios/Runner/AppDelegate.swift b/ios/Runner/AppDelegate.swift
          index cf09caa..3acabbe 100644
          --- a/ios/Runner/AppDelegate.swift
          +++ b/ios/Runner/AppDelegate.swift
          @@ -2,6 +2,9 @@ import Flutter
           import UIKit
           import UserNotifications
           
          +private let liquidGlassTabBarViewType =
          +  "dev.akash.skystream/liquid_glass_tab_bar"
          +
           @main
           @objc class AppDelegate: FlutterAppDelegate, FlutterImplicitEngineDelegate {
             private var downloadContinuedProcessingChannel: FlutterMethodChannel?
          @@ -36,6 +39,12 @@ import UserNotifications
             func didInitializeImplicitFlutterEngine(_ engineBridge: FlutterImplicitEngineBridge) {
               GeneratedPluginRegistrant.register(with: engineBridge.pluginRegistry)
           
          +    let applicationRegistrar = engineBridge.applicationRegistrar
          +    applicationRegistrar.register(
          +      LiquidGlassTabBarFactory(messenger: applicationRegistrar.messenger()),
          +      withId: liquidGlassTabBarViewType
          +    )
          +
               let channel = FlutterMethodChannel(
                 name: "dev.akash.skystream/download_continued_processing",
                 binaryMessenger: engineBridge.applicationRegistrar.messenger()
          @@ -153,3 +162,302 @@ import UserNotifications
               downloadContinuedProcessingChannel = channel
             }
           }
          +
          +private final class LiquidGlassTabBarFactory: NSObject, FlutterPlatformViewFactory {
          +  private let messenger: FlutterBinaryMessenger
          +
          +  init(messenger: FlutterBinaryMessenger) {
          +    self.messenger = messenger
          +    super.init()
          +  }
          +
          +  func create(
          +    withFrame frame: CGRect,
          +    viewIdentifier viewId: Int64,
          +    arguments args: Any?
          +  ) -> FlutterPlatformView {
          +    LiquidGlassTabBarPlatformView(
          +      frame: frame,
          +      viewId: viewId,
          +      arguments: args,
          +      messenger: messenger
          +    )
          +  }
          +
          +  func createArgsCodec() -> FlutterMessageCodec & NSObjectProtocol {
          +    FlutterStandardMessageCodec.sharedInstance()
          +  }
          +}
          +
          +private final class LiquidGlassTabBarPlatformView: NSObject, FlutterPlatformView {
          +  private let tabBarView: LiquidGlassTabBarView
          +  private let channel: FlutterMethodChannel
          +
          +  init(
          +    frame: CGRect,
          +    viewId: Int64,
          +    arguments: Any?,
          +    messenger: FlutterBinaryMessenger
          +  ) {
          +    tabBarView = LiquidGlassTabBarView(frame: frame)
          +    channel = FlutterMethodChannel(
          +      name: "\(liquidGlassTabBarViewType)_\(viewId)",
          +      binaryMessenger: messenger
          +    )
          +    super.init()
          +
          +    tabBarView.apply(arguments: arguments as? [String: Any] ?? [:])
          +    tabBarView.onSelected = { [weak self] index in
          +      self?.channel.invokeMethod("onTap", arguments: index)
          +    }
          +
          +    channel.setMethodCallHandler { [weak tabBarView = self.tabBarView] call, result in
          +      DispatchQueue.main.async {
          +        guard let tabBarView = tabBarView else {
          +          result(false)
          +          return
          +        }
          +
          +        switch call.method {
          +        case "setSelectedIndex":
          +          guard let index = (call.arguments as? NSNumber)?.intValue else {
          +            result(
          +              FlutterError(
          +                code: "INVALID_INDEX",
          +                message: "A selected tab index is required.",
          +                details: nil
          +              )
          +            )
          +            return
          +          }
          +          tabBarView.setSelectedIndex(index, notifyFlutter: false)
          +          result(true)
          +
          +        default:
          +          result(FlutterMethodNotImplemented)
          +        }
          +      }
          +    }
          +  }
          +
          +  func view() -> UIView {
          +    tabBarView
          +  }
          +
          +  deinit {
          +    channel.setMethodCallHandler(nil)
          +  }
          +}
