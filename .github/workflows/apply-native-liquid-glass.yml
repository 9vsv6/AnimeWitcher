          PATCH_PLUGIN_SETTINGS

          apply_one "native Liquid Glass UIKit view" \
            "$RUNNER_TEMP/app_delegate.patch"
          apply_one "Flutter Liquid Glass navigation bridge" \
            "$RUNNER_TEMP/custom_bottom_nav.patch"
          apply_one "iOS content extension behind the glass bar" \
            "$RUNNER_TEMP/app_scaffold.patch"
          apply_one "extension settings application-style layout" \
            "$RUNNER_TEMP/plugin_settings.patch"

          if git diff --quiet; then
            echo "No changes are needed; main already contains this UI."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit the UI changes
        if: steps.patch.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            ios/Runner/AppDelegate.swift \
            lib/shared/widgets/custom_bottom_nav.dart \
            lib/shared/widgets/app_scaffold.dart \
            lib/features/extensions/screens/plugin_settings_screen.dart

          git commit -m \
            "Add Liquid Glass navigation and redesign extension settings"

      - name: Rebase safely and push main
        if: steps.patch.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          for attempt in 1 2 3; do
            echo "Push attempt $attempt of 3"
            git fetch origin main

            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::main contains a conflicting edit. Nothing was force-pushed."
              exit 1
            fi

            if git push origin HEAD:main; then
              exit 0
            fi
          done

          echo "::error::main kept changing during all three push attempts."
          exit 1
