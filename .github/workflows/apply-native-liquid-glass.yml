          PATCH

          if git apply --reverse --check "$patch_path"; then
            echo "The Liquid Glass patch is already applied."
          elif git apply --check "$patch_path"; then
            git apply "$patch_path"
            echo "Applied the Liquid Glass patch cleanly."
          else
            echo "The source moved; trying Git's three-way patch merge."
            git apply --3way "$patch_path"
          fi

      - name: Format and verify the implementation
        shell: bash
        run: |
          set -euo pipefail

          dart format \
            lib/shared/widgets/app_scaffold.dart \
            lib/shared/widgets/custom_bottom_nav.dart

          app_delegate="ios/Runner/AppDelegate.swift"
          app_scaffold="lib/shared/widgets/app_scaffold.dart"
          bottom_nav="lib/shared/widgets/custom_bottom_nav.dart"

          test "$(grep -Fc 'LiquidGlassTabBarFactory(messenger:' "$app_delegate")" -eq 1
          test "$(grep -Fc 'private final class LiquidGlassTabBarFactory' "$app_delegate")" -eq 1
          test "$(grep -Fc 'private final class LiquidGlassTabBarView' "$app_delegate")" -eq 1
          test "$(grep -Fc 'UIGlassEffect()' "$app_delegate")" -eq 1
          test "$(grep -Fc 'configuration = isSelected ? .glass() : .plain()' "$app_delegate")" -eq 1
          grep -Fq 'UIBlurEffect(style: .systemChromeMaterial)' "$app_delegate"

          test "$(grep -Fc 'const _liquidGlassTabBarViewType =' "$bottom_nav")" -eq 1
          test "$(grep -Fc 'child: UiKitView(' "$bottom_nav")" -eq 1
          grep -Fq 'defaultTargetPlatform == TargetPlatform.iOS' "$bottom_nav"

          test "$(grep -Fc 'extendBody:' "$app_scaffold")" -eq 1
          grep -Fq 'defaultTargetPlatform == TargetPlatform.iOS' "$app_scaffold"

          if grep -Rqs 'UIDesignRequiresCompatibility' ios/Runner; then
            echo "::error::UIDesignRequiresCompatibility disables Apple's modern iOS design."
            exit 1
          fi

          git diff --check
          git diff --cached --check

      - name: Resolve generated sources
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Guard the change scope
        shell: bash
        run: |
          set -euo pipefail

          allowed='^(ios/Runner/AppDelegate\.swift|lib/shared/widgets/app_scaffold\.dart|lib/shared/widgets/custom_bottom_nav\.dart)$'
          unexpected_tracked="$(
            git diff HEAD --name-only -- |
              grep -Ev "$allowed" || true
          )"
          unexpected_untracked="$(
            git ls-files --others --exclude-standard |
              grep -Ev "$allowed" || true
          )"

          if [[ -n "$unexpected_tracked" || -n "$unexpected_untracked" ]]; then
            echo "::error::A formatter or generator changed files outside the approved scope."
            [[ -z "$unexpected_tracked" ]] || printf 'Tracked changes:\n%s\n' "$unexpected_tracked"
            [[ -z "$unexpected_untracked" ]] || printf 'Untracked files:\n%s\n' "$unexpected_untracked"
            exit 1
          fi

          git diff --check
          git diff --cached --check

      - name: Analyze Dart
        shell: bash
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter tests
        shell: bash
        run: flutter test --no-pub

      - name: Compile the native iOS integration
        shell: bash
        run: flutter build ios --release --no-codesign --no-pub

      - name: Recheck the repository after all builds
        shell: bash
        run: |
          set -euo pipefail

          allowed='^(ios/Runner/AppDelegate\.swift|lib/shared/widgets/app_scaffold\.dart|lib/shared/widgets/custom_bottom_nav\.dart)$'
          unexpected_tracked="$(
            git diff HEAD --name-only -- |
              grep -Ev "$allowed" || true
          )"
          unexpected_untracked="$(
            git ls-files --others --exclude-standard |
              grep -Ev "$allowed" || true
          )"

          if [[ -n "$unexpected_tracked" || -n "$unexpected_untracked" ]]; then
            echo "::error::A verification command changed files outside the approved scope."
            [[ -z "$unexpected_tracked" ]] || printf 'Tracked changes:\n%s\n' "$unexpected_tracked"
            [[ -z "$unexpected_untracked" ]] || printf 'Untracked files:\n%s\n' "$unexpected_untracked"
            exit 1
          fi

          git diff --check
          git diff --cached --check

      - name: Commit only verified target files
        id: commit
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            ios/Runner/AppDelegate.swift \
            lib/shared/widgets/app_scaffold.dart \
            lib/shared/widgets/custom_bottom_nav.dart

          if git diff --cached --quiet; then
            echo "No commit is needed; main already contains the verified implementation."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --cached --check
          git commit -m "Add native Apple Liquid Glass navigation"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Rebase safely and push main
        if: steps.commit.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          verify_after_rebase() {
            flutter pub get
            flutter gen-l10n
            dart run build_runner build --delete-conflicting-outputs

            if ! git diff --quiet || ! git diff --cached --quiet; then
              echo "::error::Rebasing exposed generated changes that are not part of the verified commit."
              git status --short
              exit 1
            fi

            grep -Fq 'UIGlassEffect()' ios/Runner/AppDelegate.swift
            grep -Fq 'configuration = isSelected ? .glass() : .plain()' ios/Runner/AppDelegate.swift
            grep -Fq 'child: UiKitView(' lib/shared/widgets/custom_bottom_nav.dart
            grep -Fq 'extendBody:' lib/shared/widgets/app_scaffold.dart

            flutter analyze --no-fatal-infos
            flutter test --no-pub
            flutter build ios --release --no-codesign --no-pub

            if ! git diff --quiet || ! git diff --cached --quiet; then
              echo "::error::A verification command dirtied the rebased commit."
              git status --short
              exit 1
            fi
          }

          for attempt in 1 2 3; do
            echo "Safe push attempt $attempt of 3"
            git fetch origin main
            before_rebase="$(git rev-parse HEAD)"

            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::main changed with a conflicting edit. No force-push was attempted."
              exit 1
            fi

            after_rebase="$(git rev-parse HEAD)"
            if [[ "$before_rebase" != "$after_rebase" ]]; then
              echo "main changed while this workflow ran; re-running every verification."
              verify_after_rebase
            fi

            if git push origin HEAD:main; then
              exit 0
            fi
          done

          echo "::error::main kept changing after three verified rebase attempts."
          exit 1
