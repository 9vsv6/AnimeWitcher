name: Agent 3 iOS Policy Verifier

on:
  push:
    branches:
      - plan/download-manager-reliability
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent3-ios-policy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dm28-ios-native-policy:
    # device_info_plus 13.2.0 references NSProcessInfo.isiOSAppOnVision,
    # which is declared by the iOS 26.1 SDK; macos-latest supplies Xcode 26.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Install locked Flutter dependencies and generate sources
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Verify selected SDK supports locked device_info_plus
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          sdk_version="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          python3 - "$sdk_version" <<'PY'
          import sys

          version = tuple(int(part) for part in sys.argv[1].split('.')[:2])
          if version < (26, 1):
              raise SystemExit(
                  'device_info_plus 13.2.0 requires an iOS 26.1+ SDK for '
                  f'NSProcessInfo.isiOSAppOnVision; selected simulator SDK is {sys.argv[1]}'
              )
          print(f'iOS simulator SDK: {sys.argv[1]}')
          PY

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Select iOS simulator
        id: sim
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          data=json.load(sys.stdin)
          for runtime, devices in data.get("devices", {}).items():
              if "iOS" not in runtime: continue
              for d in devices:
                  if d.get("isAvailable") and d.get("name", "").startswith("iPhone"):
                      print(d["udid"])
                      raise SystemExit(0)
          raise SystemExit(1)
          ')
          echo "id=$DEVICE_ID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b

      - name: Run DM-28 native policy XCTest
        run: |
          xcodebuild test \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.id }}" \
            -only-testing:RunnerTests/RunnerTests/testDM28PersistsRequestedLogicalConcurrencyThroughTen \
            CODE_SIGNING_ALLOWED=NO
