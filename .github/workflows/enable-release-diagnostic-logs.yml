name: Enable release diagnostic logs

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enable Talker logs in release builds
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          logger_path = Path("lib/core/logger/app_logger.dart")
          developer_path = Path(
              "lib/features/settings/presentation/"
              "developer_options_screen.dart"
          )

          logger = logger_path.read_text(encoding="utf-8")
          developer = developer_path.read_text(encoding="utf-8")

          old_logger = """final talker = TalkerFlutter.init(
            settings: TalkerSettings(enabled: kDebugMode),
          );"""
          new_logger = """final talker = TalkerFlutter.init(
            // Keep provider and JavaScript plugin diagnostics available
            // in release builds.
            settings: TalkerSettings(enabled: true),
          );"""

          if old_logger in logger:
              logger = logger.replace(old_logger, new_logger, 1)
          elif "TalkerSettings(enabled: true)" not in logger:
              raise SystemExit(
                  "Could not find the Talker enabled setting."
              )

          # kDebugMode is no longer used in app_logger.dart.
          if "kDebugMode" not in logger:
              logger = logger.replace(
                  "import 'package:flutter/foundation.dart';\n",
                  "",
                  1,
              )

          old_on_tap = """                onTap: () {
                            if (kDebugMode) {
                              unawaited(const AppLogsRoute().push<void>(context));
                            } else {
                              ref
                                  .read(notificationServiceProvider)
                                  .showInfo(
                                    'Log tracking requires a debug build to work',
                                  );
                            }
                          },"""

          new_on_tap = """                onTap: () {
                            unawaited(
                              const AppLogsRoute().push<void>(context),
                            );
                          },"""

          if old_on_tap in developer:
              developer = developer.replace(
                  old_on_tap,
                  new_on_tap,
                  1,
              )
          elif (
              "const AppLogsRoute().push<void>(context)" not in developer
              or "Log tracking requires a debug build to work" in developer
          ):
              raise SystemExit(
                  "Could not safely patch the View Logs action."
              )

          # notificationServiceProvider is still used by
          # _toggleAssetLoading. Keep/restore its import.
          notification_import = (
              "import '../../../core/services/"
              "notification_service.dart';\n"
          )
          if (
              "notificationServiceProvider" in developer
              and notification_import not in developer
          ):
              anchor = (
                  "import '../../../core/router/app_router.dart';\n"
              )
              if anchor not in developer:
                  raise SystemExit(
                      "Could not restore notification service import."
                  )
              developer = developer.replace(
                  anchor,
                  anchor + notification_import,
                  1,
              )

          logger_path.write_text(logger, encoding="utf-8")
          developer_path.write_text(developer, encoding="utf-8")

          print("Release diagnostic logging patch applied.")
          PY

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Format changed files
        run: |
          dart format \
            lib/core/logger/app_logger.dart \
            lib/features/settings/presentation/developer_options_screen.dart

      - name: Generate Riverpod and router files
        run: |
          dart run build_runner build --delete-conflicting-outputs

      - name: Validate patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          logger = Path(
              "lib/core/logger/app_logger.dart"
          ).read_text(encoding="utf-8")
          developer = Path(
              "lib/features/settings/presentation/"
              "developer_options_screen.dart"
          ).read_text(encoding="utf-8")

          checks = {
              "Talker enabled in release":
                  "TalkerSettings(enabled: true)" in logger,
              "View Logs always opens":
                  "const AppLogsRoute().push<void>(context)"
                  in developer,
              "Old release warning removed":
                  "Log tracking requires a debug build to work"
                  not in developer,
              "Asset loading remains debug-only":
                  "if (kDebugMode)" in developer,
              "Notification provider import retained":
                  (
                      "notification_service.dart" in developer
                      and "notificationServiceProvider" in developer
                  ),
          }

          failed = [
              name for name, passed in checks.items()
              if not passed
          ]

          for name, passed in checks.items():
              print(f"{'OK' if passed else 'FAIL'}: {name}")

          if failed:
              raise SystemExit(
                  "Validation failed: " + ", ".join(failed)
              )
          PY

          git diff --check -- \
            lib/core/logger/app_logger.dart \
            lib/features/settings/presentation/developer_options_screen.dart

          flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet -- \
            lib/core/logger/app_logger.dart \
            lib/features/settings/presentation/developer_options_screen.dart
          then
            echo "No source changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            lib/core/logger/app_logger.dart \
            lib/features/settings/presentation/developer_options_screen.dart

          git commit -m \
            "feat: enable diagnostic logs in release builds"
          git push
