name: Enable release diagnostic logs

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enable Talker logs in release builds
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str, label: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"{label}: expected exactly one match in {path}, found {count}"
                  )
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          logger_path = "lib/core/logger/app_logger.dart"
          developer_path = (
              "lib/features/settings/presentation/"
              "developer_options_screen.dart"
          )

          # Talker currently uses kDebugMode, which completely disables
          # collection in profile/release builds. Keep Talker enabled so
          # JS console logs and [AWDIAG] entries are retained.
          replace_once(
              logger_path,
              "import 'package:flutter/foundation.dart';\n",
              "",
              "remove unused foundation import",
          )

          replace_once(
              logger_path,
              """final talker = TalkerFlutter.init(
            settings: TalkerSettings(enabled: kDebugMode),
          );""",
              """final talker = TalkerFlutter.init(
            // Keep in-app diagnostic history available in release builds.
            // This is required for provider and JavaScript plugin diagnostics.
            settings: TalkerSettings(enabled: true),
          );""",
              "enable Talker in release",
          )

          # The logs screen is safe to expose in release. Do not unlock the
          # separate asset-loading option or any other debug-only feature.
          replace_once(
              developer_path,
              """                onTap: () {
                            if (kDebugMode) {
                              unawaited(const AppLogsRoute().push<void>(context));
                            } else {
                              ref
                                  .read(notificationServiceProvider)
                                  .showInfo(
                                    'Log tracking requires a debug build to work',
                                  );
                            }
                          },""",
              """                onTap: () {
                            unawaited(const AppLogsRoute().push<void>(context));
                          },""",
              "allow release View Logs navigation",
          )

          # notificationServiceProvider was only used by the removed release
          # warning. Remove its now-unused import.
          replace_once(
              developer_path,
              "import '../../../core/services/notification_service.dart';\n",
              "",
              "remove unused notification service import",
          )

          print("Release diagnostic logging patch applied.")
          PY

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Format changed files
        run: |
          dart format \
            lib/core/logger/app_logger.dart \
            lib/features/settings/presentation/developer_options_screen.dart

      - name: Validate patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          logger = Path(
              "lib/core/logger/app_logger.dart"
          ).read_text(encoding="utf-8")
          developer = Path(
              "lib/features/settings/presentation/"
              "developer_options_screen.dart"
          ).read_text(encoding="utf-8")

          checks = {
              "Talker enabled in release":
                  "TalkerSettings(enabled: true)" in logger,
              "View Logs always opens":
                  "unawaited(const AppLogsRoute().push<void>(context));"
                  in developer,
              "Old release warning removed":
                  "Log tracking requires a debug build to work"
                  not in developer,
              "Asset loading remains debug-only":
                  "if (kDebugMode)" in developer,
          }

          failed = [name for name, passed in checks.items() if not passed]
          for name, passed in checks.items():
              print(f"{'OK' if passed else 'FAIL'}: {name}")

          if failed:
              raise SystemExit(
                  "Validation failed: " + ", ".join(failed)
              )
          PY

          git diff --check
          flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            lib/core/logger/app_logger.dart \
            lib/features/settings/presentation/developer_options_screen.dart

          git commit -m "feat: enable diagnostic logs in release builds"
          git push
