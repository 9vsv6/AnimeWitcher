name: Swap download progress labels

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: swap-download-progress-labels
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies and generate code
        run: |
          set -euo pipefail
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Put percentage on the far right
        shell: bash
        run: |
          echo '' | base64 --decode > /tmp/swap_download_labels.py
          python3 /tmp/swap_download_labels.py

      - name: Format and analyze
        run: |
          set -euo pipefail
          dart format lib/features/library/presentation/widgets/downloads_tab.dart
          flutter analyze \
            --no-fatal-warnings \
            --no-fatal-infos \
            lib/features/library/presentation/widgets/downloads_tab.dart

      - name: Verify requested layout
        shell: bash
        run: |
          echo '' | base64 --decode > /tmp/verify_download_labels.py
          python3 /tmp/verify_download_labels.py

      - name: Remove one-time workflow
        run: git rm --ignore-unmatch .github/workflows/swap-download-progress-labels.yml

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A

          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi

          git commit -m 'Move download percentage to the right'
          git push origin HEAD:main
