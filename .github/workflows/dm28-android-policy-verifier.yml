name: DM-28 Android policy verifier

on:
  push:
    branches:
      - plan/download-manager-reliability
    paths:
      - .github/workflows/dm28-android-policy-verifier.yml
      - lib/core/services/download_transport.dart
      - lib/core/services/download_service.dart
      - test/core/services/download_transport_test.dart
      - android/app/src/main/AndroidManifest.xml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dm28-android-policy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          ref: plan/download-manager-reliability

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Inject DM-28 Android policy behavior tests
        run: |
          cat > test/core/services/dm28_android_policy_test.dart <<'DART'
          import 'package:animewitcher/core/services/download_transport.dart';
          import 'package:background_downloader/background_downloader.dart';
          import 'package:flutter_test/flutter_test.dart';

          void main() {
            test('Android UIDT requires notification configuration and permission', () {
              expect(
                shouldUseUserInitiatedDownloadHint(
                  isAndroid: true,
                  notificationsConfigured: true,
                  notificationPermissionGranted: true,
                ),
                isTrue,
              );
              expect(
                shouldUseUserInitiatedDownloadHint(
                  isAndroid: true,
                  notificationsConfigured: false,
                  notificationPermissionGranted: true,
                ),
                isFalse,
              );
              expect(
                shouldUseUserInitiatedDownloadHint(
                  isAndroid: true,
                  notificationsConfigured: true,
                  notificationPermissionGranted: false,
                ),
                isFalse,
              );
            });

            test('non-Android user initiated policy is independent of Android notifications', () {
              expect(
                shouldUseUserInitiatedDownloadHint(
                  isAndroid: false,
                  notificationsConfigured: false,
                  notificationPermissionGranted: false,
                ),
                isTrue,
              );
            });

            test('large-file fallback survives when Android UIDT is unavailable', () {
              final hints = animeDownloadTransferHints(
                expectedBytes: 900 * 1024 * 1024,
                useUserInitiated: false,
              );
              expect(hints, isNot(contains(TransferHint.userInitiated)));
              expect(hints, contains(TransferHint.largeFile));
            });

            test('eligible user initiated download keeps both useful hints', () {
              final hints = animeDownloadTransferHints(
                expectedBytes: 900 * 1024 * 1024,
                useUserInitiated: true,
              );
              expect(hints, contains(TransferHint.userInitiated));
              expect(hints, contains(TransferHint.largeFile));
            });
          }
          DART

      - name: Verify DM-28 Android behavior
        run: |
          flutter test test/core/services/dm28_android_policy_test.dart test/core/services/download_transport_test.dart

      - name: Verify service uses runtime notification policy for start and resume
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('lib/core/services/download_service.dart').read_text()
          if source.count('shouldUseUserInitiatedDownloadHint(') < 2:
              raise SystemExit('start/resume do not both use the DM-28 UIDT policy')
          if source.count('FileDownloader().permissions.status(') < 2:
              raise SystemExit('start/resume do not both verify notification permission')
          if source.count('shouldClearDownloadNotificationConfigs(') < 2:
              raise SystemExit('start/resume do not both respect notification configuration')
          PY

      - name: Build Android debug app and merged manifest
        run: flutter build apk --debug --no-pub

      - name: Verify Android 14 UIDT declarations
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          ns = '{http://schemas.android.com/apk/res/android}'
          candidates = list(Path('build/app/intermediates').rglob('AndroidManifest.xml'))
          if not candidates:
              raise SystemExit('no merged AndroidManifest.xml produced')
          merged = max(candidates, key=lambda p: p.stat().st_size)
          root = ET.parse(merged).getroot()
          permissions = {
              e.attrib.get(ns + 'name', '')
              for e in root.findall('uses-permission')
          }
          services = [
              e.attrib.get(ns + 'name', '')
              for e in root.findall('./application/service')
          ]
          required = 'android.permission.RUN_USER_INITIATED_JOBS'
          if required not in permissions:
              raise SystemExit(f'missing {required}')
          uidt = [s for s in services if 'userinitiated' in s.lower() or 'uidt' in s.lower()]
          if not uidt:
              raise SystemExit('RUN_USER_INITIATED_JOBS is declared but no merged UIDT/UserInitiated service was found')
          print('merged manifest:', merged)
          print('UIDT services:', uidt)
          PY

      - name: Generate Dart sources and analyze
        run: |
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs
          flutter analyze --no-fatal-warnings --no-fatal-infos lib/core/services/download_transport.dart lib/core/services/download_service.dart test/core/services/download_transport_test.dart
