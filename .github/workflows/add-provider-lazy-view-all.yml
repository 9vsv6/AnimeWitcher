name: Add provider lazy View All (fixed)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch SkyStream
        shell: bash
        run: |
          echo '' | base64 --decode > /tmp/patch_skystream_lazy_view_all.py
          python3 /tmp/patch_skystream_lazy_view_all.py

      - name: Verify patch markers
        shell: bash
        run: |
          grep -q 'getHomeSection(String sectionName)' lib/core/extensions/base_provider.dart
          grep -q "getHomeSection: (typeof getHomeSection" lib/core/extensions/providers/js_based_provider.dart
          grep -q 'loadViewAll:' lib/features/home/presentation/home_screen.dart
          grep -q 'loadItems:' lib/core/router/app_router.dart

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Format changed files
        run: |
          dart format \
            lib/core/extensions/base_provider.dart \
            lib/core/extensions/providers/js_based_provider.dart \
            lib/features/explore/presentation/controllers/view_all_controller.dart \
            lib/features/explore/presentation/view_all_screen.dart \
            lib/core/router/app_router.dart \
            lib/features/explore/presentation/widgets/media_horizontal_list.dart \
            lib/features/home/presentation/home_screen.dart

      - name: Validate project
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit; patch is already applied."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            lib/core/extensions/base_provider.dart \
            lib/core/extensions/providers/js_based_provider.dart \
            lib/features/explore/presentation/controllers/view_all_controller.dart \
            lib/features/explore/presentation/view_all_screen.dart \
            lib/core/router/app_router.dart \
            lib/features/explore/presentation/widgets/media_horizontal_list.dart \
            lib/features/home/presentation/home_screen.dart

          git commit -m "feat: lazy-load provider View All sections"
          git push
