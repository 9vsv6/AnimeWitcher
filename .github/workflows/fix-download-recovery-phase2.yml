name: Fix Download Recovery Phase 2

on:
  push:
    branches:
      - fix/download-recovery-phase2-diagnostic-v3

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: macos-latest
    timeout-minutes: 70
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/download-recovery-phase2-diagnostic-v3
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply phase 2 repair
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/fix-download-recovery-phase2.py')
          text = path.read_text()
          # The generator writes Dart raw RegExp literals. `$` is the end anchor
          # there, so remove the accidental escaped-dollar in the generator.
          text = text.replace(r"\\$')", "$')")
          path.write_text(text)
          PY
          python3 .github/scripts/fix-download-recovery-phase2.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('test/core/services/persistent_parallel_download_fallback_test.dart')
          lines = path.read_text().splitlines()
          for index, line in enumerate(lines):
              if 'expect(manifestText, contains(' in line and 'resourceValidator' in line:
                  lines[index:index + 1] = [
                      "      expect(manifestText, contains('resourceValidator'));",
                      r"      expect(manifestText, contains(r'\"v1\"'));",
                  ]
                  break
          else:
              raise SystemExit('resourceValidator manifest assertion not found')
          path.write_text('\n'.join(lines) + '\n')
          PY

      - name: Install dependencies and generate sources
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Format changed Dart files
        run: |
          dart format \
            lib/core/services/download_range_transfer.dart \
            lib/core/services/persistent_parallel_download.dart \
            test/core/services/download_range_fast_fail_policy_test.dart \
            test/core/services/persistent_parallel_download_fallback_test.dart
          git diff --check

      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Fast-fail baseline regression
        run: flutter test test/core/services/download_range_fast_fail_policy_test.dart --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key

      - name: Range transfer regression
        run: flutter test test/core/services/download_range_transfer_test.dart --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key

      - name: Native range and validator regression
        run: flutter test test/core/services/persistent_parallel_download_fallback_test.dart --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key

      - name: Multipart recovery regression
        run: flutter test test/core/services/persistent_parallel_download_auto_recovery_test.dart test/core/services/persistent_parallel_download_progress_test.dart --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key

      - name: URL refresh regression
        run: flutter test test/core/services/download_url_refresh_test.dart --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key

      - name: Full test suite
        run: flutter test --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key

      - name: Commit verified repair and remove one-shot CI
        run: |
          rm .github/scripts/fix-download-recovery-phase2.py
          rm .github/workflows/fix-download-recovery-phase2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/core/services/download_range_transfer.dart \
            lib/core/services/persistent_parallel_download.dart \
            test/core/services/download_range_fast_fail_policy_test.dart \
            test/core/services/persistent_parallel_download_fallback_test.dart
          git add -u .github/scripts/fix-download-recovery-phase2.py .github/workflows/fix-download-recovery-phase2.yml
          git diff --cached --check
          git commit -m "Harden multipart Range identity and validator recovery"
          git push origin HEAD:fix/download-recovery-phase2-diagnostic-v3
