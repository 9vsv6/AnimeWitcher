name: DM-15 snapshot version GREEN

on:
  push:
    branches:
      - plan/download-manager-reliability
    paths:
      - .github/workflows/dm14-final-acceptance.yml

permissions:
  contents: write

jobs:
  snapshot-version:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: plan/download-manager-reliability
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Confirm DM-15 RED before production patch
        run: |
          if flutter test test/core/services/ios_native_queue_snapshot_version_guard_test.dart --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key; then
            echo "DM-15 RED unexpectedly passed before production patch"
            exit 1
          fi
          echo "DM-15 RED reproduced"

      - name: Apply versioned native queue checkpoint patch
        run: python3 tool/dm15_apply_snapshot_version.py

      - name: Verify DM-15 GREEN contract
        run: |
          dart format lib/core/services/download_continued_processing_service.dart test/core/services/ios_native_queue_snapshot_version_guard_test.dart
          flutter test test/core/services/ios_native_queue_snapshot_version_guard_test.dart --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key
          dart run build_runner build --delete-conflicting-outputs
          flutter analyze --no-fatal-warnings --no-fatal-infos lib/core/services/download_continued_processing_service.dart test/core/services/ios_native_queue_snapshot_version_guard_test.dart
          git diff --check

      - name: Commit, rebase and reverify version contract
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/core/services/download_continued_processing_service.dart ios/Runner/DownloadNativeWaitingQueue.swift ios/Runner/AppDelegate.swift test/core/services/ios_native_queue_snapshot_version_guard_test.dart
          if git diff --cached --quiet; then
            echo "DM-15 snapshot version patch already present"
            exit 0
          fi
          git commit -m "fix(downloads): version and acknowledge iOS queue snapshots (DM-15)"
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin plan/download-manager-reliability
          flutter pub get
          flutter test test/core/services/ios_native_queue_snapshot_version_guard_test.dart --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key
          dart run build_runner build --delete-conflicting-outputs
          flutter analyze --no-fatal-warnings --no-fatal-infos lib/core/services/download_continued_processing_service.dart test/core/services/ios_native_queue_snapshot_version_guard_test.dart
          git push origin HEAD:plan/download-manager-reliability
