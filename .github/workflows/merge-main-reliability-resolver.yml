name: Guarded main merge resolver

on:
  push:
    branches:
      - plan/download-manager-reliability
    paths:
      - .github/workflows/merge-main-reliability-resolver.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: guarded-main-merge-resolver
  cancel-in-progress: true

jobs:
  merge-main:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: plan/download-manager-reliability
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Fetch current main and verify presentation-test superset
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          python3 - <<'PY'
          import re
          import subprocess
          from pathlib import Path

          path = 'test/features/library/presentation/downloads_tab_test.dart'
          ours = Path(path).read_text()
          theirs = subprocess.check_output(
              ['git', 'show', f'origin/main:{path}'], text=True
          )
          pattern = re.compile(r"\b(?:test|testWidgets)\s*\(\s*(['\"])(.*?)\1", re.S)
          ours_titles = {m.group(2) for m in pattern.finditer(ours)}
          theirs_titles = {m.group(2) for m in pattern.finditer(theirs)}
          missing = sorted(ours_titles - theirs_titles)
          print(f'feature test titles: {len(ours_titles)}')
          print(f'main test titles: {len(theirs_titles)}')
          if missing:
              print('main is missing feature tests:')
              for title in missing:
                  print(f'  - {title}')
              raise SystemExit(1)
          print('main contains every feature-branch test title')
          PY

      - name: Merge main and resolve the single proven presentation-test conflict
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          set +e
          git merge --no-commit --no-ff origin/main
          rc=$?
          set -e
          conflicts="$(git diff --name-only --diff-filter=U)"
          expected="test/features/library/presentation/downloads_tab_test.dart"
          if [ "$rc" -ne 0 ]; then
            if [ "$conflicts" != "$expected" ]; then
              echo "Unexpected merge conflicts:"
              printf '%s\n' "$conflicts"
              exit 1
            fi
            git checkout --theirs -- "$expected"
            git add "$expected"
          fi
          if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
            echo "Unresolved conflicts remain"
            git diff --name-only --diff-filter=U
            exit 1
          fi

      - name: Install merged dependencies and generate sources
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Verify download-manager merge regressions
        run: >-
          flutter test
          test/core/services/download_logical_identity_test.dart
          test/core/services/download_logical_identity_start_test.dart
          test/core/services/download_job_logical_identity_test.dart
          test/core/services/download_logical_identity_persistence_test.dart
          test/core/utils/download_cleanup_canonical_safety_test.dart
          test/core/utils/download_resume_test.dart
          test/core/services/persistent_parallel_download_test.dart
          test/features/library/presentation/downloads_logical_identity_test.dart
          test/features/library/presentation/downloads_job_state_authority_test.dart
          test/features/library/presentation/downloads_tab_test.dart
          --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key

      - name: Analyze merged download surfaces
        run: >-
          flutter analyze --no-fatal-warnings --no-fatal-infos
          lib/core/services/download_service.dart
          lib/core/services/download_logical_identity.dart
          lib/features/details/presentation/download_launcher.dart
          lib/features/library/presentation/widgets/downloads_tab.dart
          test/features/library/presentation/downloads_tab_test.dart

      - name: Verify merge hygiene
        run: |
          git diff --check
          test -z "$(git diff --name-only --diff-filter=U)"
          git merge-base --is-ancestor origin/main HEAD || test -f .git/MERGE_HEAD

      - name: Commit and push merge to feature branch only
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git commit -m "merge: sync download reliability branch with main"
          git push origin HEAD:plan/download-manager-reliability
