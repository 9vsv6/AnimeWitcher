name: Guarded main merge resolver

on:
  push:
    branches:
      - plan/download-manager-reliability
    paths:
      - .github/workflows/merge-main-reliability-resolver.yml
      - .github/merge-main-reliability-trigger
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: guarded-main-merge-resolver
  cancel-in-progress: true

jobs:
  merge-main:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: plan/download-manager-reliability
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Fetch main and prove the only semantic test conflict
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          python3 - <<'PY'
          import re
          import subprocess
          from pathlib import Path

          path = 'test/features/library/presentation/downloads_tab_test.dart'
          ours = Path(path).read_text()
          theirs = subprocess.check_output(
              ['git', 'show', f'origin/main:{path}'], text=True
          )
          Path('/tmp/feature_downloads_tab_test.dart').write_text(ours)
          Path('/tmp/main_downloads_tab_test.dart').write_text(theirs)

          pattern = re.compile(r"\b(?:test|testWidgets)\s*\(\s*(['\"])(.*?)\1", re.S)
          ours_titles = {m.group(2) for m in pattern.finditer(ours)}
          theirs_titles = {m.group(2) for m in pattern.finditer(theirs)}
          safe_title = 'deleting the last episode preserves unknown series-folder evidence'
          unsafe_title = 'deleting the last episode removes the series folder leftover files and all'
          missing = ours_titles - theirs_titles

          print(f'feature test titles: {len(ours_titles)}')
          print(f'main test titles: {len(theirs_titles)}')
          if missing != {safe_title}:
              raise SystemExit(f'unexpected feature tests missing from main: {sorted(missing)}')
          if unsafe_title not in theirs_titles:
              raise SystemExit('expected legacy destructive cleanup test is not present in main')
          if safe_title in theirs_titles:
              raise SystemExit('main unexpectedly already contains the DM-14 safe cleanup test')
          print('proven semantic conflict: main has the legacy destructive cleanup contract only')
          PY

      - name: Merge main and preserve the DM-14 safe cleanup contract
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          set +e
          git merge --no-commit --no-ff origin/main
          rc=$?
          set -e
          conflicts="$(git diff --name-only --diff-filter=U)"
          expected="test/features/library/presentation/downloads_tab_test.dart"
          if [ "$rc" -ne 0 ]; then
            if [ "$conflicts" != "$expected" ]; then
              echo "Unexpected merge conflicts:"
              printf '%s\n' "$conflicts"
              exit 1
            fi
            git checkout --theirs -- "$expected"
          fi

          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path('test/features/library/presentation/downloads_tab_test.dart')
          merged = path.read_text()
          ours = Path('/tmp/feature_downloads_tab_test.dart').read_text()
          theirs = Path('/tmp/main_downloads_tab_test.dart').read_text()

          safe_start_marker = "  testWidgets(\n    'deleting the last episode preserves unknown series-folder evidence'"
          unsafe_start_marker = "  testWidgets(\n    'deleting the last episode removes the series folder leftover files and all'"
          next_marker = "\n  testWidgets('delete also removes sibling .part .tmp .download temps'"

          safe_start = ours.find(safe_start_marker)
          safe_end = ours.find(next_marker, safe_start)
          unsafe_start = merged.find(unsafe_start_marker)
          unsafe_end = merged.find(next_marker, unsafe_start)
          if min(safe_start, safe_end, unsafe_start, unsafe_end) < 0:
              raise SystemExit('could not isolate the cleanup-contract test blocks')

          safe_block = ours[safe_start:safe_end]
          merged = merged[:unsafe_start] + safe_block + merged[unsafe_end:]
          path.write_text(merged)

          pattern = re.compile(r"\b(?:test|testWidgets)\s*\(\s*(['\"])(.*?)\1", re.S)
          ours_titles = {m.group(2) for m in pattern.finditer(ours)}
          theirs_titles = {m.group(2) for m in pattern.finditer(theirs)}
          merged_titles = {m.group(2) for m in pattern.finditer(merged)}
          unsafe_title = 'deleting the last episode removes the series folder leftover files and all'
          expected_titles = ours_titles | (theirs_titles - {unsafe_title})
          if merged_titles != expected_titles:
              missing = sorted(expected_titles - merged_titles)
              extra = sorted(merged_titles - expected_titles)
              raise SystemExit(f'merged test-title mismatch; missing={missing}, extra={extra}')
          if unsafe_title in merged_titles:
              raise SystemExit('legacy destructive cleanup contract survived resolution')
          print(f'merged presentation tests: {len(merged_titles)} titles; DM-14 safe contract preserved')
          PY

          dart format "$expected"
          git add "$expected"
          if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
            echo "Unresolved conflicts remain"
            git diff --name-only --diff-filter=U
            exit 1
          fi

      - name: Install merged dependencies and generate sources
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Verify download-manager merge regressions
        run: >-
          flutter test
          test/core/services/download_logical_identity_test.dart
          test/core/services/download_logical_identity_start_test.dart
          test/core/services/download_job_logical_identity_test.dart
          test/core/services/download_logical_identity_persistence_test.dart
          test/core/utils/download_cleanup_canonical_safety_test.dart
          test/core/utils/download_resume_test.dart
          test/core/services/persistent_parallel_download_test.dart
          test/features/library/presentation/downloads_logical_identity_test.dart
          test/features/library/presentation/downloads_job_state_authority_test.dart
          test/features/library/presentation/downloads_tab_test.dart
          --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key

      - name: Analyze merged download surfaces
        run: >-
          flutter analyze --no-fatal-warnings --no-fatal-infos
          lib/core/services/download_service.dart
          lib/core/services/download_logical_identity.dart
          lib/features/details/presentation/download_launcher.dart
          lib/features/library/presentation/widgets/downloads_tab.dart
          test/features/library/presentation/downloads_tab_test.dart

      - name: Verify merge hygiene
        run: |
          git diff --check
          test -z "$(git diff --name-only --diff-filter=U)"
          test -f .git/MERGE_HEAD

      - name: Commit and push merge to feature branch only
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git commit -m "merge: sync download reliability branch with main"
          git push origin HEAD:plan/download-manager-reliability
