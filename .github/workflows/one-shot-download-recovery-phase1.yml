name: One-shot download recovery phase 1

on:
  push:
    branches:
      - fix/download-recovery-snapshot-phase1

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/download-recovery-snapshot-phase1

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Apply phase 1 patch
        run: |
          python3 tool/apply_download_recovery_phase1.py
          sed -i 's/int? _taskAttemptGeneration(DownloadTask task)/int? _taskAttemptGeneration(Task task)/' lib/core/services/persistent_parallel_download.dart
          python3 - <<'PY'
          from pathlib import Path
          path = Path('test/core/services/persistent_parallel_download_test.dart')
          text = path.read_text()
          old = """    final original = List<DownloadTask>.from(starts);\n    for (var attempt = 0; attempt < 6; attempt++) {\n      final expectedStarts = starts.length + 1;\n      coordinator.handleUpdate(\n        TaskStatusUpdate(original[1], TaskStatus.paused),\n      );\n      await waitUntil(() => starts.length >= expectedStarts);\n      final recovered = starts.last;\n      expect(recovered.taskId, original[1].taskId);\n      // A real native worker acknowledges the recovered enqueue before it can\n      // be interrupted again. Keep the slow-start batch state honest instead\n      // of injecting consecutive pause callbacks into an unacknowledged task.\n      await markRunning([recovered]);\n"""
          new = """    final original = List<DownloadTask>.from(starts);\n    var current = original[1];\n    for (var attempt = 0; attempt < 6; attempt++) {\n      final expectedStarts = starts.length + 1;\n      coordinator.handleUpdate(TaskStatusUpdate(current, TaskStatus.paused));\n      await waitUntil(() => starts.length >= expectedStarts);\n      final recovered = starts.last;\n      expect(recovered.taskId, original[1].taskId);\n      // Each interruption must come from the currently owned native attempt.\n      // Reusing the original task would intentionally exercise the stale-token\n      // fence rather than repeated real system pauses.\n      await markRunning([recovered]);\n      current = recovered;\n"""
          if text.count(old) != 1:
              raise SystemExit('repeated pause test block did not match exactly')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Format changed Dart files
        run: dart format lib/core/services/persistent_parallel_download.dart test/core/services/persistent_parallel_download_recovery_snapshot_test.dart test/core/services/persistent_parallel_download_test.dart

      - name: Install dependencies and generate sources
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Focused recovery tests
        run: |
          flutter test test/core/services/persistent_parallel_download_recovery_snapshot_test.dart
          flutter test test/core/services/persistent_parallel_download_test.dart
          flutter test test/core/services/persistent_parallel_download_auto_recovery_test.dart
          flutter test test/core/services/download_job_store_test.dart

      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Full Flutter suite
        run: flutter test --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key

      - name: Commit verified patch and remove temporary files
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-download-recovery-phase1.yml tool/apply_download_recovery_phase1.py
          git add lib/core/services/persistent_parallel_download.dart test/core/services/persistent_parallel_download_recovery_snapshot_test.dart test/core/services/persistent_parallel_download_test.dart
          git commit -m "Harden multipart recovery snapshots and stale callback fencing"
          git push origin HEAD:fix/download-recovery-snapshot-phase1
