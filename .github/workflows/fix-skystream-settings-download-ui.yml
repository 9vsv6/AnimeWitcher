# Revision 3: test SnackBar colors without creating the Google Fonts text theme.
name: Fix settings, download UI, and SnackBars v3

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-settings-download-ui
  cancel-in-progress: false

