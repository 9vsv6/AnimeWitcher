        run: >-
          dart format
          lib/core/services/download_service.dart
          lib/core/theme/app_theme.dart
          lib/core/utils/file_size_formatter.dart
          lib/features/extensions/providers/extensions_controller.dart
          lib/features/extensions/screens/plugin_settings_screen.dart
          lib/features/library/presentation/widgets/downloads_tab.dart
          test/core/theme/app_theme_test.dart
          test/core/utils/file_size_formatter_test.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Riverpod files
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            pubspec.yaml \
            lib/core/services/download_service.dart \
            lib/core/theme/app_theme.dart \
            lib/core/utils/file_size_formatter.dart \
            lib/features/extensions/providers/extensions_controller.dart \
            lib/features/extensions/screens/plugin_settings_screen.dart \
            lib/features/library/presentation/widgets/downloads_tab.dart \
