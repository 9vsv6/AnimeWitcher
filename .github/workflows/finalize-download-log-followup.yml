name: Download follow-up verification

on:
  push:
    branches:
      - fix/download-telemetry-log-review

permissions:
  contents: write

jobs:
  apply:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply reviewed fixes
        run: python3 .github/scripts/download-followup.py

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Dependencies
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Format
        run: |
          dart format lib/core/services/download_service.dart lib/core/services/download_continued_processing_service.dart lib/core/services/download_diagnostic_log.dart test/core/services/download_runtime_stability_review_test.dart test/core/services/download_diagnostic_log_test.dart
          git diff --check

      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Focused tests
        run: |
          flutter test test/core/services/download_runtime_stability_review_test.dart
          flutter test test/core/services/download_diagnostic_log_test.dart
          flutter test test/core/services/persistent_parallel_download_test.dart
          flutter test test/core/services/download_telemetry_test.dart

      - name: Full tests
        run: flutter test --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key

      - name: Parse Swift
        run: xcrun swiftc -parse ios/Runner/DownloadNativeWaitingQueue.swift ios/Runner/DownloadContinuedProcessingManager.swift

      - name: Commit verified changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/finalize-download-log-followup.yml .github/scripts/download-followup.py
          git add lib/core/services/download_service.dart lib/core/services/download_continued_processing_service.dart lib/core/services/download_diagnostic_log.dart test/core/services/download_runtime_stability_review_test.dart test/core/services/download_diagnostic_log_test.dart
          git commit -m 'Deduplicate multipart progress and system task updates'
          git push origin HEAD:fix/download-telemetry-log-review
