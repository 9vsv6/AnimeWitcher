      - name: Apply dynamic extension settings
        shell: bash
        run: python3 /tmp/add_plugin_settings.py

      - name: Generate code
        run: |
          set -euo pipefail
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Format changed Dart files
        run: |
          dart format \
            lib/core/extensions/models/extension_plugin.dart \
            lib/core/extensions/providers/js_based_provider.dart \
            lib/core/extensions/extension_manager.dart \
            lib/features/extensions/screens/extensions_screen.dart \
            lib/features/extensions/screens/plugin_settings_screen.dart

      - name: Analyze extension settings integration
        run: |
          flutter analyze \
            --no-fatal-warnings \
            --no-fatal-infos \
            lib/core/extensions/models/extension_plugin.dart \
            lib/core/extensions/providers/js_based_provider.dart \
            lib/core/extensions/extension_manager.dart \
            lib/features/extensions/screens/extensions_screen.dart \
            lib/features/extensions/screens/plugin_settings_screen.dart

      - name: Verify diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -f lib/features/extensions/screens/plugin_settings_screen.dart
          test ! -f lib/features/extensions/widgets/plugin_settings_dialog.dart
          grep -q 'PluginSettingsScreen' \
            lib/features/extensions/screens/extensions_screen.dart
          grep -q 'FutureBuilder<List<PluginSettingDefinition>>' \
            lib/features/extensions/screens/extensions_screen.dart
          grep -q 'final hasSettings =' \
            lib/features/extensions/screens/extensions_screen.dart
          grep -q 'return const SizedBox.shrink();' \
            lib/features/extensions/screens/extensions_screen.dart
          grep -q 'getSettingsForPlugin' \
            lib/core/extensions/extension_manager.dart
          grep -q 'getSettings:' \
            lib/core/extensions/providers/js_based_provider.dart

      - name: Remove one-time workflow
        run: |
          git rm --ignore-unmatch \
            .github/workflows/add-script-defined-plugin-settings.yml

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email \
            '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Add conditional script-defined extension settings'
          git push origin HEAD:main
