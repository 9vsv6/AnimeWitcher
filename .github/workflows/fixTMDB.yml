name: Fix TMDB copyWith and Build iOS

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-tmdb-copywith-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fix-and-build:
    name: Patch, verify, and build unsigned IPA
    runs-on: macos-15

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Select Xcode 26.6 when available
        shell: bash
        run: |
          if [ -d "/Applications/Xcode_26.6.app/Contents/Developer" ]; then
            sudo xcode-select -s "/Applications/Xcode_26.6.app/Contents/Developer"
          fi

          xcodebuild -version

      - name: Set up Flutter 3.44.8
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - name: Patch TmdbDetails relation fields
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("lib/core/models/tmdb_details.dart")
          text = path.read_text(encoding="utf-8")
          original = text

          def replace_once(old: str, new: str, label: str) -> None:
              global text

              if new in text:
                  print(f"{label}: already applied")
                  return

              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"{label}: expected exactly one matching block, found {count}. "
                      "The file may have changed; inspect it before retrying."
                  )

              text = text.replace(old, new, 1)
              print(f"{label}: applied")

          replace_once(
              """    super.source,
    super.nextAiring,
    dynamic sourceItem,
""",
              """    super.source,
    super.nextAiring,
    super.related,
    super.relationLabel,
    super.relationType,
    dynamic sourceItem,
""",
              "Constructor relation parameters",
          )

          replace_once(
              """    List<Trailer>? trailers,
    List<MultimediaItem>? recommendations,
    Map<String, String>? syncData,
""",
              """    List<Trailer>? trailers,
    List<MultimediaItem>? recommendations,
    List<MultimediaItem>? related,
    String? relationLabel,
    String? relationType,
    Map<String, String>? syncData,
""",
              "copyWith relation parameters",
          )

          replace_once(
              """      source: source ?? this.source,
      nextAiring: nextAiring ?? this.nextAiring,
      tmdbId: tmdbId ?? this.tmdbId,
""",
              """      source: source ?? this.source,
      nextAiring: nextAiring ?? this.nextAiring,
      related: related ?? this.related,
      relationLabel: relationLabel ?? this.relationLabel,
      relationType: relationType ?? this.relationType,
      tmdbId: tmdbId ?? this.tmdbId,
""",
              "copyWith relation forwarding",
          )

          if text != original:
              path.write_text(text, encoding="utf-8")
              print(f"Updated {path}")
          else:
              print("No source changes were needed.")
          PY

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Format patched file
        run: dart format lib/core/models/tmdb_details.dart

      - name: Analyze affected files
        run: |
          flutter analyze \
            --no-fatal-warnings \
            --no-fatal-infos \
            lib/core/domain/entity/multimedia_item.dart \
            lib/core/models/tmdb_details.dart

      - name: Create temporary Dart defines
        shell: bash
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          python3 <<'PY'
          import json
          import os

          # Empty value is enough for compilation while the secret is pending.
          # TMDB features require the real key at runtime.
          defines = {
              "TMDB_API_KEY": os.environ.get("TMDB_API_KEY", "")
          }

          with open("dart-defines.json", "w", encoding="utf-8") as file:
              json.dump(defines, file)
          PY

      - name: Build unsigned iOS app
        run: |
          flutter build ios \
            --release \
            --no-codesign \
            --dart-define-from-file=dart-defines.json

      - name: Package unsigned IPA
        shell: bash
        run: |
          rm -rf Payload skystream-ios-unsigned.ipa
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload skystream-ios-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: skystream-ios-unsigned
          path: skystream-ios-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Commit source fix
        shell: bash
        run: |
          git add lib/core/models/tmdb_details.dart

          if git diff --cached --quiet; then
            echo "The source fix is already present; nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: sync TmdbDetails copyWith relation fields"
          git push origin "HEAD:${GITHUB_REF_NAME}"
