name: Fix TMDB copyWith and Build iOS

'on':
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-and-build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - name: Fix TmdbDetails copyWith
        shell: python
        run: |
          from pathlib import Path

          path = Path("lib/core/models/tmdb_details.dart")
          original = path.read_text(encoding="utf-8")
          text = original

          def block(lines):
              return "\n".join(lines) + "\n"

          def replace_once(old, new, label):
              global text

              if new in text:
                  print(f"{label}: already applied")
                  return

              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"{label}: expected one matching block, found {count}"
                  )

              text = text.replace(old, new, 1)
              print(f"{label}: applied")

          replace_once(
              block([
                  "      super.source,",
                  "      super.nextAiring,",
                  "      dynamic sourceItem,",
              ]),
              block([
                  "      super.source,",
                  "      super.nextAiring,",
                  "      super.related,",
                  "      super.relationLabel,",
                  "      super.relationType,",
                  "      dynamic sourceItem,",
              ]),
              "Constructor parameters",
          )

          replace_once(
              block([
                  "    List<Trailer>? trailers,",
                  "    List<MultimediaItem>? recommendations,",
                  "    Map<String, String>? syncData,",
              ]),
              block([
                  "    List<Trailer>? trailers,",
                  "    List<MultimediaItem>? recommendations,",
                  "    List<MultimediaItem>? related,",
                  "    String? relationLabel,",
                  "    String? relationType,",
                  "    Map<String, String>? syncData,",
              ]),
              "copyWith parameters",
          )

          replace_once(
              block([
                  "        source: source ?? this.source,",
                  "        nextAiring: nextAiring ?? this.nextAiring,",
                  "        tmdbId: tmdbId ?? this.tmdbId,",
              ]),
              block([
                  "        source: source ?? this.source,",
                  "        nextAiring: nextAiring ?? this.nextAiring,",
                  "        related: related ?? this.related,",
                  "        relationLabel: relationLabel ?? this.relationLabel,",
                  "        relationType: relationType ?? this.relationType,",
                  "        tmdbId: tmdbId ?? this.tmdbId,",
              ]),
              "copyWith forwarding",
          )

          if text != original:
              path.write_text(text, encoding="utf-8")
              print(f"Updated {path}")
          else:
              print("Fix already exists.")

      - name: Install dependencies
        run: flutter pub get

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Format fixed file
        run: dart format lib/core/models/tmdb_details.dart

      - name: Analyze project
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Commit source fix
        shell: bash
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add lib/core/models/tmdb_details.dart
          git diff --staged --quiet || (git commit -m "Fix TMDB copyWith" && git push)
