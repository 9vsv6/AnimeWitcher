name: Fix TMDB copyWith and Build iOS

'on':
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-and-build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - name: Fix TmdbDetails copyWith
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("lib/core/models/tmdb_details.dart")
          text = path.read_text(encoding="utf-8")
          original = text

          def block(lines):
              return "\n".join(lines) + "\n"

          def replace_once(old, new, label):
              global text

              if new in text:
                  print(f"{label}: already applied")
                  return

              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"{label}: expected one matching block, found {count}"
                  )

              text = text.replace(old, new, 1)
              print(f"{label}: applied")

          replace_once(
              block([
                  "    super.source,",
                  "    super.nextAiring,",
                  "    dynamic sourceItem,",
              ]),
              block([
                  "    super.source,",
                  "    super.nextAiring,",
                  "    super.related,",
                  "    super.relationLabel,",
                  "    super.relationType,",
                  "    dynamic sourceItem,",
              ]),
              "Constructor parameters",
          )

          replace_once(
              block([
                  "    List<Trailer>? trailers,",
                  "    List<MultimediaItem>? recommendations,",
                  "    Map<String, String>? syncData,",
              ]),
              block([
                  "    List<Trailer>? trailers,",
                  "    List<MultimediaItem>? recommendations,",
                  "    List<MultimediaItem>? related,",
                  "    String? relationLabel,",
                  "    String? relationType,",
                  "    Map<String, String>? syncData,",
              ]),
              "copyWith parameters",
          )

          replace_once(
              block([
                  "      source: source ?? this.source,",
                  "      nextAiring: nextAiring ?? this.nextAiring,",
                  "      tmdbId: tmdbId ?? this.tmdbId,",
              ]),
              block([
                  "      source: source ?? this.source,",
                  "      nextAiring: nextAiring ?? this.nextAiring,",
                  "      related: related ?? this.related,",
                  "      relationLabel: relationLabel ?? this.relationLabel,",
                  "      relationType: relationType ?? this.relationType,",
                  "      tmdbId: tmdbId ?? this.tmdbId,",
              ]),
              "copyWith forwarding",
          )

          if text != original:
              path.write_text(text, encoding="utf-8")
              print(f"Updated {path}")
          else:
              print("Fix already exists.")
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Format fixed file
        run: dart format lib/core/models/tmdb_details.dart

      - name: Analyze project
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Commit source fix
        shell: bash
        run: |
          git add lib/core/models/tmdb_details.dart

          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "fix: sync TmdbDetails copyWith relation fields"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Create temporary Dart defines
        shell: bash
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          python3 -c 'import json, os; json.dump({"TMDB_API_KEY": os.environ.get("TMDB_API_KEY", "")}, open("dart-defines.json", "w"))'

      - name: Build unsigned iOS app
        run: |
          flutter build ios \
            --release \
            --no-codesign \
            --dart-define-from-file=dart-defines.json

      - name: Package unsigned IPA
        shell: bash
        run: |
          rm -rf Payload skystream-ios-unsigned.ipa
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload skystream-ios-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: skystream-ios-unsigned
          path: skystream-ios-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
