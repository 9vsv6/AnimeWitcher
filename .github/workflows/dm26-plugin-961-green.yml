name: DM-26 plugin 9.6.1 GREEN

on:
  push:
    branches:
      - plan/download-manager-reliability
    paths:
      - .github/workflows/dm26-plugin-961-green.yml
      - pubspec.yaml
      - pubspec.lock
      - ios/Runner/AppDelegate.swift
      - ios/Runner/DownloadNativeWaitingQueue.swift
      - ios/Runner/DownloadCallbackCompatibility.swift
      - ios/RunnerTests/RunnerTests.swift
      - ios/Podfile
      - ios/downloader_compatibility_version.rb
      - test/native/**
      - lib/core/services/download_continued_processing_service.dart
      - test/core/services/ios_native_progress_callback_source_test.dart
  workflow_dispatch:

permissions:
  contents: read

jobs:
  green:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          ref: plan/download-manager-reliability
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - name: Install locked dependencies and generate sources
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs
          grep -A7 '^  background_downloader:' pubspec.lock
          grep -q 'background_downloader: ^9.6.1' pubspec.yaml
      - name: Run native compatibility behavior and version-export tests
        run: |
          swiftc ios/Runner/DownloadCallbackCompatibility.swift test/native/dm26_compatibility_test.swift -o /tmp/dm26-compatibility-tests
          /tmp/dm26-compatibility-tests
          ruby test/native/dm26_version_test.rb
          python3 test/native/dm26_static_guard.py
      - name: Verify generated sources are synchronized
        run: git diff --exit-code
      - name: Prove 9.6.1 supported native callbacks are present
        shell: bash
        run: |
          ROOT="$(find "$HOME/.pub-cache" -type d -path '*/background_downloader-9.6.1' | head -1)"
          test -n "$ROOT"
          grep -R -Fq 'public static var onNativeTaskStatusChange: ((Task, TaskStatusUpdate) -> Void)?' "$ROOT/ios"
          grep -R -Fq 'public static var onNativeTaskProgressChange: ((Task, Double) -> Void)?' "$ROOT/ios"
          grep -R -q 'onNativeTaskStatusChange(task, statusUpdate)' "$ROOT/ios"
          grep -R -q 'onNativeTaskProgressChange(task, progress)' "$ROOT/ios"
      - name: Prove AnimeWitcher uses supported native callbacks with minimal hooks
        run: >-
          flutter test
          test/core/services/ios_native_progress_callback_source_test.dart
          --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key
      - name: Run iOS download regression matrix
        run: >-
          flutter test
          test/core/services/ios_native_queue_snapshot_version_guard_test.dart
          test/core/services/ios_native_queue_checkpoint_ack_guard_test.dart
          test/core/services/ios_native_queue_snapshot_ack_recovery_test.dart
          test/core/services/ios_continued_processing_completion_guard_test.dart
          test/core/services/ios_continued_processing_expiration_test.dart
          test/core/services/ios_multipart_native_bridge_source_test.dart
          --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key
      - name: Analyze download services
        run: >-
          flutter analyze --no-fatal-warnings --no-fatal-infos
          lib/core/services/download_service.dart
          lib/core/services/download_continued_processing_service.dart
      - name: Compile iOS simulator integration
        run: flutter build ios --simulator --no-codesign --debug
      - name: Run DM-26 native queue regression tests
        shell: bash
        run: |
          DM26_SIMULATOR_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for devices in d["devices"].values() for x in devices if x["name"].startswith("iPhone")))')"
          xcodebuild test -workspace ios/Runner.xcworkspace -scheme Runner -configuration Debug \
            -destination "platform=iOS Simulator,id=$DM26_SIMULATOR_ID" \
            -parallel-testing-enabled NO \
            -only-testing:RunnerTests/RunnerTests/testDM26DelayedStatusCannotCompleteReusedTaskOrReleaseItsSlot \
            -only-testing:RunnerTests/RunnerTests/testDM26PluginFileMoveFailureCannotBecomeSuccess \
            CODE_SIGNING_ALLOWED=NO
      - name: Diff sanity
        run: git diff --check
