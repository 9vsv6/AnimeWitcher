name: Apply episode multi-selection system

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Restore one-time patch script
        shell: bash
        run: |
          echo '' | base64 --decode > /tmp/apply_episode_changes.py
          python3 -m py_compile /tmp/apply_episode_changes.py

      - name: Apply source changes
        run: python3 /tmp/apply_episode_changes.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format changed Dart files
        run: |
          dart format \
            lib/core/storage/episode_watch_repository.dart \
            lib/core/storage/storage_service.dart \
            lib/features/details/presentation/details_controller.dart \
            lib/features/details/presentation/widgets/episode_card.dart \
            lib/features/player/presentation/player_controller.dart

      - name: Analyze changed files
        run: |
          flutter analyze \
            --no-fatal-infos \
            --no-fatal-warnings \
            lib/core/storage/episode_watch_repository.dart \
            lib/core/storage/storage_service.dart \
            lib/features/details/presentation/details_controller.dart \
            lib/features/details/presentation/widgets/episode_card.dart \
            lib/features/player/presentation/player_controller.dart

      - name: Verify diff
        run: |
          git diff --check
          test -f lib/core/storage/episode_watch_repository.dart
          grep -q "setSelectedEpisodesWatched" lib/features/details/presentation/details_controller.dart
          grep -q "onLongPress: updateSelection" lib/features/details/presentation/widgets/episode_card.dart
          grep -q "progressPercent >= 90" lib/features/player/presentation/player_controller.dart

      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/apply-episode-multi-selection.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            lib/core/storage/episode_watch_repository.dart \
            lib/core/storage/storage_service.dart \
            lib/features/details/presentation/details_controller.dart \
            lib/features/details/presentation/widgets/episode_card.dart \
            lib/features/player/presentation/player_controller.dart \
            .github/workflows/apply-episode-multi-selection.yml

          git commit -m "Add episode multi-selection and watched states"
          git push origin HEAD:main
