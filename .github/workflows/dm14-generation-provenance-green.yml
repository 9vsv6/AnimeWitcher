name: DM-24 alias adoption apply

on:
  push:
    branches:
      - plan/download-manager-reliability
    paths:
      - .github/workflows/dm14-generation-provenance-green.yml

permissions:
  contents: write

concurrency:
  group: dm24-alias-adoption-apply-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: plan/download-manager-reliability
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Prove DM-24 start/adoption RED before production patch
        shell: bash
        run: |
          set +e
          flutter test test/core/services/download_logical_identity_start_test.dart \
            --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo 'Expected alias-aware start/adoption regression to be RED before the production patch.'
            exit 1
          fi
          echo "Observed expected RED (exit=$status)."

      - name: Apply alias-aware logical adoption
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/core/services/download_service.dart')
          text = path.read_text()

          replacements = [
              (
                  """    final logicalId = DownloadLogicalIdentity.fromMedia(
              item: item,
              episode: episode,
            ).key;""",
                  """    final logicalIdentity = DownloadLogicalIdentity.fromMedia(
              item: item,
              episode: episode,
            );
            final logicalId = logicalIdentity.key;""",
              ),
              (
                  """      final logicalJobs = await _jobStore.allForLogicalId(logicalId);""",
                  """      final logicalJobs = (await _jobStore.all())
              .where((job) {
                final persisted = job.logicalId;
                return persisted != null &&
                    logicalIdentity.matchesPersistedKey(persisted);
              })
              .toList(growable: false);""",
              ),
              (
                  """          final candidateLogicalId =
              candidateJob.logicalId ?? logicalDownloadIdFromMetadata(metadata);
          if (candidateLogicalId != logicalId) continue;""",
                  """          final candidateLogicalId =
              candidateJob.logicalId ?? logicalDownloadIdFromMetadata(metadata);
          if (candidateLogicalId == null ||
              !logicalIdentity.matchesPersistedKey(candidateLogicalId)) {
            continue;
          }""",
              ),
              (
                  """          if (candidateLogicalId != null) {
            if (candidateLogicalId != logicalId) continue;
            existingLogicalJob = candidateJob;""",
                  """          if (candidateLogicalId != null) {
            if (!logicalIdentity.matchesPersistedKey(candidateLogicalId)) {
              continue;
            }
            existingLogicalJob = candidateJob;""",
              ),
              (
                  """    final storage = _ref.read(storageServiceProvider);
    final matches = <TaskRecord>[];
    for (final record in records) {""",
                  """    final storage = _ref.read(storageServiceProvider);
    final matches = <TaskRecord>[];
    final logicalIdentity = DownloadLogicalIdentity.fromMedia(
      item: item,
      episode: episode,
    );
    for (final record in records) {""",
              ),
              (
                  """      if (candidateLogicalId != null) {
        if (candidateLogicalId == logicalId) matches.add(record);
        continue;
      }""",
                  """      if (candidateLogicalId != null) {
        if (candidateLogicalId == logicalId ||
            logicalIdentity.matchesPersistedKey(candidateLogicalId)) {
          matches.add(record);
        }
        continue;
      }""",
              ),
          ]

          for old, new in replacements:
              if new in text:
                  continue
              if old not in text:
                  raise SystemExit(f'missing expected DM-24 anchor:\n{old}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Verify DM-24 GREEN
        run: |
          flutter test \
            test/core/services/download_logical_identity_test.dart \
            test/core/services/download_logical_identity_start_test.dart \
            test/core/services/download_job_logical_identity_test.dart \
            test/core/services/download_logical_identity_persistence_test.dart \
            test/core/services/download_overlay_logical_identity_test.dart \
            test/features/library/presentation/downloads_logical_identity_test.dart \
            --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key
          flutter analyze --no-fatal-warnings --no-fatal-infos \
            lib/core/services/download_logical_identity.dart \
            lib/core/services/download_service.dart \
            test/core/services/download_logical_identity_test.dart \
            test/core/services/download_logical_identity_start_test.dart
          git diff --check

      - name: Commit verified production patch
        run: |
          if git diff --quiet -- lib/core/services/download_service.dart; then
            echo 'Alias-aware service adoption already present.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/core/services/download_service.dart
          git commit -m 'fix(downloads): adopt enriched logical identity aliases (DM-24)'
          git pull --rebase origin plan/download-manager-reliability
          git push origin HEAD:plan/download-manager-reliability
