name: DM-14 provenance and canceled GC GREEN

on:
  push:
    branches:
      - plan/download-manager-reliability
    paths:
      - .github/workflows/dm14-generation-provenance-green.yml

permissions:
  contents: write

concurrency:
  group: dm14-generation-provenance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generation-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: plan/download-manager-reliability
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Apply DM-14 manifest provenance GREEN
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/core/services/persistent_parallel_download.dart')
          text = path.read_text()

          replacements = [
              (
                  """    required this.schemaVersion,\n    required this.parentTaskId,""",
                  """    required this.schemaVersion,\n    required this.generation,\n    required this.parentTaskId,""",
              ),
              (
                  """  final int schemaVersion;\n  final String parentTaskId;""",
                  """  final int schemaVersion;\n  final int generation;\n  final String parentTaskId;""",
              ),
              (
                  """          if (schemaVersion < 1 ||\n              schemaVersion > kParallelManifestSchemaVersion) {\n            continue;\n          }\n          final parentTaskId =""",
                  """          if (schemaVersion < 1 ||\n              schemaVersion > kParallelManifestSchemaVersion) {\n            continue;\n          }\n          final generation = (snapshot['generation'] as num?)?.toInt() ?? 0;\n          if (generation < 0) continue;\n          final parentTaskId =""",
              ),
              (
                  """            if (restored is! DownloadTask ||\n                !restored.taskId.startsWith('$parentTaskId.part.')) {\n              layoutValid = false;\n              break;\n            }\n            final size = to - from + 1;""",
                  """            if (restored is! DownloadTask ||\n                !restored.taskId.startsWith('$parentTaskId.part.')) {\n              layoutValid = false;\n              break;\n            }\n            final childPath = p.normalize(await restored.filePath());\n            final ownedPartsDirectory = p.normalize(p.dirname(canonicalPath));\n            if (!p.equals(p.dirname(childPath), ownedPartsDirectory)) {\n              layoutValid = false;\n              break;\n            }\n            final size = to - from + 1;""",
              ),
              (
                  """            schemaVersion: schemaVersion,\n            parentTaskId: parentTaskId,""",
                  """            schemaVersion: schemaVersion,\n            generation: generation,\n            parentTaskId: parentTaskId,""",
              ),
          ]

          changed = False
          for old, new in replacements:
              if new in text:
                  continue
              if old not in text:
                  raise SystemExit(f'missing expected anchor:\n{old}')
              text = text.replace(old, new, 1)
              changed = True

          if changed:
              path.write_text(text)
          PY

      - name: Verify manifest provenance GREEN
        run: |
          flutter test test/core/services/persistent_parallel_download_manifest_discovery_test.dart \
            --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key
          flutter analyze --no-fatal-warnings --no-fatal-infos \
            lib/core/services/persistent_parallel_download.dart \
            test/core/services/persistent_parallel_download_manifest_discovery_test.dart
          git diff --check

      - name: Commit manifest provenance if needed
        run: |
          if git diff --quiet -- lib/core/services/persistent_parallel_download.dart; then
            echo 'Manifest provenance GREEN already present.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add lib/core/services/persistent_parallel_download.dart
            git commit -m 'fix(downloads): harden manifest artifact provenance (DM-14)'
          fi

      - name: Apply ownership-fenced canceled multipart cleanup
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/core/services/download_service.dart')
          text = path.read_text()
          old = """      final restored = job.restoreTaskSnapshot();
      if (restored != null) {
        try {
          final path = await restored.filePath();"""
          new = """      final restored = job.restoreTaskSnapshot();
      if (restored is ParallelDownloadTask) {
        try {
          // The canceled tombstone plus notOwned runtime state proves the
          // logical attempt is obsolete. Let the multipart owner settle its
          // exact child identities before deleting its manifest/part files.
          await _parallel.cancel(restored);
        } catch (_) {
          // Preserve both the tombstone and artifacts when child ownership
          // cannot be settled. A later recovery pass can retry safely.
          continue;
        }
      }
      if (restored != null) {
        try {
          final path = await restored.filePath();"""
          if new not in text:
              if old not in text:
                  raise SystemExit('missing DM-14 tombstone GC anchor')
              text = text.replace(old, new, 1)
              path.write_text(text)
          PY

      - name: Verify canceled multipart GC GREEN
        run: |
          flutter test test/core/services/download_canceled_parallel_artifact_gc_guard_test.dart \
            test/core/services/download_delete_tombstone_guard_test.dart \
            --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key
          flutter analyze --no-fatal-warnings --no-fatal-infos \
            lib/core/services/download_service.dart \
            test/core/services/download_canceled_parallel_artifact_gc_guard_test.dart \
            test/core/services/download_delete_tombstone_guard_test.dart
          git diff --check

      - name: Commit verified DM-14 production changes
        run: |
          if ! git diff --quiet -- lib/core/services/download_service.dart; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add lib/core/services/download_service.dart
            git commit -m 'fix(downloads): clean canceled multipart artifacts safely (DM-14)'
          fi
          if git status --porcelain --untracked-files=no | grep -q .; then
            echo 'Unexpected tracked working-tree changes remain:'
            git status --short
            exit 1
          fi
          git clean -fd
          git pull --rebase origin plan/download-manager-reliability
          flutter test test/core/services/persistent_parallel_download_manifest_discovery_test.dart \
            test/core/services/download_canceled_parallel_artifact_gc_guard_test.dart \
            test/core/services/download_delete_tombstone_guard_test.dart \
            --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key
          git push origin HEAD:plan/download-manager-reliability
