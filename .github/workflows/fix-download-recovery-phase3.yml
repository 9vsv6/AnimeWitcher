name: Fix Download Recovery Phase 3

on:
  push:
    branches:
      - fix/download-recovery-phase3-retry-ownership

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/download-recovery-phase3-retry-ownership
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply Phase 3 repair
        run: python3 .github/scripts/fix-download-recovery-phase3.py

      - name: Install dependencies and generate sources
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Format changed Dart files
        run: |
          dart format \
            lib/core/services/download_parallel.dart \
            lib/core/services/persistent_parallel_download.dart \
            lib/core/services/download_service.dart \
            test/core/services/download_parallel_test.dart \
            test/core/services/persistent_parallel_download_auto_recovery_test.dart
          git diff --check

      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Parent metadata regression
        run: flutter test test/core/services/download_parallel_test.dart --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key

      - name: Retry ownership regression
        run: flutter test test/core/services/persistent_parallel_download_auto_recovery_test.dart --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key

      - name: Range and URL refresh regressions
        run: flutter test test/core/services/download_range_transfer_test.dart test/core/services/download_url_refresh_test.dart --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key

      - name: Multipart recovery regressions
        run: flutter test test/core/services/persistent_parallel_download_fallback_test.dart test/core/services/persistent_parallel_download_progress_test.dart --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key

      - name: Full test suite
        run: flutter test --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key

      - name: Commit verified Phase 3 repair
        run: |
          rm .github/scripts/fix-download-recovery-phase3.py
          rm .github/workflows/fix-download-recovery-phase3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/core/services/download_parallel.dart \
            lib/core/services/persistent_parallel_download.dart \
            lib/core/services/download_service.dart \
            test/core/services/download_parallel_test.dart \
            test/core/services/persistent_parallel_download_auto_recovery_test.dart
          git add -u .github/scripts/fix-download-recovery-phase3.py .github/workflows/fix-download-recovery-phase3.yml
          git diff --cached --check
          git commit -m "Fix multipart retry ownership and signed URL recovery"
          git push origin HEAD:fix/download-recovery-phase3-retry-ownership
