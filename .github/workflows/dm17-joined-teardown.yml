name: DM-17 joined teardown and reinitialization safety

on:
  push:
    branches:
      - plan/download-manager-reliability
    paths:
      - .github/workflows/dm17-joined-teardown.yml
      - lib/core/services/download_service.dart
      - lib/core/services/download_range_transfer.dart
      - lib/core/services/download_continued_processing_service.dart
      - test/core/services/download_teardown_barrier_test.dart
      - test/core/services/download_range_dispose_join_test.dart
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dm17-joined-teardown-${{ github.ref }}
  cancel-in-progress: true

jobs:
  joined-teardown:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          ref: plan/download-manager-reliability
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Install locked dependencies and generate sources
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Verify generated sources are synchronized
        run: git diff --exit-code

      - name: Verify joined teardown behavior
        run: >-
          flutter test
          test/core/services/download_teardown_barrier_test.dart
          test/core/services/download_range_dispose_join_test.dart
          --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key

      - name: Verify Range teardown regressions
        run: >-
          flutter test
          test/core/services/download_range_transfer_test.dart
          --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key

      - name: Verify continued-processing lifecycle regressions
        run: >-
          flutter test
          test/core/services/ios_continued_processing_completion_guard_test.dart
          test/core/services/ios_continued_processing_expiration_test.dart
          --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key

      - name: Analyze teardown surfaces
        run: >-
          flutter analyze --no-fatal-warnings --no-fatal-infos
          lib/core/services/download_service.dart
          lib/core/services/download_range_transfer.dart
          lib/core/services/download_continued_processing_service.dart
          test/core/services/download_teardown_barrier_test.dart

      - name: Diff sanity
        run: git diff --check
