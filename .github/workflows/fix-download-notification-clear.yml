name: Fix download notification clearing

on:
  push:
    branches: [refactor/download-reliability-completion]

permissions:
  contents: write

concurrency:
  group: fix-download-notification-clear
  cancel-in-progress: true

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/download-reliability-completion
          fetch-depth: 0
      - name: Apply guarded patch
        run: python3 tool/fix_download_notification_clear.py
      - name: Commit notification clear fix
        run: |
          if git diff --quiet -- lib/core/services/download_service.dart; then
            echo "Expected notification clear patch produced no diff" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+Fares669@users.noreply.github.com"
          git add lib/core/services/download_service.dart
          git commit -m "Fix all-off download notification configuration"
          git push origin HEAD:refactor/download-reliability-completion
