name: DM-15 snapshot version RED

on:
  push:
    branches:
      - plan/download-manager-reliability
    paths:
      - .github/workflows/dm15-snapshot-version-red.yml

jobs:
  red:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: plan/download-manager-reliability
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - run: flutter pub get
      - name: Run DM-15 RED guard
        run: flutter test test/core/services/ios_native_queue_snapshot_version_guard_test.dart --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key
