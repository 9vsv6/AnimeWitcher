name: Apply download link and session fix

# Temporary branch-only helper; removed after the implementation commit lands.
on:
  push:
    branches:
      - feat/download-link-copy-session-restore
    paths:
      - .github/workflows/apply-download-link-session-fix.yml

permissions:
  contents: write

jobs:
  implement:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/download-link-copy-session-restore
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Install dependencies
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Apply production changes
        run: python3 .github/scripts/apply_download_link_session_fix.py

      - name: Format changed Dart files
        run: |
          dart format \
            lib/features/details/presentation/download_launcher.dart \
            lib/core/account/animewitcher_account_service.dart \
            lib/core/account/account_providers.dart \
            test/features/details/presentation/download_confirmation_link_contract_test.dart \
            test/core/account/account_startup_restore_test.dart

      - name: Run focused regression tests
        run: |
          flutter test --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key \
            test/features/details/presentation/download_confirmation_link_contract_test.dart \
            test/features/details/presentation/download_launcher_test.dart \
            test/core/account/account_startup_restore_test.dart \
            test/core/account/comments_survive_a_bad_session_test.dart

      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/features/details/presentation/download_launcher.dart \
            lib/core/account/animewitcher_account_service.dart \
            lib/core/account/account_providers.dart
          git diff --cached --check
          git commit -m "feat: expose download URL and restore account from cache"
          git push origin HEAD:feat/download-link-copy-session-restore
