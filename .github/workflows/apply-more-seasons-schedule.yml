name: Apply More seasons schedule

on:
  push:
    branches:
      - main
    paths:
      - '.github/scripts/apply_more_seasons_schedule.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Apply source changes
        run: python3 .github/scripts/apply_more_seasons_schedule.py

      - name: Validate patch
        run: |
          git diff --check
          grep -q "getBroadcastSchedule" lib/core/extensions/providers/animewitcher_native_provider.dart
          grep -q "MoreScreen" lib/core/router/app_router.dart
          grep -q "المزيد" lib/core/navigation/taskbar_destination.dart

      - name: Commit source changes and remove one-off patch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/core/extensions/providers/animewitcher_native_provider.dart lib/core/navigation/taskbar_destination.dart lib/core/router/app_router.dart lib/features/more/presentation/more_screen.dart lib/features/more/presentation/seasons_screen.dart lib/features/more/presentation/broadcast_schedule_screen.dart
          git rm .github/scripts/apply_more_seasons_schedule.py .github/workflows/apply-more-seasons-schedule.yml
          git commit -m "Add More seasons and broadcast schedule"
          git push origin HEAD:main
