name: Apply PR181 fixes

on:
  push:
    branches:
      - fix/download-resume-stalls

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/download-resume-stalls
          fetch-depth: 0

      - name: Apply fixes
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 --decode > /tmp/fix_pr181.py
          python3 /tmp/fix_pr181.py
          rm -f .github/workflows/fix-pr181-analyzer.yml
          git fetch origin main
          git checkout origin/main -- .github/workflows/ci.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'fix: resolve PR 181 analyzer errors'
          git push origin HEAD:fix/download-resume-stalls
