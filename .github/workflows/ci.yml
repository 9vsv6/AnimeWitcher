name: Flutter Checks

on:
  pull_request:
    branches: [main, feat/manga-manhwa]
  push:
    branches: [main, fix/download-manager-performance-v2]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Install dependencies and generate sources
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        # Existing warnings and infos remain visible in the log, but only
        # analyzer errors block this first enforcement step. Warnings can be
        # reduced safely in dedicated cleanup PRs rather than masking real
        # build/test regressions behind a large baseline migration.
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Focused V2 tests
        # Keep the V2 architecture/reliability gate visible independently from
        # the repository-wide baseline so a known unrelated suite failure can
        # never hide a new download-manager regression.
        run: flutter test test/core/services/download_v2

      - name: Test
        # A mock Firestore client test exercises the configured REST path. This
        # harmless value satisfies its build-time configuration guard; it is
        # never sent to an external service by the test suite.
        run: flutter test --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key

  ios-v2-build:
    name: Build iOS V2 and retain log
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Install dependencies and generate sources
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Build iOS without code signing
        shell: bash
        run: |
          set -o pipefail
          flutter build ios --debug --no-codesign \
            --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key \
            2>&1 | tee ios-v2-build.log

      - name: Upload iOS build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-v2-build-log-${{ github.run_attempt }}
          path: ios-v2-build.log
          if-no-files-found: warn
          retention-days: 14

  native-log-typecheck:
    name: Typecheck native download logger
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Typecheck the production Foundation logger
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          source = Path('ios/Runner/DownloadNativeWaitingQueue.swift').read_text()
          logger = source[source.index('enum DownloadNativeDiagnosticLog'):source.index('import ObjectiveC')]
          stub = 'enum DownloadNativeWaitingQueue { static func taskId(from task: URLSessionTask) -> String? { nil } }'
          Path('/tmp/download-log.swift').write_text('import Foundation\n' + logger + stub)
          PYCODE
          swiftc -typecheck /tmp/download-log.swift


  api-benchmark:
    name: API latency benchmark
    runs-on: ubuntu-latest
    env:
      SIMKL_API_KEY: ${{ secrets.SIMKL_API_KEY }}
    steps:
      - name: Compare AniList and Simkl latency
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SIMKL_API_KEY:-}" ]; then
            echo "SIMKL_API_KEY is not available to this workflow."
            exit 1
          fi
          python3 - <<'PYCODE'
          import json
          import os
          import re
          import statistics
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          SIMKL_KEY = os.environ["SIMKL_API_KEY"]
          APP_NAME = "animewitcher-benchmark"
          APP_VERSION = "1.0"
          SAMPLES = 3
          TITLES = [
              ("Attack on Titan", 16498),
              ("Sword Art Online", 11757),
              ("Re:ZERO", 31240),
              ("Mushoku Tensei", 39535),
              ("That Time I Got Reincarnated as a Slime", 37430),
          ]

          ANILIST_QUERY = """
          query ($malId: Int) {
            Media(idMal: $malId, type: ANIME) {
              id
              idMal
              format
              title { romaji english native }
              synonyms
              startDate { year }
              coverImage { extraLarge large medium }
              relations {
                edges {
                  relationType
                  node {
                    id
                    idMal
                    format
                    title { romaji english native }
                    synonyms
                    startDate { year }
                    coverImage { extraLarge large medium }
                  }
                }
              }
            }
          }
          """

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          no_redirect = urllib.request.build_opener(NoRedirect)

          def timed_request(req, opener=urllib.request.urlopen):
              start = time.perf_counter()
              try:
                  with opener(req, timeout=20) as response:
                      body = response.read()
                      status = response.status
                      headers = response.headers
              except urllib.error.HTTPError as exc:
                  if exc.code not in (301, 302, 303, 307, 308):
                      raise
                  body = exc.read()
                  status = exc.code
                  headers = exc.headers
              elapsed_ms = (time.perf_counter() - start) * 1000
              return elapsed_ms, status, body, headers

          def anilist(mal_id):
              body = json.dumps({
                  "query": ANILIST_QUERY,
                  "variables": {"malId": mal_id},
              }).encode()
              req = urllib.request.Request(
                  "https://graphql.anilist.co",
                  data=body,
                  method="POST",
                  headers={
                      "Content-Type": "application/json",
                      "Accept": "application/json",
                      "User-Agent": f"{APP_NAME}/{APP_VERSION}",
                  },
              )
              ms, status, payload, headers = timed_request(req)
              if status != 200:
                  raise RuntimeError(f"AniList HTTP {status}")
              parsed = json.loads(payload)
              if parsed.get("errors"):
                  raise RuntimeError(f"AniList GraphQL errors: {parsed['errors']}")
              return ms, len(payload), headers.get("X-RateLimit-Remaining")

          def simkl_params(extra):
              params = {
                  "app-name": APP_NAME,
                  "app-version": APP_VERSION,
                  **extra,
              }
              return urllib.parse.urlencode(params)

          def simkl_headers():
              return {
                  "simkl-api-key": SIMKL_KEY,
                  "User-Agent": f"{APP_NAME}/{APP_VERSION}",
                  "Accept": "application/json",
              }

          def simkl_resolve(mal_id):
              url = "https://api.simkl.com/redirect?" + simkl_params({
                  "to": "simkl",
                  "mal": str(mal_id),
              })
              req = urllib.request.Request(url, headers=simkl_headers())
              ms, status, payload, headers = timed_request(req, no_redirect.open)
              if status != 301:
                  raise RuntimeError(f"Simkl redirect HTTP {status}")
              location = headers.get("Location", "")
              match = re.search(r"/anime/(\d+)(?:/|$)", location)
              if not match:
                  raise RuntimeError(f"No Simkl anime id in redirect for MAL {mal_id}")
              return ms, int(match.group(1)), len(payload)

          def simkl_detail(simkl_id):
              url = (
                  f"https://api.simkl.com/anime/{simkl_id}?"
                  + simkl_params({})
              )
              req = urllib.request.Request(url, headers=simkl_headers())
              ms, status, payload, _ = timed_request(req)
              if status != 200:
                  raise RuntimeError(f"Simkl detail HTTP {status}")
              parsed = json.loads(payload)
              if not parsed.get("ids", {}).get("simkl"):
                  raise RuntimeError(f"Simkl detail missing canonical id for {simkl_id}")
              return ms, len(payload)

          rows = []
          for round_no in range(1, SAMPLES + 1):
              for title, mal_id in TITLES:
                  ani_ms, ani_bytes, ani_remaining = anilist(mal_id)
                  # AniList is currently documented at a degraded 30 req/min.
                  # Keep the benchmark below that limit; sleep is outside timing.
                  time.sleep(2.1)

                  redirect_ms, simkl_id, _ = simkl_resolve(mal_id)
                  time.sleep(0.12)
                  detail_ms, simkl_bytes = simkl_detail(simkl_id)
                  time.sleep(0.12)

                  row = {
                      "round": round_no,
                      "title": title,
                      "mal_id": mal_id,
                      "simkl_id": simkl_id,
                      "anilist_ms": round(ani_ms, 2),
                      "simkl_redirect_ms": round(redirect_ms, 2),
                      "simkl_detail_ms": round(detail_ms, 2),
                      "simkl_end_to_end_ms": round(redirect_ms + detail_ms, 2),
                      "anilist_bytes": ani_bytes,
                      "simkl_bytes": simkl_bytes,
                      "anilist_remaining": ani_remaining,
                  }
                  rows.append(row)
                  print("SAMPLE " + json.dumps(row, ensure_ascii=False), flush=True)

          def summary(key):
              values = sorted(float(row[key]) for row in rows)
              p50 = statistics.median(values)
              # nearest-rank p95
              rank = max(1, int((0.95 * len(values) + 0.999999))) - 1
              rank = min(rank, len(values) - 1)
              return {
                  "n": len(values),
                  "mean_ms": round(statistics.fmean(values), 2),
                  "p50_ms": round(p50, 2),
                  "p95_ms": round(values[rank], 2),
                  "min_ms": round(values[0], 2),
                  "max_ms": round(values[-1], 2),
              }

          result = {
              "anilist_one_request": summary("anilist_ms"),
              "simkl_detail_only_cached_id": summary("simkl_detail_ms"),
              "simkl_mal_to_detail_two_requests": summary("simkl_end_to_end_ms"),
              "sample_count": len(rows),
              "titles": [title for title, _ in TITLES],
          }
          print("BENCHMARK_RESULT " + json.dumps(result, ensure_ascii=False), flush=True)
          PYCODE
