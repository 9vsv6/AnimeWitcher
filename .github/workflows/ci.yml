name: Flutter Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  purge-legacy-workflow-runs:
    name: Purge legacy workflow runs
    if: github.event_name == 'push' && github.event.head_commit.message == 'chore(actions): purge legacy workflow runs'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Delete runs from deleted one-shot workflows
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          gh api --paginate \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" \
            --jq '.workflow_runs[] | select(.path != ".github/workflows/ci.yml" and .path != ".github/workflows/preview.yml" and .path != ".github/workflows/release.yml") | .id' \
            | sort -u > "$tmp"

          count="$(wc -l < "$tmp" | tr -d ' ')"
          echo "Deleting $count legacy workflow runs"
          if [ "$count" -eq 0 ]; then
            exit 0
          fi

          export GITHUB_REPOSITORY
          xargs -r -n1 -P8 -I{} bash -c '
            gh api --method DELETE \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "repos/${GITHUB_REPOSITORY}/actions/runs/{}"
          ' < "$tmp"

  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Install dependencies and generate sources
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        # Existing warnings and infos remain visible in the log, but only
        # analyzer errors block this first enforcement step. Warnings can be
        # reduced safely in dedicated cleanup PRs rather than masking real
        # build/test regressions behind a large baseline migration.
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Test
        # A mock Firestore client test exercises the configured REST path. This
        # harmless value satisfies its build-time configuration guard; it is
        # never sent to an external service by the test suite.
        run: flutter test --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key

  native-log-typecheck:
    name: Typecheck native download logger
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Typecheck the production Foundation logger
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          source = Path('ios/Runner/DownloadNativeWaitingQueue.swift').read_text()
          logger = source[source.index('enum DownloadNativeDiagnosticLog'):source.index('import ObjectiveC')]
          stub = 'enum DownloadNativeWaitingQueue { static func taskId(from task: URLSessionTask) -> String? { nil } }'
          Path('/tmp/download-log.swift').write_text('import Foundation\n' + logger + stub)
          PYCODE
          swiftc -typecheck /tmp/download-log.swift
