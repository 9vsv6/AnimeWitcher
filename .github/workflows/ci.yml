name: Flutter Checks

on:
  pull_request:
    branches: [main, feat/manga-manhwa]
  push:
    branches: [main, fix/download-manager-performance-v2]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Install dependencies and generate sources
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        # Existing warnings and infos remain visible in the log, but only
        # analyzer errors block this first enforcement step. Warnings can be
        # reduced safely in dedicated cleanup PRs rather than masking real
        # build/test regressions behind a large baseline migration.
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Focused V2 tests
        # Keep the V2 architecture/reliability gate visible independently from
        # the repository-wide baseline so a known unrelated suite failure can
        # never hide a new download-manager regression.
        run: flutter test test/core/services/download_v2

      - name: Test
        # A mock Firestore client test exercises the configured REST path. This
        # harmless value satisfies its build-time configuration guard; it is
        # never sent to an external service by the test suite.
        run: flutter test --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key

  ios-v2-build:
    name: Build iOS V2 and retain log
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Install dependencies and generate sources
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Build iOS without code signing
        shell: bash
        run: |
          set -o pipefail
          flutter build ios --debug --no-codesign \
            --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key \
            2>&1 | tee ios-v2-build.log

      - name: Upload iOS build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-v2-build-log-${{ github.run_attempt }}
          path: ios-v2-build.log
          if-no-files-found: warn
          retention-days: 14

  native-log-typecheck:
    name: Typecheck native download logger
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Typecheck the production Foundation logger
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          source = Path('ios/Runner/DownloadNativeWaitingQueue.swift').read_text()
          logger = source[source.index('enum DownloadNativeDiagnosticLog'):source.index('import ObjectiveC')]
          stub = 'enum DownloadNativeWaitingQueue { static func taskId(from task: URLSessionTask) -> String? { nil } }'
          Path('/tmp/download-log.swift').write_text('import Foundation\n' + logger + stub)
          PYCODE
          swiftc -typecheck /tmp/download-log.swift



  api-lookup-benchmark:
    name: API lookup benchmark
    runs-on: ubuntu-latest
    env:
      SIMKL_API_KEY: ${{ secrets.SIMKL_API_KEY }}
    steps:
      - name: Compare AniList and Simkl external-ID latency
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SIMKL_API_KEY:-}" ]; then
            echo "SIMKL_API_KEY is not available to this workflow."
            exit 1
          fi
          python3 - <<'PYCODE'
          import json
          import os
          import re
          import statistics
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          KEY = os.environ["SIMKL_API_KEY"]
          SAMPLES = 3
          TITLES = [
              ("Attack on Titan", 16498),
              ("Sword Art Online", 11757),
              ("Re:ZERO", 31240),
              ("Mushoku Tensei", 39535),
              ("That Time I Got Reincarnated as a Slime", 37430),
          ]

          QUERY = """
          query ($malId: Int) {
            Media(idMal: $malId, type: ANIME) {
              id
              idMal
              format
              title { romaji english native }
              synonyms
              startDate { year }
              coverImage { extraLarge large medium }
              relations {
                edges {
                  relationType
                  node {
                    id
                    idMal
                    format
                    title { romaji english native }
                    synonyms
                    startDate { year }
                    coverImage { extraLarge large medium }
                  }
                }
              }
            }
          }
          """

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          no_redirect = urllib.request.build_opener(NoRedirect)

          def request(req, opener=urllib.request.urlopen):
              t0 = time.perf_counter()
              try:
                  with opener(req, timeout=20) as r:
                      payload = r.read()
                      status = r.status
                      headers = r.headers
              except urllib.error.HTTPError as exc:
                  if exc.code not in (301, 302, 303, 307, 308):
                      raise
                  payload = exc.read()
                  status = exc.code
                  headers = exc.headers
              return (time.perf_counter() - t0) * 1000, status, payload, headers

          def anilist(mal_id):
              req = urllib.request.Request(
                  "https://graphql.anilist.co",
                  data=json.dumps({
                      "query": QUERY,
                      "variables": {"malId": mal_id},
                  }).encode(),
                  method="POST",
                  headers={
                      "Content-Type": "application/json",
                      "Accept": "application/json",
                      "User-Agent": "animewitcher-benchmark/1.0",
                  },
              )
              ms, status, payload, _ = request(req)
              if status != 200:
                  raise RuntimeError(f"AniList HTTP {status}")
              media = json.loads(payload)["data"]["Media"]
              return ms, int(media["id"]), len(payload)

          def simkl_redirect(param, value):
              qs = urllib.parse.urlencode({
                  "to": "simkl",
                  param: value,
                  "client_id": KEY,
                  "app-name": "animewitcher-benchmark",
                  "app-version": "1.0",
              })
              req = urllib.request.Request(
                  "https://api.simkl.com/redirect?" + qs,
                  headers={
                      "User-Agent": "animewitcher-benchmark/1.0",
                      "Accept": "*/*",
                  },
              )
              ms, status, payload, headers = request(req, no_redirect.open)
              if status not in (301, 302):
                  raise RuntimeError(f"Simkl redirect HTTP {status} for {param}")
              location = headers.get("Location", "")
              match = re.search(r"/(?:anime|tv|movies)/(\d+)(?:/|$)", location)
              if not match:
                  raise RuntimeError(f"No Simkl id in redirect for {param}={value}: {location}")
              return ms, int(match.group(1)), len(payload)

          def simkl_detail(simkl_id):
              qs = urllib.parse.urlencode({
                  "client_id": KEY,
                  "app-name": "animewitcher-benchmark",
                  "app-version": "1.0",
              })
              req = urllib.request.Request(
                  f"https://api.simkl.com/anime/{simkl_id}?" + qs,
                  headers={
                      "Accept": "application/json",
                      "User-Agent": "animewitcher-benchmark/1.0",
                  },
              )
              ms, status, payload, _ = request(req)
              if status != 200:
                  raise RuntimeError(f"Simkl detail HTTP {status}")
              data = json.loads(payload)
              if int(data["ids"]["simkl"]) != simkl_id:
                  raise RuntimeError("Simkl detail id mismatch")
              return ms, len(payload)

          rows = []
          for round_no in range(1, SAMPLES + 1):
              for title, mal_id in TITLES:
                  ani_ms, anilist_id, ani_bytes = anilist(mal_id)
                  time.sleep(2.1)

                  mal_redirect_ms, simkl_mal, _ = simkl_redirect("mal", mal_id)
                  time.sleep(0.12)
                  anilist_redirect_ms, simkl_anilist, _ = simkl_redirect("anilist", anilist_id)
                  time.sleep(0.12)

                  if simkl_mal != simkl_anilist:
                      raise RuntimeError(
                          f"Simkl id mismatch for {title}: MAL={simkl_mal}, AniList={simkl_anilist}"
                      )

                  detail_ms, detail_bytes = simkl_detail(simkl_mal)
                  time.sleep(0.12)

                  row = {
                      "round": round_no,
                      "title": title,
                      "mal_id": mal_id,
                      "anilist_id": anilist_id,
                      "simkl_id": simkl_mal,
                      "anilist_ms": round(ani_ms, 2),
                      "simkl_mal_redirect_ms": round(mal_redirect_ms, 2),
                      "simkl_anilist_redirect_ms": round(anilist_redirect_ms, 2),
                      "simkl_detail_ms": round(detail_ms, 2),
                      "simkl_mal_to_detail_ms": round(mal_redirect_ms + detail_ms, 2),
                      "simkl_anilist_to_detail_ms": round(anilist_redirect_ms + detail_ms, 2),
                      "anilist_bytes": ani_bytes,
                      "simkl_detail_bytes": detail_bytes,
                  }
                  rows.append(row)
                  print("SAMPLE " + json.dumps(row, ensure_ascii=False), flush=True)

          def summary(key):
              values = sorted(float(r[key]) for r in rows)
              rank = min(len(values) - 1, max(0, int(0.95 * len(values) + 0.999999) - 1))
              return {
                  "n": len(values),
                  "mean_ms": round(statistics.fmean(values), 2),
                  "p50_ms": round(statistics.median(values), 2),
                  "p95_ms": round(values[rank], 2),
                  "min_ms": round(values[0], 2),
                  "max_ms": round(values[-1], 2),
              }

          result = {
              "anilist_one_request": summary("anilist_ms"),
              "simkl_redirect_by_mal_only": summary("simkl_mal_redirect_ms"),
              "simkl_redirect_by_anilist_only": summary("simkl_anilist_redirect_ms"),
              "simkl_detail_with_cached_simkl_id": summary("simkl_detail_ms"),
              "simkl_mal_to_detail_two_requests": summary("simkl_mal_to_detail_ms"),
              "simkl_anilist_to_detail_two_requests": summary("simkl_anilist_to_detail_ms"),
              "sample_count": len(rows),
          }
          print("BENCHMARK_RESULT " + json.dumps(result, ensure_ascii=False), flush=True)
          PYCODE
