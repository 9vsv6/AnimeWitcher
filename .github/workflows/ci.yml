name: Flutter Checks

on:
  pull_request:
    branches: [main, feat/manga-manhwa]
  push:
    branches: [main, fix/download-manager-performance-v2]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Install dependencies and generate sources
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        # Existing warnings and infos remain visible in the log, but only
        # analyzer errors block this first enforcement step. Warnings can be
        # reduced safely in dedicated cleanup PRs rather than masking real
        # build/test regressions behind a large baseline migration.
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Focused V2 tests
        # Keep the V2 architecture/reliability gate visible independently from
        # the repository-wide baseline so a known unrelated suite failure can
        # never hide a new download-manager regression.
        run: flutter test test/core/services/download_v2

      - name: Test
        # A mock Firestore client test exercises the configured REST path. This
        # harmless value satisfies its build-time configuration guard; it is
        # never sent to an external service by the test suite.
        run: flutter test --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key

  ios-v2-build:
    name: Build iOS V2 and retain log
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Install dependencies and generate sources
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Build iOS without code signing
        shell: bash
        run: |
          set -o pipefail
          flutter build ios --debug --no-codesign \
            --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key \
            2>&1 | tee ios-v2-build.log

      - name: Upload iOS build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-v2-build-log-${{ github.run_attempt }}
          path: ios-v2-build.log
          if-no-files-found: warn
          retention-days: 14

  native-log-typecheck:
    name: Typecheck native download logger
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Typecheck the production Foundation logger
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          source = Path('ios/Runner/DownloadNativeWaitingQueue.swift').read_text()
          logger = source[source.index('enum DownloadNativeDiagnosticLog'):source.index('import ObjectiveC')]
          stub = 'enum DownloadNativeWaitingQueue { static func taskId(from task: URLSessionTask) -> String? { nil } }'
          Path('/tmp/download-log.swift').write_text('import Foundation\n' + logger + stub)
          PYCODE
          swiftc -typecheck /tmp/download-log.swift


  anizip-franchise-probe:
    name: AniList + AniZip franchise probe
    runs-on: ubuntu-latest
    steps:
      - name: Compare franchise graph and AniZip season metadata
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import collections
          import concurrent.futures
          import json
          import re
          import statistics
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          ROOTS = [
              ("Attack on Titan", 16498),
              ("Re:ZERO", 31240),
              ("Mushoku Tensei", 39535),
              ("Slime", 37430),
              ("Sword Art Online", 11757),
              ("Monogatari (Bakemonogatari)", 5081),
              ("JoJo's Bizarre Adventure", 14719),
          ]
          FOLLOW = {"PREQUEL", "SEQUEL", "PARENT", "SIDE_STORY", "SPIN_OFF"}
          MAX_NODES = 40
          BATCH = 8
          UA = "animewitcher-anizip-probe/1.0"

          def http_json(req, timeout=20):
              started=time.perf_counter()
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  payload=r.read()
                  status=r.status
              return json.loads(payload), (time.perf_counter()-started)*1000, status, len(payload)

          def gql(query, variables):
              req=urllib.request.Request(
                  "https://graphql.anilist.co",
                  data=json.dumps({"query":query,"variables":variables}).encode(),
                  method="POST",
                  headers={"Content-Type":"application/json","Accept":"application/json","User-Agent":UA},
              )
              data,ms,status,n=http_json(req)
              if status != 200 or data.get("errors"):
                  raise RuntimeError(f"AniList error: {data.get('errors') or status}")
              return data["data"], ms, n

          FIELDS = """
            id idMal format episodes
            title { romaji english native }
            synonyms
            startDate { year }
            relations {
              edges {
                relationType
                node {
                  id idMal format episodes
                  title { romaji english native }
                  synonyms
                  startDate { year }
                }
              }
            }
          """

          def title_of(m):
              t=m.get("title") or {}
              vals=[t.get("english"),t.get("romaji"),t.get("native")]
              return next((x for x in vals if isinstance(x,str) and x.strip()), f"AniList {m.get('id')}")

          def normalize(m):
              return {
                  "id": int(m["id"]),
                  "mal": m.get("idMal"),
                  "format": m.get("format"),
                  "episodes": m.get("episodes"),
                  "title": title_of(m),
                  "year": (m.get("startDate") or {}).get("year"),
                  "relations": [
                      {
                          "type": e.get("relationType"),
                          "id": (e.get("node") or {}).get("id"),
                          "mal": (e.get("node") or {}).get("idMal"),
                          "format": (e.get("node") or {}).get("format"),
                          "title": title_of(e.get("node") or {}),
                      }
                      for e in ((m.get("relations") or {}).get("edges") or [])
                      if (e.get("node") or {}).get("id")
                  ],
              }

          def fetch_graph(mal):
              q=f"query($mal:Int){{ Media(idMal:$mal,type:ANIME){{ {FIELDS} }} }}"
              data,ms,n=gql(q,{"mal":mal})
              root=data.get("Media")
              if not root:
                  return {},0,ms,0
              root=normalize(root)
              nodes={root["id"]:root}
              queue=[]
              for rel in root["relations"]:
                  if rel["type"] in FOLLOW and rel["id"] not in nodes:
                      queue.append(rel["id"])
              reqs=1
              bytes_=n
              total_ms=ms

              while queue and len(nodes)<MAX_NODES:
                  batch=[]
                  while queue and len(batch)<BATCH:
                      x=queue.pop(0)
                      if x not in nodes and x not in batch:
                          batch.append(x)
                  if not batch: continue
                  var_defs=",".join(f"$i{k}:Int!" for k in range(len(batch)))
                  aliases=" ".join(f"m{k}:Media(id:$i{k},type:ANIME){{ {FIELDS} }}" for k in range(len(batch)))
                  q=f"query({var_defs}){{ {aliases} }}"
                  vars={f"i{k}":v for k,v in enumerate(batch)}
                  data,ms,n=gql(q,vars)
                  reqs+=1; bytes_+=n; total_ms+=ms
                  for k in range(len(batch)):
                      raw=data.get(f"m{k}")
                      if not raw: continue
                      node=normalize(raw)
                      nodes[node["id"]]=node
                      for rel in node["relations"]:
                          if rel["type"] in FOLLOW and rel["id"] not in nodes and rel["id"] not in queue:
                              queue.append(rel["id"])
                  time.sleep(0.15)
              return nodes,reqs,total_ms,bytes_

          def anizip_one(anilist_id):
              url="https://hayase.ani.zip/v1/episodes?"+urllib.parse.urlencode({"anilist_id":anilist_id})
              req=urllib.request.Request(url,headers={"Accept":"application/json","User-Agent":UA})
              started=time.perf_counter()
              try:
                  with urllib.request.urlopen(req,timeout=20) as r:
                      payload=r.read()
                      status=r.status
                  ms=(time.perf_counter()-started)*1000
                  data=json.loads(payload)
              except Exception as exc:
                  return {"id":anilist_id,"ok":False,"error":f"{type(exc).__name__}: {exc}","ms":(time.perf_counter()-started)*1000}

              eps=data.get("episodes")
              values=list(eps.values()) if isinstance(eps,dict) else []
              seasons=[]
              epnums=[]
              absolute=[]
              for ep in values:
                  if not isinstance(ep,dict): continue
                  s=ep.get("seasonNumber")
                  e=ep.get("episodeNumber")
                  a=ep.get("absoluteEpisodeNumber")
                  if isinstance(s,int): seasons.append(s)
                  if isinstance(e,int): epnums.append(e)
                  if isinstance(a,int): absolute.append(a)
              positive=[x for x in seasons if x>0]
              primary=None
              if positive:
                  primary=collections.Counter(positive).most_common(1)[0][0]
              return {
                  "id":anilist_id,
                  "ok":True,
                  "ms":ms,
                  "bytes":len(payload),
                  "episodeCount":data.get("episodeCount"),
                  "specialCount":data.get("specialCount"),
                  "seasonNumbers":sorted(set(positive)),
                  "primarySeason":primary,
                  "minEpisode":min(epnums) if epnums else None,
                  "maxEpisode":max(epnums) if epnums else None,
                  "minAbsolute":min(absolute) if absolute else None,
                  "maxAbsolute":max(absolute) if absolute else None,
                  "mapping":data.get("mappings") or {},
              }

          explicit_season=re.compile(r"(?:\bseason\s*(\d+)|\b(\d+)(?:st|nd|rd|th)\s+season)",re.I)
          part_marker=re.compile(r"(?:\bpart\s*(\d+)|\bcour\s*(\d+))",re.I)

          def explicit_number(title):
              m=explicit_season.search(title)
              if not m:return None
              return int(next(x for x in m.groups() if x))

          all_results=[]
          for name,mal in ROOTS:
              wall0=time.perf_counter()
              nodes,ani_reqs,ani_sum_ms,ani_bytes=fetch_graph(mal)
              graph_wall=(time.perf_counter()-wall0)*1000

              tv=[n for n in nodes.values() if n["format"] in ("TV","TV_SHORT")]
              az0=time.perf_counter()
              with concurrent.futures.ThreadPoolExecutor(max_workers=8) as ex:
                  az_list=list(ex.map(lambda n: anizip_one(n["id"]), tv))
              az_wall=(time.perf_counter()-az0)*1000
              az={x["id"]:x for x in az_list}

              ok=[x for x in az_list if x["ok"]]
              season_ok=[x for x in ok if x.get("primarySeason") is not None]
              explicit_checks=[]
              for n in tv:
                  exp=explicit_number(n["title"])
                  got=az.get(n["id"],{}).get("primarySeason")
                  if exp is not None and got is not None:
                      explicit_checks.append((exp,got,n["title"]))

              print("FRANCHISE "+json.dumps({
                  "name":name,
                  "rootMal":mal,
                  "graphNodes":len(nodes),
                  "tvNodes":len(tv),
                  "aniListRequests":ani_reqs,
                  "aniListRequestSumMs":round(ani_sum_ms,2),
                  "aniListWallMs":round(graph_wall,2),
                  "aniListBytes":ani_bytes,
                  "aniZipRequests":len(tv),
                  "aniZipSuccess":len(ok),
                  "aniZipSeasonCoverage":round(len(season_ok)/len(tv),3) if tv else 1,
                  "aniZipWallMs":round(az_wall,2),
                  "aniZipMeanRequestMs":round(statistics.fmean(x["ms"] for x in ok),2) if ok else None,
                  "hybridWallMs":round(graph_wall+az_wall,2),
                  "explicitSeasonChecks":len(explicit_checks),
                  "explicitSeasonMatches":sum(a==b for a,b,_ in explicit_checks),
              },ensure_ascii=False),flush=True)

              for n in sorted(tv,key=lambda x:((x["year"] or 9999),x["title"])):
                  a=az.get(n["id"],{})
                  print("NODE "+json.dumps({
                      "franchise":name,
                      "anilist":n["id"],
                      "mal":n["mal"],
                      "year":n["year"],
                      "format":n["format"],
                      "title":n["title"],
                      "titleSeason":explicit_number(n["title"]),
                      "titlePart": next((int(x) for x in (part_marker.search(n["title"]).groups() if part_marker.search(n["title"]) else []) if x),None),
                      "aniZipOk":a.get("ok"),
                      "season":a.get("primarySeason"),
                      "seasonNumbers":a.get("seasonNumbers"),
                      "firstTvdbEpisode":a.get("minEpisode"),
                      "lastTvdbEpisode":a.get("maxEpisode"),
                      "episodeCount":a.get("episodeCount"),
                      "error":a.get("error"),
                  },ensure_ascii=False),flush=True)

              all_results.append({
                  "name":name,"nodes":len(nodes),"tv":len(tv),
                  "ani":graph_wall,"az":az_wall,
                  "coverage":len(season_ok)/len(tv) if tv else 1,
                  "checks":len(explicit_checks),
                  "matches":sum(a==b for a,b,_ in explicit_checks),
              })

          print("SUMMARY "+json.dumps({
              "franchises":len(all_results),
              "totalTvNodes":sum(x["tv"] for x in all_results),
              "meanAniListGraphWallMs":round(statistics.fmean(x["ani"] for x in all_results),2),
              "meanAniZipEnrichmentWallMs":round(statistics.fmean(x["az"] for x in all_results),2),
              "meanHybridWallMs":round(statistics.fmean(x["ani"]+x["az"] for x in all_results),2),
              "seasonCoverage":round(sum(x["coverage"]*x["tv"] for x in all_results)/sum(x["tv"] for x in all_results),3),
              "explicitChecks":sum(x["checks"] for x in all_results),
              "explicitMatches":sum(x["matches"] for x in all_results),
          },ensure_ascii=False),flush=True)
          PYCODE
