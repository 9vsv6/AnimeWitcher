name: Flutter Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - name: Purge all obsolete workflow run history
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ids="$(gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" --jq '.workflow_runs[] | select(.name != "Flutter Checks" and .name != "Build Preview" and .name != "Build & Release") | .id')"
          if [ -z "$ids" ]; then
            echo "No obsolete workflow runs found."
          else
            total="$(printf '%s\n' "$ids" | sed '/^$/d' | wc -l | tr -d ' ')"
            echo "Deleting $total obsolete workflow runs across the full Actions history."
            deleted=0
            for id in $ids; do
              gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/actions/runs/${id}"
              deleted=$((deleted + 1))
              if (( deleted % 25 == 0 )); then
                echo "Deleted $deleted/$total obsolete runs..."
              fi
            done
            echo "Deleted $deleted obsolete workflow runs."
          fi

          remaining="$(gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" --jq '.workflow_runs[] | select(.name != "Flutter Checks" and .name != "Build Preview" and .name != "Build & Release") | .id' | head -n 1)"
          if [ -n "$remaining" ]; then
            echo "Obsolete workflow history still remains after cleanup." >&2
            exit 1
          fi
          echo "Verified: only the three essential workflow names remain in Actions run history."

      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Install dependencies and generate sources
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Test
        run: flutter test --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key
