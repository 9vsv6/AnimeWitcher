name: Flutter Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - name: Remove obsolete workflow run history
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          while true; do
            ids="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" --jq '.workflow_runs[] | select(.name != "Flutter Checks" and .name != "Build Preview" and .name != "Build & Release") | .id')"
            if [ -z "$ids" ]; then
              echo "No obsolete workflow runs remain."
              break
            fi
            count=0
            for id in $ids; do
              echo "Deleting obsolete workflow run $id"
              gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/actions/runs/${id}"
              count=$((count + 1))
            done
            echo "Deleted $count obsolete runs from this page."
          done

      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Install dependencies and generate sources
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        # Existing warnings and infos remain visible in the log, but only
        # analyzer errors block this first enforcement step. Warnings can be
        # reduced safely in dedicated cleanup PRs rather than masking real
        # build/test regressions behind a large baseline migration.
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Test
        # A mock Firestore client test exercises the configured REST path. This
        # harmless value satisfies its build-time configuration guard; it is
        # never sent to an external service by the test suite.
        run: flutter test --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key
