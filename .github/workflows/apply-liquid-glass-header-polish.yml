name: Apply Liquid Glass header polish

'on':
  push:
    branches:
      - fix/liquid-glass-header-motion-alignment

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply reviewed source edits
        run: python3 tools/apply_liquid_glass_header_polish.py
      - name: Commit source edits
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No source edits needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/comments/presentation/animewitcher_my_comments_screen.dart lib/shared/widgets/apple_liquid_glass.dart ios/Runner/AppDelegate.swift
          git commit -m "feat: polish persistent Liquid Glass header [liquid-glass-applied]"
          git push origin HEAD:fix/liquid-glass-header-motion-alignment
