name: Patch Download Telemetry Review

on:
  push:
    branches:
      - fix/download-telemetry-and-reliability-review

permissions:
  contents: write

concurrency:
  group: patch-download-telemetry-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Apply reviewed telemetry patch
        run: |
          # A few pre-existing helper snippets intentionally occur in both the
          # pause and recovery paths. Each staged replacement still changes only
          # the first intended occurrence, but does not reject the file merely
          # because another identical block exists later in DownloadService.
          sed -i 's/if count != 1:/if count < 1:/' tool/patch_download_telemetry_review.py
          python3 tool/patch_download_telemetry_review.py

      - name: Format changed Dart files
        run: |
          dart format \
            lib/core/services/download_telemetry.dart \
            lib/core/services/download_continued_processing_service.dart \
            lib/core/services/download_service.dart \
            lib/core/utils/download_time_remaining.dart \
            test/core/services/download_telemetry_test.dart \
            test/core/services/download_single_connection_telemetry_usage_test.dart

      - name: Install dependencies and generate sources
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Test telemetry and responsiveness coverage
        run: |
          flutter test \
            test/core/services/download_telemetry_test.dart \
            test/core/services/download_single_connection_telemetry_usage_test.dart \
            test/core/services/download_ui_responsiveness_test.dart \
            --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key

      - name: Test full suite
        run: flutter test --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key

      - name: Commit verified fix and remove staging files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f tool/patch_download_telemetry_review.py .github/workflows/patch-download-telemetry-review.yml
          git add \
            lib/core/services/download_telemetry.dart \
            lib/core/services/download_continued_processing_service.dart \
            lib/core/services/download_service.dart \
            lib/core/utils/download_time_remaining.dart \
            ios/Runner/AppDelegate.swift \
            ios/Runner/DownloadNativeWaitingQueue.swift \
            test/core/services/download_telemetry_test.dart \
            test/core/services/download_single_connection_telemetry_usage_test.dart
          if ! git diff --cached --quiet; then
            git commit -m "Fix single-download telemetry and stabilize throughput"
            git push
          fi
