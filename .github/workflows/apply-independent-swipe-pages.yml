name: Apply independent swipe pages
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-independent-swipe-pages.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve each swipe page independently
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('lib/features/more/presentation/seasons_screen.dart')
          t = p.read_text(encoding='utf-8')

          old = 'class _SeasonGridState extends State<_SeasonGrid> {'
          new = '''class _SeasonGridState extends State<_SeasonGrid>
              with AutomaticKeepAliveClientMixin<_SeasonGrid> {'''
          if old in t:
              t = t.replace(old, new, 1)

          build_old = '''  @override
            Widget build(BuildContext context) {
              if (_items.isEmpty && _loading) {'''
          build_new = '''  @override
            Widget build(BuildContext context) {
              super.build(context);
              if (_items.isEmpty && _loading) {'''
          if build_old in t:
              t = t.replace(build_old, build_new, 1)
          else:
              build_old = '''  @override
          Widget build(BuildContext context) {
            if (_items.isEmpty && _loading) {'''
              build_new = '''  @override
          Widget build(BuildContext context) {
            super.build(context);
            if (_items.isEmpty && _loading) {'''
              if build_old in t:
                  t = t.replace(build_old, build_new, 1)

          marker = '''class _SeasonGridState extends State<_SeasonGrid>
              with AutomaticKeepAliveClientMixin<_SeasonGrid> {'''
          if marker in t and 'bool get wantKeepAlive => true;' not in t[t.index(marker):t.index(marker)+800]:
              insert_at = t.index('\n', t.index(marker)) + 1
              t = t[:insert_at] + '''  @override
            bool get wantKeepAlive => true;

          ''' + t[insert_at:]

          other = '    return ListView.separated(\n      padding: const EdgeInsets.only(bottom: 110),'
          if other in t and "PageStorageKey<String>('other-seasons')" not in t:
              t = t.replace(other, "    return ListView.separated(\n      key: const PageStorageKey<String>('other-seasons'),\n      padding: const EdgeInsets.only(bottom: 110),", 1)

          p.write_text(t, encoding='utf-8')

          # Schedule grids already use a per-day PageStorageKey, so each day
          # keeps its own vertical scroll position while the PageView swipes.
          s = Path('lib/features/more/presentation/broadcast_schedule_screen.dart').read_text(encoding='utf-8')
          if "PageStorageKey<String>('broadcast-$day')" not in s:
              raise SystemExit('broadcast day PageStorageKey missing')

          if 'AutomaticKeepAliveClientMixin<_SeasonGrid>' not in t:
              raise SystemExit('season keep-alive patch missing')
          if 'super.build(context);' not in t[t.index('class _SeasonGridState'):]:
              raise SystemExit('season keep-alive build hook missing')
          PY
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/apply-independent-swipe-pages.yml
          git add lib/features/more/presentation/seasons_screen.dart .github/workflows/apply-independent-swipe-pages.yml
          git diff --cached --quiet && exit 0
          git commit -m "Keep swipe lists independent"
          git push origin main
