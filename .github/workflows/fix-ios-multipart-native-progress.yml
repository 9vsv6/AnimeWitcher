name: Fix iOS Multipart Native Progress

on:
  push:
    branches: [fix/ios-multipart-native-progress]

permissions:
  contents: write

concurrency:
  group: fix-ios-multipart-native-progress
  cancel-in-progress: true

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Apply native progress and pause fix
        run: python3 tool/fix_ios_multipart_native_progress.py

      - name: Format Dart changes
        run: |
          dart format \
            lib/core/services/persistent_parallel_download.dart \
            lib/core/services/download_service.dart \
            lib/core/services/download_continued_processing_service.dart \
            test/core/services/persistent_parallel_download_test.dart \
            test/core/services/ios_multipart_native_bridge_source_test.dart

      - name: Install dependencies and generate sources
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Test
        run: flutter test --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key

      - name: Commit verified fix and remove staging files
        if: success()
        run: |
          rm -f tool/fix_ios_multipart_native_progress.py
          rm -f .github/workflows/fix-ios-multipart-native-progress.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix iOS multipart native progress and pause"
          git push
