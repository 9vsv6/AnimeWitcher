      - name: Format changed Dart files
        run: |
          dart format             lib/core/extensions/base_provider.dart             lib/core/extensions/providers/js_based_provider.dart             lib/features/details/presentation/details_controller.dart             lib/features/details/presentation/details_screen.dart             lib/features/details/presentation/widgets/anime_information_section.dart

      - name: Regenerate localization and Riverpod files
        run: |
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Verify patch markers
        shell: bash
        run: |
          set -euo pipefail
          grep -F "Future<List<Episode>> getEpisodes"             lib/core/extensions/base_provider.dart
          grep -F "_fn('loadDetails')"             lib/core/extensions/providers/js_based_provider.dart
          grep -F "_fn('loadEpisodes')"             lib/core/extensions/providers/js_based_provider.dart
          grep -F "final AsyncValue<List<Episode>> episodes"             lib/features/details/presentation/details_controller.dart
          grep -F "AnimeInformationSection"             lib/features/details/presentation/details_screen.dart

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test

      - name: Check generated diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --stat
          git diff > /tmp/split-details-episodes.patch

      - name: Upload patch artifact
        uses: actions/upload-artifact@v4
        with:
          name: split-details-episodes-patch
          path: /tmp/split-details-episodes.patch
          if-no-files-found: error
          retention-days: 14

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add             lib/core/extensions/base_provider.dart             lib/core/extensions/providers/js_based_provider.dart             lib/features/details/presentation/details_controller.dart             lib/features/details/presentation/details_screen.dart             lib/features/details/presentation/widgets/anime_information_section.dart             lib/l10n

          # Generated Riverpod files may be ignored by a broad *.g.dart rule.
          git add -f             lib/features/details/presentation/details_controller.g.dart             2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No changes to commit. The patch may already be applied."
            exit 0
          fi

          git commit -m "feat: split anime details and episode loading"
          git push origin HEAD:main

      - name: Write summary
        if: always()
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## Split details / episodes

          - Details and episodes now have independent loading states.
          - JavaScript extensions can export `loadDetails` and `loadEpisodes`.
          - Legacy extensions continue using the old `load` export.
          - Anime details and AnimeWitcher metadata render before episodes finish.
          - Episodes continue loading in the background with retry support.
          - Mobile and desktop details screens have separate Details/Episodes tabs.
          SUMMARY
