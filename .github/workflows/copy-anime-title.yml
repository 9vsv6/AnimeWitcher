name: Copy anime title on long press

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Apply title copy feature
        shell: bash
        run: |
          echo '' | base64 --decode > /tmp/copy_anime_title_patch.py
          python3 /tmp/copy_anime_title_patch.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format changed files
        run: |
          dart format \
            lib/features/details/presentation/details_screen.dart \
            lib/features/details/presentation/widgets/details_desktop_hero.dart

      - name: Analyze changed files
        run: |
          flutter analyze \
            lib/features/details/presentation/details_screen.dart \
            lib/features/details/presentation/widgets/details_desktop_hero.dart

      - name: Verify diff
        run: git diff --check

      - name: Commit feature and remove workflow
        shell: bash
        run: |
          rm -f .github/workflows/copy-anime-title.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            lib/features/details/presentation/details_screen.dart \
            lib/features/details/presentation/widgets/details_desktop_hero.dart \
            .github/workflows/copy-anime-title.yml

          git commit -m "Copy anime title on long press"
          git push origin HEAD:main
