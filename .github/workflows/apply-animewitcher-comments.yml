name: Apply AnimeWitcher comments

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-animewitcher-comments.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply comments patch
        env:
          DIFF_B64: ""
          NEW_FILES_B64: ""
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import subprocess
          import zlib
          from pathlib import Path

          diff = zlib.decompress(base64.b64decode(os.environ['DIFF_B64'])).decode('utf-8')
          patch = Path('/tmp/animewitcher-comments.patch')
          patch.write_text(diff, encoding='utf-8')
          subprocess.run(['git', 'apply', '--index', str(patch)], check=True)

          new_files = json.loads(
              zlib.decompress(base64.b64decode(os.environ['NEW_FILES_B64'])).decode('utf-8')
          )
          for raw_path, content in new_files.items():
              path = Path(raw_path)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(content, encoding='utf-8')
              subprocess.run(['git', 'add', raw_path], check=True)

          workflow = Path('.github/workflows/apply-animewitcher-comments.yml')
          workflow.unlink(missing_ok=True)
          subprocess.run(['git', 'add', '-A'], check=True)
          PY
      - name: Commit comments feature
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add AnimeWitcher comments"
          git push origin main
