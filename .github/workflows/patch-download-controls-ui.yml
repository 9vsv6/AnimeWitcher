name: Patch Download Controls UI

on:
  push:
    branches:
      - fix/download-controls-and-ui-throttle

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Apply patch
        run: python3 tool/patch_download_controls_ui.py

      - name: Format changed Dart files
        run: |
          dart format lib/core/services/download_service.dart
          dart format lib/features/library/presentation/downloads_provider.dart
          dart format test/core/services/download_ui_responsiveness_test.dart

      - name: Install dependencies and generate sources
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Test focused responsiveness coverage
        run: flutter test test/core/services/download_ui_responsiveness_test.dart --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key

      - name: Test full suite
        run: flutter test --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key

      - name: Commit verified fix and remove staging files
        shell: bash
        run: |
          rm -f tool/patch_download_controls_ui.py
          rm -f .github/workflows/patch-download-controls-ui.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Make download controls immediate and sample UI metrics"
          git push origin HEAD:fix/download-controls-and-ui-throttle
