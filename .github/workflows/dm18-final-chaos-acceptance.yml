name: DM-18 final download-manager chaos acceptance

on:
  push:
    branches:
      - plan/download-manager-reliability
    paths:
      - .github/workflows/dm18-final-chaos-acceptance.yml
      - DOWNLOAD_MANAGER_PLAN.md
      - lib/core/services/download_*.dart
      - test/core/services/download_*.dart
      - test/core/services/persistent_parallel_download_*.dart
      - test/core/services/ios_*.dart
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dm18-final-chaos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dart-chaos:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: plan/download-manager-reliability
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Install locked dependencies and generate sources
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Verify generated sources are synchronized
        run: git diff --exit-code

      - name: Run deterministic download-manager chaos matrix
        run: >-
          flutter test
          test/core/services/download_manager_chaos_matrix_test.dart
          test/core/services/download_relaunch_chaos_test.dart
          test/core/services/download_startup_reconciliation_matrix_test.dart
          test/core/services/download_runtime_ownership_test.dart
          test/core/services/download_cancel_settlement_test.dart
          test/core/services/download_command_outcome_test.dart
          test/core/services/download_concurrency_test.dart
          test/core/services/download_parallel_test.dart
          test/core/services/download_range_transfer_test.dart
          test/core/services/download_transport_test.dart
          test/core/services/download_teardown_barrier_test.dart
          test/core/services/persistent_parallel_download_test.dart
          test/core/services/persistent_parallel_download_auto_recovery_test.dart
          test/core/services/persistent_parallel_download_fallback_test.dart
          test/core/services/persistent_parallel_download_tail_recovery_test.dart
          --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key

      - name: Analyze the final download-manager surfaces
        run: >-
          flutter analyze --no-fatal-warnings --no-fatal-infos
          lib/core/services/download_job_state.dart
          lib/core/services/download_job_store.dart
          lib/core/services/download_concurrency.dart
          lib/core/services/download_parallel.dart
          lib/core/services/download_range_transfer.dart
          lib/core/services/download_transport.dart
          lib/core/services/download_continued_processing_service.dart
          lib/core/services/download_service.dart
          test/core/services/download_manager_chaos_matrix_test.dart

      - name: Diff sanity
        run: git diff --check

  ios-chaos:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: plan/download-manager-reliability
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Install locked dependencies and generate sources
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Install CocoaPods and verify generated sources
        run: |
          cd ios
          pod install --repo-update
          cd ..
          git diff --exit-code

      - name: Select and boot an iOS simulator
        id: sim
        shell: bash
        run: |
          set -euo pipefail
          device_id="$(xcrun simctl list devices available -j | python3 -c '
          import json
          import sys
          data = json.load(sys.stdin)
          for runtime, devices in data.get("devices", {}).items():
              if "iOS" not in runtime:
                  continue
              for device in devices:
                  if device.get("isAvailable") and device.get("name", "").startswith("iPhone"):
                      print(device["udid"])
                      raise SystemExit(0)
          raise SystemExit("no available iPhone simulator")
          ')"
          echo "id=$device_id" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$device_id" || true
          xcrun simctl bootstatus "$device_id" -b

      - name: Build the iOS simulator target
        run: flutter build ios --simulator --no-codesign --debug --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key

      - name: Verify native handoff, hook migration, concurrency and teardown
        run: |
          xcodebuild test \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.id }}" \
            -parallel-testing-enabled NO \
            -only-testing:RunnerTests/RunnerTests/testDM26DelayedStatusCannotCompleteReusedTaskOrReleaseItsSlot \
            -only-testing:RunnerTests/RunnerTests/testDM26PluginFileMoveFailureCannotBecomeSuccess \
            -only-testing:RunnerTests/RunnerTests/testDM28PersistsRequestedLogicalConcurrencyThroughTen \
            CODE_SIGNING_ALLOWED=NO

      - name: Diff sanity
        run: git diff --check

  android-chaos:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          ref: plan/download-manager-reliability
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install locked dependencies and generate sources
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Run Android policy and chaos behavior tests
        run: >-
          flutter test
          test/core/services/download_manager_chaos_matrix_test.dart
          test/core/services/download_transport_test.dart
          test/core/services/download_runtime_ownership_test.dart
          test/core/services/download_cancel_settlement_test.dart
          --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key

      - name: Build Android debug app
        run: flutter build apk --debug --no-pub --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key

      - name: Verify Android 14 UIDT declarations survive manifest merge
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          ns = '{http://schemas.android.com/apk/res/android}'
          candidates = list(Path('build/app/intermediates').rglob('AndroidManifest.xml'))
          if not candidates:
              raise SystemExit('no merged AndroidManifest.xml produced')
          merged = max(candidates, key=lambda path: path.stat().st_size)
          root = ET.parse(merged).getroot()
          permissions = {
              element.attrib.get(ns + 'name', '')
              for element in root.findall('uses-permission')
          }
          services = [
              element.attrib.get(ns + 'name', '')
              for element in root.findall('./application/service')
          ]
          required = 'android.permission.RUN_USER_INITIATED_JOBS'
          if required not in permissions:
              raise SystemExit(f'missing {required}')
          uidt = [
              name for name in services
              if 'userinitiated' in name.lower() or 'uidt' in name.lower()
          ]
          if not uidt:
              raise SystemExit('UIDT service is missing from merged manifest')
          print('merged manifest:', merged)
          print('UIDT services:', uidt)
          PY

      - name: Diff sanity
        run: git diff --check
