name: Apply season year requirement

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-season-year-requirement.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Apply patch
        run: python .github/scripts/apply_season_year_requirement.py

      - name: Commit final source changes and remove one-off workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/home/presentation/widgets/provider_search_filter_dialog.dart
          git add lib/core/extensions/providers/animewitcher_native_provider.dart
          git rm .github/workflows/apply-season-year-requirement.yml
          git rm .github/scripts/apply_season_year_requirement.py
          git commit -m "Require year when filtering by season"
          git push origin main
