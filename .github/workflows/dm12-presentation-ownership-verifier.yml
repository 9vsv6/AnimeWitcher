name: DM-12 Presentation Ownership Verifier

on:
  push:
    branches: [plan/download-manager-reliability]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: plan/download-manager-reliability
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - name: Install dependencies and generate sources
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs
      - name: Apply DM-12 production fixes
        run: |
          python3 .github/scripts/dm12_presentation_ownership_patch.py
          python3 .github/scripts/dm12_snapshot_patch.py
          dart format lib/features/library/presentation/downloads_provider.dart lib/core/services/download_service.dart
      - name: Verify DM-12 ownership and adjacent lifecycle behavior
        run: >-
          flutter test
          test/core/services/download_presentation_ownership_test.dart
          test/core/services/download_delete_tombstone_guard_test.dart
          test/core/services/download_job_state_authority_test.dart
          test/core/services/download_logical_identity_test.dart
      - name: Analyze touched production boundary
        run: >-
          flutter analyze --no-fatal-warnings --no-fatal-infos
          lib/features/library/presentation/downloads_provider.dart
          lib/core/services/download_service.dart
      - name: Verify scoped production diff
        run: |
          files=(lib/features/library/presentation/downloads_provider.dart lib/core/services/download_service.dart)
          if ! git diff --quiet -- "${files[@]}"; then
            git diff --check -- "${files[@]}"
          fi
      - name: Commit green production fix when needed
        run: |
          files=(lib/features/library/presentation/downloads_provider.dart lib/core/services/download_service.dart)
          if git diff --quiet -- "${files[@]}"; then
            echo 'DM-12 production fix is already present on HEAD.'
            exit 0
          fi
          git fetch origin plan/download-manager-reliability
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/plan/download-manager-reliability)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${files[@]}"
          git commit -m "fix(downloads): project service-owned logical snapshots"
          git push origin HEAD:plan/download-manager-reliability
