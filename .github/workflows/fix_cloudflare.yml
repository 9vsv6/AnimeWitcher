name: Fix Animerco Browser Verification

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply patch
        shell: bash
        run: |
          echo '' | base64 --decode > /tmp/patch_animerco_cf.py
          python3 /tmp/patch_animerco_cf.py

      - name: Format changed file
        run: dart format lib/core/network/cloudflare_bypass.dart

      - name: Validate changed file
        shell: bash
        run: |
          grep -q "_looksLikeBrowserChallenge" lib/core/network/cloudflare_bypass.dart
          grep -q "checking your browser" lib/core/network/cloudflare_bypass.dart
          grep -q "code == 200" lib/core/network/cloudflare_bypass.dart
          flutter analyze lib/core/network/cloudflare_bypass.dart

      - name: Commit and push
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/core/network/cloudflare_bypass.dart
          git commit -m "Fix Animerco browser verification handling"
          git push
