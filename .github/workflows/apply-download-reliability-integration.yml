name: Apply download reliability integration

on:
  push:
    branches: [refactor/download-reliability-completion]

permissions:
  contents: write

concurrency:
  group: apply-download-reliability-integration
  cancel-in-progress: true

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/download-reliability-completion
          fetch-depth: 0

      - name: Apply guarded integration
        run: python3 tool/apply_download_reliability_integration.py

      - name: Commit reliability integration
        run: |
          if git diff --quiet -- lib/core/services/download_service.dart lib/core/services/persistent_parallel_download.dart; then
            echo "Expected reliability integration produced no diff" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+Fares669@users.noreply.github.com"
          git add lib/core/services/download_service.dart lib/core/services/persistent_parallel_download.dart
          git commit -m "Wire durable retry, host profiles and signed URL refresh"
          git push origin HEAD:refactor/download-reliability-completion
