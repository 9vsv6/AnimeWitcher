name: Apply single episode layout fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-single-episode-layout-fix.yml
      - .github/scripts/apply_single_episode_layout_fix.py

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply source patch
        run: python3 .github/scripts/apply_single_episode_layout_fix.py

      - name: Commit source patch and clean up
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/details/presentation/details_controller.dart lib/core/extensions/providers/animewitcher_native_provider.dart
          git rm .github/workflows/apply-single-episode-layout-fix.yml .github/scripts/apply_single_episode_layout_fix.py
          git commit -m "Fix single-episode details layout flicker"
          git push origin HEAD:main
