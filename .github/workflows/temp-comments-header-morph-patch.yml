name: Temporary comments header morph patcher

on:
  push:
    branches:
      - fix/comments-header-morph-animation

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'ci: fix temporary comments header patcher'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/comments-header-morph-animation
          fetch-depth: 0

      - name: Apply synchronized toolbar geometry patch
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch_comments_header.py
          python3 /tmp/patch_comments_header.py
          git diff --check
          grep -n "toolbarGeometryAnimationDuration\|applyToolbarGeometry\|targetToolbarTrailingConstant" ios/Runner/AppDelegate.swift

      - name: Commit production fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ios/Runner/AppDelegate.swift
          git commit -m "fix(ios): synchronize comments header morph geometry"
          git push origin HEAD:fix/comments-header-morph-animation
