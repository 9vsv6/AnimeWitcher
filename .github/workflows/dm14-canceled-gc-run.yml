name: DM-14 canceled GC run

on:
  push:
    branches:
      - plan/download-manager-reliability
    paths:
      - .github/workflows/dm14-canceled-gc-run.yml

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: plan/download-manager-reliability
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Apply production patch
        run: python3 tool/dm14_apply_canceled_gc.py

      - name: Verify focused GREEN
        run: |
          flutter test test/core/services/download_canceled_parallel_artifact_gc_guard_test.dart test/core/services/download_delete_tombstone_guard_test.dart --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key
          flutter analyze --no-fatal-warnings --no-fatal-infos lib/core/services/download_service.dart test/core/services/download_canceled_parallel_artifact_gc_guard_test.dart test/core/services/download_delete_tombstone_guard_test.dart
          git diff --check

      - name: Commit and push verified production patch
        run: |
          if git diff --quiet -- lib/core/services/download_service.dart; then
            echo "DM-14 canceled GC production patch already present"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/core/services/download_service.dart
          git commit -m "fix(downloads): clean canceled multipart artifacts safely (DM-14)"
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin plan/download-manager-reliability
          flutter test test/core/services/download_canceled_parallel_artifact_gc_guard_test.dart test/core/services/download_delete_tombstone_guard_test.dart --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key
          git push origin HEAD:plan/download-manager-reliability
