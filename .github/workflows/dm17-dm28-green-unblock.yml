name: DM-17 + DM-28 staged GREEN unblock

on:
  push:
    branches:
      - plan/download-manager-reliability
    paths:
      - .github/workflows/dm17-dm28-green-unblock.yml
      - lib/core/services/download_service.dart
      - lib/core/services/download_range_transfer.dart
      - lib/core/services/download_continued_processing_service.dart
      - lib/core/services/download_transport.dart
      - test/core/services/download_teardown_barrier_test.dart
      - test/core/services/download_range_transfer_test.dart
      - test/core/services/download_transport_test.dart
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dm17-dm28-green-unblock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  green:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          ref: plan/download-manager-reliability
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Install locked dependencies and generate sources
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Verify generated sources are synchronized
        run: git diff --exit-code

      - name: Verify DM-17 teardown behavior
        run: >-
          flutter test
          test/core/services/download_teardown_barrier_test.dart
          test/core/services/download_range_transfer_test.dart
          --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key

      - name: Verify DM-28 transport policy
        run: >-
          flutter test
          test/core/services/download_transport_test.dart
          --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key

      - name: Analyze affected download surfaces
        run: >-
          flutter analyze --no-fatal-warnings --no-fatal-infos
          lib/core/services/download_service.dart
          lib/core/services/download_range_transfer.dart
          lib/core/services/download_continued_processing_service.dart
          lib/core/services/download_transport.dart

      - name: Diff sanity
        run: git diff --check
