name: Apply download transport refactor

on:
  push:
    branches: [refactor/download-transport-modernization]

permissions:
  contents: write

concurrency:
  group: apply-download-transport-refactor
  cancel-in-progress: true

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/download-transport-modernization
          fetch-depth: 0

      - name: Apply guarded patch
        run: python3 tool/apply_download_transport_patch.py

      - name: Commit integrated service
        run: |
          if git diff --quiet -- lib/core/services/download_service.dart; then
            echo "Expected transport patch produced no diff" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/core/services/download_service.dart
          git commit -m "Integrate native transfer transport into download service"
          git push origin HEAD:refactor/download-transport-modernization
