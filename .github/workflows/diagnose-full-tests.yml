name: Diagnose full Flutter tests

on:
  push:
    branches: [plan/download-manager-reliability]

permissions:
  contents: read

concurrency:
  group: diagnose-full-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Install dependencies and generate sources
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Run suite and capture failures
        id: tests
        shell: bash
        run: |
          set +e
          flutter test --reporter json --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key 2>&1 | tee /tmp/flutter-test.jsonl
          test_exit=${PIPESTATUS[0]}
          set -e
          python3 - <<'PY'
          import json
          from pathlib import Path

          tests = {}
          errors = {}
          failed = []
          raw = Path('/tmp/flutter-test.jsonl').read_text(errors='replace').splitlines()
          for line in raw:
              try:
                  event = json.loads(line)
              except Exception:
                  continue
              kind = event.get('type')
              if kind == 'testStart':
                  test = event.get('test') or {}
                  tests[test.get('id')] = test
              elif kind == 'error':
                  test_id = event.get('testID')
                  errors.setdefault(test_id, []).append({
                      'error': event.get('error', ''),
                      'stackTrace': event.get('stackTrace', ''),
                  })
              elif kind == 'testDone' and event.get('result') == 'failure':
                  failed.append(event.get('testID'))

          lines = []
          for test_id in failed:
              test = tests.get(test_id, {})
              lines.append(f"TEST: {test.get('name', '<unknown>')}")
              lines.append(f"URL: {test.get('url', '<unknown>')}")
              if test.get('line') is not None:
                  lines.append(f"LINE: {test.get('line')}")
              for detail in errors.get(test_id, []):
                  if detail['error']:
                      lines.append('ERROR: ' + detail['error'])
                  if detail['stackTrace']:
                      lines.append('STACK:\n' + detail['stackTrace'])
              lines.append('---')
          if not lines:
              lines = ['No failing testDone events were parsed.']
          Path('/tmp/failures.txt').write_text('\n'.join(lines))
          print(Path('/tmp/failures.txt').read_text())
          PY
          exit "$test_exit"

      - name: Upload failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-test-failures
          path: /tmp/failures.txt
          retention-days: 1
