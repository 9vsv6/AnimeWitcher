name: Fix PR181 analyzer errors

on:
  push:
    branches: [fix/download-resume-stalls]
    paths:
      - '.github/workflows/fix-pr181-analyzer.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/download-resume-stalls
          fetch-depth: 0

      - name: Apply analyzer fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('lib/core/services/persistent_parallel_download.dart')
          s = p.read_text()
          replacements = {
              "_DownloadPart.fromJson(Map<String, dynamic>.from(part))":
                  "_DownloadPart.fromJson(Map<String, dynamic>.from(part as Map))",
              "final chunk = Map<String, dynamic>.from(raw);":
                  "final chunk = Map<String, dynamic>.from(raw as Map);",
              "Map<String, dynamic>.from(chunk['task']),":
                  "Map<String, dynamic>.from(chunk['task'] as Map),",
              "TaskProgressUpdate(\n                  session.task,\n                  progress,\n                  expectedFileSize: session.size,\n                  networkSpeed: session.parts.fold<double>(\n                    0,\n                    (sum, part) => sum + part.speed,\n                  ),\n                )":
                  "TaskProgressUpdate(\n                  session.task,\n                  progress,\n                  session.size,\n                  session.parts.fold<double>(\n                    0,\n                    (sum, part) => sum + part.speed,\n                  ),\n                )",
              "TaskProgressUpdate(session.task, 1, expectedFileSize: session.size)":
                  "TaskProgressUpdate(session.task, 1, session.size)",
              "Task.createFromJson(Map<String, dynamic>.from(json['task']))":
                  "Task.createFromJson(\n      Map<String, dynamic>.from(json['task'] as Map),\n    )",
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'missing persistent marker: {old[:80]!r}')
              s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('lib/core/services/download_service.dart')
          s = p.read_text()
          old = "TaskProgressUpdate(task, written / total, expectedFileSize: total)"
          new = "TaskProgressUpdate(task, written / total, total)"
          if old not in s:
              raise SystemExit('missing range progress marker')
          s = s.replace(old, new, 1)

          old = '''  Future<List<Task>> _liveTransferTasks() async {
    // allTasks/taskForId include persisted paused tasks. They are not proof
    // that URLSession or a worker currently owns a transfer.
    // ignore: invalid_use_of_visible_for_testing_member
    final paused =
        (await FileDownloader().downloaderForTesting.getPausedTasks())
            .map((task) => task.taskId)
            .toSet();
    return (await FileDownloader().allTasks(allGroups: true))
        .where((task) => !paused.contains(task.taskId))
        .toList();
  }
'''
          new = '''  Future<List<Task>> _liveTransferTasks() async {
    // allTasks/taskForId include persisted paused tasks. They are not proof
    // that URLSession or a worker currently owns a transfer. Use the public
    // tracked-task database to exclude durable paused records instead of the
    // plugin's testing-only downloader API.
    final paused = (await FileDownloader().database.allRecordsWithStatus(
      TaskStatus.paused,
    )).map((record) => record.taskId).toSet();
    return (await FileDownloader().allTasks(allGroups: true))
        .where((task) => !paused.contains(task.taskId))
        .toList();
  }
'''
          if old not in s:
              raise SystemExit('missing live-transfer marker')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY

      - name: Format changed Dart files
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Format and validate patch
        shell: bash
        run: |
          set -euo pipefail
          dart format lib/core/services/download_service.dart lib/core/services/persistent_parallel_download.dart
          git diff --check

      - name: Commit fixes and remove helper workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/fix-pr181-analyzer.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: resolve multipart downloader analyzer errors'
          git push origin HEAD:fix/download-resume-stalls
